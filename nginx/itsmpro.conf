# ════════════════════════════════════════════════════════
# ITSM Pro — Nginx Production Configuration
# Place at: /etc/nginx/sites-available/itsmpro
# Then: sudo ln -s /etc/nginx/sites-available/itsmpro /etc/nginx/sites-enabled/
# ════════════════════════════════════════════════════════

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream Node.js API
upstream itsmpro_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── HTTP → HTTPS redirect ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name itsm.yourcompany.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itsm.yourcompany.com;

    # ── SSL ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/itsm.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itsm.yourcompany.com/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # ── Security headers ─────────────────────────
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header X-XSS-Protection          "1; mode=block"      always;
    add_header Referrer-Policy           "strict-origin"      always;
    add_header Permissions-Policy        "geolocation=()"     always;

    # ── Gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    root /var/www/itsmpro/frontend/dist;
    index index.html;

    # ── API proxy ─────────────────────────────────
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass         http://itsmpro_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Extra rate limiting on login
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://itsmpro_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static file uploads ───────────────────────
    location /uploads/ {
        alias /var/www/itsmpro/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check passthrough ──────────────────
    location /health {
        proxy_pass http://itsmpro_api;
        access_log off;
    }

    # ── React SPA fallback ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Logs ──────────────────────────────────────
    access_log /var/log/nginx/itsmpro_access.log;
    error_log  /var/log/nginx/itsmpro_error.log;

    # ── Block common attack paths ─────────────────
    location ~ /\. { deny all; }
    location ~ ^/(\.git|\.env|package\.json) { deny all; }
}
