    const submit=()=>{
      const e=validate();if(Object.keys(e).length){setErrs(e);return;}
      const nc={id:genId('CI'),name:f.name,type:ciType,status:f.status,env:f.env,location:f.location,dept:f.dept,assignedTo:f.assignedTo||null,managedBy:f.managedBy,purchaseDate:f.purchaseDate||null,warrantyExpiry:f.warrantyExpiry||null,lastSeen:now(),tags:f.tags.split(',').map(s=>s.trim()).filter(Boolean),fields:fieldVals,relationships:[],incidents:[],changes:[],problems:[],notes:[],history:[{action:'Registered in CMDB',by:me.id,at:now(),note:`CI type: ${ciType}`}]};
      setCIs(p=>[nc,...p]);addToast('success',`${nc.name} registered in CMDB`);setSN(false);
    };

    return <div>
      <div style={{display:'flex',gap:0,marginBottom:16,background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:3}}>
        {['1. CI Type','2. Details','3. Attributes'].map((s,i)=><div key={s} style={{flex:1,padding:'6px 10px',borderRadius:5,background:step===i+1?C.primary:'transparent',color:step===i+1?'#fff':C.t2,fontSize:11,fontWeight:step===i+1?700:400,cursor:'pointer',textAlign:'center'}} onClick={()=>setStep(i+1)}>{s}</div>)}
      </div>

      {step===1&&<div>
        <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:10}}>Select CI Type</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7}}>
          {Object.entries(CI_TYPES).map(([k,v])=><div key={k} onClick={()=>{setCIType(k);setFV({});}} style={{padding:'10px 12px',borderRadius:8,border:`2px solid ${ciType===k?v.color:C.border}`,background:ciType===k?v.color+'18':'#fff',cursor:'pointer',transition:'all .15s'}}>
            <div style={{fontSize:22,marginBottom:4}}>{v.icon}</div>
            <div style={{fontSize:11,fontWeight:700,color:ciType===k?v.color:C.t1}}>{k}</div>
            <div style={{fontSize:9,color:C.t3}}>{v.cat}</div>
          </div>)}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}><Btn onClick={()=>setStep(2)}>Next →</Btn></div>
      </div>}

      {step===2&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div style={{gridColumn:'1/-1',display:'flex',alignItems:'center',gap:10,padding:'10px 14px',background:CI_TYPES[ciType]?.color+'12',borderRadius:8,border:`1px solid ${CI_TYPES[ciType]?.color}40`}}>
          <span style={{fontSize:28}}>{CI_TYPES[ciType]?.icon}</span>
          <div><div style={{fontSize:12,fontWeight:700,color:CI_TYPES[ciType]?.color}}>{ciType}</div><div style={{fontSize:10,color:C.t2}}>{CI_TYPES[ciType]?.cat}</div></div>
        </div>
        <Input label="CI Name / Hostname" value={f.name} onChange={ff('name')} required error={errs.name} sx={{gridColumn:'1/-1'}} placeholder={ciType==='Laptop'?'e.g. JD-LT-001':ciType==='Server'?'e.g. PROD-APP-01':'CI name…'}/>
        <Sel label="Status" value={f.status} onChange={ff('status')} opts={CI_STATUSES.map(s=>({v:s,l:s}))} required/>
        <Sel label="Environment" value={f.env} onChange={ff('env')} opts={CI_ENVIRONMENTS.map(e=>({v:e,l:e}))} required/>
        <Sel label="Location" value={f.location} onChange={ff('location')} opts={LOCATIONS.map(l=>({v:l,l:l}))} sx={{gridColumn:'1/-1'}}/>
        <Sel label="Department" value={f.dept} onChange={ff('dept')} opts={DEPARTMENTS.map(d=>({v:d,l:d}))}/>
        <Sel label="Managed By" value={f.managedBy} onChange={ff('managedBy')} opts={USERS.filter(u=>['AGENT','ADMIN','SUPER_ADMIN','SERVICE_MANAGER'].includes(u.role)).map(u=>({v:u.id,l:u.name}))}/>
        <Sel label="Assigned To (User)" value={f.assignedTo} onChange={ff('assignedTo')} opts={[{v:'',l:'— Not Assigned —'},...USERS.map(u=>({v:u.id,l:`${u.name} (${u.dept})`}))]} sx={{gridColumn:'1/-1'}}/>
        <Input label="Purchase Date" type="date" value={f.purchaseDate} onChange={ff('purchaseDate')}/>
        <Input label="Warranty Expiry" type="date" value={f.warrantyExpiry} onChange={ff('warrantyExpiry')}/>
        <Input label="Tags (comma-separated)" value={f.tags} onChange={ff('tags')} placeholder="e.g. production, critical, sql" sx={{gridColumn:'1/-1'}}/>
        <div style={{gridColumn:'1/-1',display:'flex',gap:8,justifyContent:'flex-end'}}><Btn variant="outline" onClick={()=>setStep(1)}>← Back</Btn><Btn onClick={()=>setStep(3)}>Next →</Btn></div>
      </div>}

      {step===3&&<div style={{display:'flex',flexDirection:'column',gap:0}}>
        <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:10}}>Technical Attributes for {ciType}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
          {CI_TYPES[ciType]?.fields.map(field=>(
            <Input key={field} label={field} value={fieldVals[field]||''} onChange={v=>setFV(p=>({...p,[field]:v}))} placeholder={field} sx={field.length>20?{gridColumn:'1/-1'}:{}}/>
          ))}
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:14,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
          <Btn variant="outline" onClick={()=>setStep(2)}>← Back</Btn>
          <Btn onClick={submit}>{CI_TYPES[ciType]?.icon} Register CI</Btn>
        </div>
      </div>}
    </div>;
  };

  // ─── CI DETAIL PANEL ──────────────────────────
  const CIDetail=({ci})=>{
    const[detTab,setDT]=useState('details');
    const[editMode,setEM]=useState(false);
    const[showRelForm,setSRF]=useState(false);
    const[relTarget,setRT]=useState('');
    const[relType,setRTy]=useState(REL_TYPES[0]);
    const[noteText,setNT]=useState('');
    const[editStatus,setES]=useState(ci.status);
    const typeInfo=CI_TYPES[ci.type]||{icon:'📋',color:C.primary,fields:[]};
    const assignedUser=USERS.find(u=>u.id===ci.assignedTo);
    const managedUser=USERS.find(u=>u.id===ci.managedBy);
    const isExpired=ci.warrantyExpiry&&new Date(ci.warrantyExpiry)<Date.now();
    const isExpiringSoon=ci.warrantyExpiry&&!isExpired&&(new Date(ci.warrantyExpiry)-Date.now())<86400000*30;

    const addRelationship=()=>{
      if(!relTarget)return;
      const newRel={targetId:relTarget,type:relType,direction:'out'};
      const updCI={...ci,relationships:[...(ci.relationships||[]),newRel],history:[...(ci.history||[]),{action:`Relationship Added: ${relType} → ${cis.find(c=>c.id===relTarget)?.name}`,by:me.id,at:now(),note:''}]};
      updateCI(updCI);setSRF(false);
    };

    const addNote=()=>{
      if(!noteText.trim())return;
      const n={id:'n'+Date.now(),text:noteText,by:me.id,at:now()};
      updateCI({...ci,notes:[...(ci.notes||[]),n],history:[...(ci.history||[]),{action:'Note Added',by:me.id,at:now(),note:noteText.substring(0,80)}]});
      setNT('');
    };

    const updateStatus=()=>{
      if(editStatus===ci.status)return;
      updateCI({...ci,status:editStatus,history:[...(ci.history||[]),{action:`Status: ${editStatus}`,by:me.id,at:now(),note:`Changed from ${ci.status}`}]});
    };

    const rels=ci.relationships||[];
    const relCIs=rels.map(r=>({...r,ci:cis.find(c=>c.id===r.targetId)})).filter(r=>r.ci);
    const inboundRels=cis.flatMap(c=>(c.relationships||[]).filter(r=>r.targetId===ci.id&&r.direction==='out').map(r=>({...r,ci:c,direction:'in'})));

    return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* Header */}
      <div style={{padding:'12px 14px',borderBottom:`1px solid ${C.border}`,background:`${typeInfo.color}08`,flexShrink:0}}>
        <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:5}}>
          <span style={{fontSize:22}}>{typeInfo.icon}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:14,fontWeight:800,color:C.t1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ci.name}</div>
            <div style={{fontSize:10,color:C.t2}}>{ci.id} · {ci.type}</div>
          </div>
          <button onClick={()=>setSelected(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:C.t3,flexShrink:0}}>×</button>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
          <StatusBadge status={ci.status}/>
          <EnvBadge env={ci.env}/>
          {isExpired&&<Tag label="⚠ Out of Warranty" color={C.danger} bg={C.dangerLt}/>}
          {isExpiringSoon&&<Tag label="⏰ Expiring Soon" color={C.warning} bg={C.warningLt}/>}
        </div>
      </div>

      {/* Tab bar */}
      <div style={{display:'flex',borderBottom:`1px solid ${C.border}`,flexShrink:0,overflowX:'auto'}}>
        {[['details','Details'],['attrs','Attributes'],['rels','Relations'],['linked','Linked'],['notes','Notes'],['history','History']].map(([v,l])=>(
          <button key={v} onClick={()=>setDT(v)} style={{padding:'8px 12px',border:'none',borderBottom:`2px solid ${detTab===v?typeInfo.color:'transparent'}`,background:'transparent',color:detTab===v?typeInfo.color:C.t2,fontSize:11,fontWeight:detTab===v?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>{l}</button>
        ))}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:14}}>
        {detTab==='details'&&<div>
          {canEdit&&<div style={{display:'flex',gap:6,marginBottom:12}}>
            <Sel value={editStatus} onChange={setES} opts={CI_STATUSES.map(s=>({v:s,l:s}))} sx={{minWidth:140}}/>
            <Btn size="sm" onClick={updateStatus} disabled={editStatus===ci.status}>Update Status</Btn>
          </div>}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
            {[['CI ID',ci.id],['Type',ci.type],['Status',ci.status],['Environment',ci.env],['Location',ci.location],['Department',ci.dept],['Assigned To',assignedUser?.name||'—'],['Managed By',managedUser?.name||'—'],['Purchase Date',ci.purchaseDate||'—'],['Warranty Expiry',ci.warrantyExpiry||'—'],['Last Seen',ci.lastSeen]].map(([k,v])=>(
              <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'6px 9px',gridColumn:k==='CI ID'?'1/-1':undefined}}>
                <div style={{fontSize:9,color:C.t3,marginBottom:2,textTransform:'uppercase',letterSpacing:'0.05em'}}>{k}</div>
                <div style={{fontSize:11,fontWeight:600,color:k==='Status'?({Active:C.success,'In Repair':C.warning,Retired:C.t3}[v]||C.t1):C.t1,wordBreak:'break-all'}}>{v}</div>
              </div>
            ))}
          </div>
          {ci.tags?.length>0&&<div style={{marginTop:8,display:'flex',gap:4,flexWrap:'wrap'}}>
            {ci.tags.map(t=><Tag key={t} label={`#${t}`} color={C.primary} bg={C.primaryLt}/>)}
          </div>}
        </div>}

        {detTab==='attrs'&&<div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
            {Object.entries(ci.fields||{}).map(([k,v])=>(
              <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'6px 9px',gridColumn:k.length>15?'1/-1':undefined}}>
                <div style={{fontSize:9,color:C.t3,marginBottom:2,textTransform:'uppercase',letterSpacing:'0.04em'}}>{k}</div>
                <div style={{fontSize:11,fontWeight:600,color:C.t1,wordBreak:'break-all'}}>{v||'—'}</div>
              </div>
            ))}
          </div>
        </div>}

        {detTab==='rels'&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:C.t1}}>CI Relationships ({relCIs.length+inboundRels.length})</div>
            {canEdit&&<Btn size="sm" variant="teal" icon="+" onClick={()=>setSRF(!showRelForm)}>Add</Btn>}
          </div>

          {showRelForm&&<div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:11,marginBottom:12}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <Sel label="This CI" value={relType} onChange={setRTy} opts={REL_TYPES.map(t=>({v:t,l:t}))}/>
              <Sel label="Target CI" value={relTarget} onChange={setRT} opts={[{v:'',l:'— Select CI —'},...cis.filter(c=>c.id!==ci.id).map(c=>({v:c.id,l:`${c.name} (${c.type})`}))]}/>
            </div>
            <div style={{display:'flex',gap:7,marginTop:8}}><Btn size="sm" onClick={addRelationship} disabled={!relTarget}>Add Relationship</Btn><Btn size="sm" variant="outline" onClick={()=>setSRF(false)}>Cancel</Btn></div>
          </div>}

          {/* Outbound */}
          {relCIs.length>0&&<div style={{marginBottom:10}}>
            <div style={{fontSize:10,color:C.t3,fontWeight:700,textTransform:'uppercase',marginBottom:6}}>Outbound ({relCIs.length})</div>
            {relCIs.map(({ci:tc,type},i)=>{const tt=CI_TYPES[tc.type];return <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:7,border:`1px solid ${C.border}`,marginBottom:5,cursor:'pointer',transition:'all .15s'}} onClick={()=>setSelected(tc)} onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <span style={{fontSize:18}}>{tt?.icon||'📋'}</span>
              <div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:C.t1}}>{tc.name}</div><div style={{fontSize:9,color:C.t2}}>{tc.type} · {tc.env}</div></div>
              <span style={{fontSize:9,color:typeInfo.color,background:typeInfo.color+'15',padding:'2px 7px',borderRadius:20,fontWeight:700,whiteSpace:'nowrap'}}>{type}</span>
              <StatusBadge status={tc.status}/>
            </div>;})}
          </div>}

          {/* Inbound */}
          {inboundRels.length>0&&<div>
            <div style={{fontSize:10,color:C.t3,fontWeight:700,textTransform:'uppercase',marginBottom:6}}>Inbound ({inboundRels.length})</div>
            {inboundRels.map(({ci:sc,type},i)=>{const st=CI_TYPES[sc.type];return <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:7,border:`1px solid ${C.border}`,marginBottom:5,cursor:'pointer',transition:'all .15s'}} onClick={()=>setSelected(sc)} onMouseEnter={e=>e.currentTarget.style.background='#F8FAFC'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <span style={{fontSize:18}}>{st?.icon||'📋'}</span>
              <div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:C.t1}}>{sc.name}</div><div style={{fontSize:9,color:C.t2}}>{sc.type} · {sc.env}</div></div>
              <span style={{fontSize:9,color:C.t3,background:'#F1F5F9',padding:'2px 7px',borderRadius:20,fontWeight:700,whiteSpace:'nowrap'}}>← {type}</span>
              <StatusBadge status={sc.status}/>
            </div>;})}
          </div>}

          {relCIs.length===0&&inboundRels.length===0&&<div style={{padding:30,textAlign:'center',color:C.t3,fontSize:12}}>No relationships defined</div>}
        </div>}

        {detTab==='linked'&&<div>
          {[['🚨 Incidents',ci.incidents||[],'danger'],['🔧 Changes',ci.changes||[],'primary'],['🔍 Problems',ci.problems||[],'purple']].map(([label,ids,color])=>(
            ids.length>0&&<div key={label} style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:6}}>{label}</div>
              {ids.map(id=><div key={id} style={{padding:'7px 10px',borderRadius:6,background:'#F8FAFC',border:`1px solid ${C.border}`,marginBottom:4,display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontFamily:'monospace',fontSize:11,color:C[color],fontWeight:800}}>{id}</span>
              </div>)}
            </div>
          ))}
          {(ci.incidents||[]).length===0&&(ci.changes||[]).length===0&&(ci.problems||[]).length===0&&<div style={{padding:30,textAlign:'center',color:C.t3,fontSize:12}}>No linked tickets</div>}
        </div>}

        {detTab==='notes'&&<div>
          {(ci.notes||[]).map(n=>{const u=USERS.find(x=>x.id===n.by);return <div key={n.id} style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:7,padding:10,marginBottom:7}}>
            <div style={{display:'flex',gap:7,alignItems:'center',marginBottom:4}}><Avatar name={u?.name||'?'} size={20}/><span style={{fontSize:10,fontWeight:700,color:C.t1}}>{u?.name||'—'}</span><span style={{fontSize:9,color:C.t3}}>{n.at}</span></div>
            <div style={{fontSize:11,color:C.t1,lineHeight:1.6,paddingLeft:27}}>{n.text}</div>
          </div>;})}
          {canEdit&&<div style={{display:'flex',gap:7,alignItems:'flex-end',marginTop:8}}>
            <div style={{flex:1}}><Textarea value={noteText} onChange={setNT} rows={2} placeholder="Add note about this CI…"/></div>
            <Btn size="sm" onClick={addNote} disabled={!noteText.trim()}>Add</Btn>
          </div>}
        </div>}

        {detTab==='history'&&<div>
          {[...(ci.history||[])].reverse().map((h,i)=>{const u=USERS.find(x=>x.id===h.by);return <div key={i} style={{display:'flex',gap:8,marginBottom:8,paddingBottom:8,borderBottom:`1px solid ${C.borderFaint}`}}>
            <Avatar name={u?.name||'System'} size={22}/>
            <div style={{flex:1}}><div style={{display:'flex',gap:5,flexWrap:'wrap'}}><span style={{fontSize:10,fontWeight:700,color:C.t1}}>{u?.name||'System'}</span><span style={{fontSize:9,color:C.t3}}>{h.at}</span></div>
              <div style={{fontSize:10,color:typeInfo.color,fontWeight:700}}>{h.action}</div>
              {h.note&&<div style={{fontSize:10,color:C.t2,marginTop:1}}>{h.note}</div>}
            </div>
          </div>;})}
        </div>}
      </div>
    </div>;
  };

  // ─── RELATIONSHIP GRAPH (SVG-based) ───────────
  const RelationshipGraph=()=>{
    const[hoverId,setHover]=useState(null);
    const[centerCI,setCenterCI]=useState(cis[0]?.id);
    const center=cis.find(c=>c.id===centerCI)||cis[0];
    if(!center)return null;
    const rels=center.relationships||[];
    const relCIs=rels.map(r=>({...r,ci:cis.find(c=>c.id===r.targetId)})).filter(r=>r.ci);
    const inbound=cis.flatMap(c=>(c.relationships||[]).filter(r=>r.targetId===center.id).map(r=>({...r,ci:c}))).filter(r=>r.ci);
    const allNodes=[...relCIs,...inbound];
    const R=150,cx=320,cy=200;
    const angle=i=>i*(2*Math.PI/Math.max(allNodes.length,1));

    return <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:800,color:C.t1}}>CI Relationship Map</div>
        <Sel value={centerCI} onChange={setCenterCI} opts={cis.map(c=>({v:c.id,l:`${c.name} (${c.type})`}))} sx={{minWidth:220}}/>
      </div>
      <div style={{overflowX:'auto'}}>
        <svg width="100%" viewBox={`0 0 640 400`} style={{maxHeight:400}}>
          <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" strokeWidth="2" strokeLinecap="round"/></marker></defs>
          {/* Connections */}
          {allNodes.map((r,i)=>{
            const nx=cx+R*Math.cos(angle(i)-Math.PI/2);
            const ny=cy+R*Math.sin(angle(i)-Math.PI/2);
            const isOut=r.direction==='out'||(rels.some(rel=>rel.targetId===r.ci.id));
            return <g key={i}>
              <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="#CBD5E1" strokeWidth="1.5" strokeDasharray={isOut?"":"4 3"} markerEnd="url(#arr)" opacity={hoverId&&hoverId!==r.ci.id?.5:1}/>
              <text x={(cx+nx)/2} y={(cy+ny)/2-5} fontSize="8" fill="#94A3B8" textAnchor="middle">{r.type}</text>
            </g>;})}

          {/* Center node */}
          <g onClick={()=>setSelected(center)} style={{cursor:'pointer'}}>
            <circle cx={cx} cy={cy} r={32} fill={CI_TYPES[center.type]?.color||C.primary} opacity={0.12}/>
            <circle cx={cx} cy={cy} r={32} fill="none" stroke={CI_TYPES[center.type]?.color||C.primary} strokeWidth="2.5"/>
            <text x={cx} y={cy-6} fontSize="18" textAnchor="middle" dominantBaseline="middle">{CI_TYPES[center.type]?.icon||'📋'}</text>
            <text x={cx} y={cy+14} fontSize="9" fontWeight="700" fill={C.t1} textAnchor="middle">{center.name.substring(0,14)}</text>
          </g>

          {/* Related nodes */}
          {allNodes.map((r,i)=>{
            const nx=cx+R*Math.cos(angle(i)-Math.PI/2);
            const ny=cy+R*Math.sin(angle(i)-Math.PI/2);
            const ci=r.ci;
            const t=CI_TYPES[ci.type]||{icon:'📋',color:C.t3};
            const isHov=hoverId===ci.id;
            return <g key={i} onClick={()=>{setCenterCI(ci.id);setSelected(ci);}} onMouseEnter={()=>setHover(ci.id)} onMouseLeave={()=>setHover(null)} style={{cursor:'pointer'}}>
              <circle cx={nx} cy={ny} r={isHov?26:22} fill={t.color} opacity={isHov?0.2:0.1} style={{transition:'r .15s'}}/>
              <circle cx={nx} cy={ny} r={isHov?26:22} fill="none" stroke={t.color} strokeWidth={isHov?2:1.5}/>
              <text x={nx} y={ny-3} fontSize="14" textAnchor="middle" dominantBaseline="middle">{t.icon}</text>
              <text x={nx} y={ny+16} fontSize="8" fontWeight={isHov?700:400} fill={C.t1} textAnchor="middle">{ci.name.substring(0,12)}</text>
              <text x={nx} y={ny+26} fontSize="7" fill={C.t3} textAnchor="middle">{ci.type}</text>
            </g>;})}
        </svg>
      </div>
      <div style={{fontSize:10,color:C.t3,textAlign:'center',marginTop:6}}>Click any node to re-center · Solid lines = outbound · Dashed = inbound</div>
    </div>;
  };

  // ─── SOFTWARE LICENSES ────────────────────────
  const LicenseView=()=>{
    const licenses=cis.filter(c=>c.type==='Software License');
    return <div>
      <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:12}}>Software License Management</div>
      {licenses.length===0?<div style={{padding:40,textAlign:'center',color:C.t3}}>No software licenses tracked</div>:licenses.map(lic=>{
        const used=parseInt(lic.fields?.['Seats Used']||0);
        const total=parseInt(lic.fields?.['License Count']||1);
        const pct=total>0?Math.min(100,Math.round(used/total*100)):0;
        const expiry=lic.warrantyExpiry||lic.fields?.['Expiry Date'];
        const expired=expiry&&new Date(expiry)<Date.now();
        const expiringSoon=expiry&&!expired&&(new Date(expiry)-Date.now())<86400000*30;
        return <div key={lic.id} onClick={()=>setSelected(lic)} style={{background:C.card,borderRadius:8,border:`1px solid ${expired?C.danger:expiringSoon?C.warning:C.border}`,padding:'12px 14px',marginBottom:8,cursor:'pointer',transition:'all .15s'}} onMouseEnter={e=>e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)'} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
          <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
            <span style={{fontSize:28}}>📄</span>
            <div style={{flex:1}}>
              <div style={{display:'flex',gap:6,marginBottom:4,flexWrap:'wrap',alignItems:'center'}}>
                <span style={{fontSize:13,fontWeight:700,color:C.t1}}>{lic.name}</span>
                <StatusBadge status={lic.status}/>
                {expired&&<Tag label="⚠ EXPIRED" color={C.danger} bg={C.dangerLt}/>}
                {expiringSoon&&<Tag label="⏰ Expiring Soon" color={C.warning} bg={C.warningLt}/>}
              </div>
              <div style={{display:'flex',gap:14,flexWrap:'wrap',marginBottom:8}}>
                <span style={{fontSize:11,color:C.t2}}>Vendor: {lic.fields?.Vendor||'—'}</span>
                <span style={{fontSize:11,color:C.t2}}>Type: {lic.fields?.['License Type']||'—'}</span>
                <span style={{fontSize:11,color:C.t2}}>Expires: {expiry||'—'}</span>
                <span style={{fontSize:11,color:C.t2}}>Cost: {lic.fields?.['Cost (USD)']||'—'}</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{flex:1,height:6,background:'#F1F5F9',borderRadius:3}}>
                  <div style={{height:6,borderRadius:3,background:pct>90?C.danger:pct>70?C.warning:C.success,width:`${pct}%`,transition:'width .5s'}}/>
                </div>
                <span style={{fontSize:11,fontWeight:700,color:pct>90?C.danger:pct>70?C.warning:C.t1,whiteSpace:'nowrap'}}>{used}/{total} seats ({pct}%)</span>
              </div>
            </div>
          </div>
        </div>;})}
    </div>;
  };

  return <div style={{display:'flex',height:'calc(100vh - 50px)'}}>
    <div style={{flex:1,overflowY:'auto',padding:'16px 18px',borderRight:selected?`1px solid ${C.border}`:'none',minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Configuration Management Database</h2><p style={{fontSize:10,color:C.t2,margin:0}}>{cis.length} CIs · {cis.filter(c=>c.status==='Active').length} active · {cis.filter(c=>c.type==='Software License').length} licenses</p></div>
        {canEdit&&<Btn icon="+" onClick={()=>setSN(true)}>Register CI</Btn>}
      </div>

      <div style={{display:'flex',gap:0,marginBottom:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:3,width:'fit-content',flexWrap:'wrap'}}>
        {[['list','📋 All CIs'],['licenses','📄 Licenses'],['graph','🗺️ Topology']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:'5px 12px',borderRadius:5,border:'none',background:tab===v?C.teal:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>{l}</button>)}
      </div>

      {tab==='graph'&&<RelationshipGraph/>}
      {tab==='licenses'&&<LicenseView/>}

      {tab==='list'&&<>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:9,marginBottom:10,display:'flex',gap:7,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:180}}><Input placeholder="Search name, ID, IP, serial, hostname…" value={search} onChange={v=>{setSearch(v);setPage(1);}}/></div>
          <Sel value={fCat} onChange={v=>{setFC(v);setPage(1);}} opts={[{v:'',l:'All Categories'},...cats.map(c=>({v:c,l:c}))]} sx={{minWidth:120}}/>
          <Sel value={fType} onChange={v=>{setFT(v);setPage(1);}} opts={[{v:'',l:'All Types'},...Object.keys(CI_TYPES).map(t=>({v:t,l:t}))]} sx={{minWidth:140}}/>
          <Sel value={fStatus} onChange={v=>{setFS(v);setPage(1);}} opts={[{v:'',l:'All Status'},...CI_STATUSES.map(s=>({v:s,l:s}))]} sx={{minWidth:120}}/>
          <Sel value={fEnv} onChange={v=>{setFE(v);setPage(1);}} opts={[{v:'',l:'All Env'},...CI_ENVIRONMENTS.map(e=>({v:e,l:e}))]} sx={{minWidth:110}}/>
          {(search||fType||fStatus||fEnv||fCat)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFT('');setFS('');setFE('');setFC('');setPage(1);}}>Clear ×</Btn>}
        </div>

        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',minWidth:820}}>
              <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
                {['CI','Name','Type','Status','Environment','Location','Managed By','Relationships','Last Seen'].map(h=><th key={h} style={{padding:'7px 11px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',letterSpacing:'0.07em',textTransform:'uppercase',whiteSpace:'nowrap'}}>{h}</th>)}
              </tr></thead>
              <tbody>
                {paged.length===0&&<tr><td colSpan={9} style={{padding:40,textAlign:'center',color:C.t3}}>No CIs found</td></tr>}
                {paged.map(ci=>{
                  const t=CI_TYPES[ci.type]||{icon:'📋',color:C.t3};
                  const mgr=USERS.find(u=>u.id===ci.managedBy);
                  const isV=selected?.id===ci.id;
                  const isExpired=ci.warrantyExpiry&&new Date(ci.warrantyExpiry)<Date.now()&&ci.type!=='Cloud Instance';
                  const relCount=(ci.relationships||[]).length+cis.filter(c=>(c.relationships||[]).some(r=>r.targetId===ci.id)).length;
                  return <tr key={ci.id} onClick={()=>setSelected(isV?null:ci)} style={{borderBottom:`1px solid ${C.borderFaint}`,background:isV?`${t.color}08`:isExpired?'#FFF5F5':'transparent',cursor:'pointer',transition:'background .1s'}} onMouseEnter={e=>e.currentTarget.style.background=isV?`${t.color}08`:'#FAFBFF'} onMouseLeave={e=>e.currentTarget.style.background=isV?`${t.color}08`:isExpired?'#FFF5F5':'transparent'}>
                    <td style={{padding:'8px 11px',fontFamily:'monospace',fontSize:9,color:C.t3,fontWeight:700,whiteSpace:'nowrap'}}>{ci.id}</td>
                    <td style={{padding:'8px 11px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:7}}>
                        <span style={{fontSize:18}}>{t.icon}</span>
                        <div>
                          <div style={{fontSize:12,fontWeight:700,color:C.t1,whiteSpace:'nowrap'}}>{ci.name}</div>
                          <div style={{fontSize:9,color:C.t3}}>{ci.fields?.['IP Address']||ci.fields?.['Asset Tag']||ci.fields?.['Serial Number']||''}</div>
                        </div>
                      </div>
                    </td>
                    <td style={{padding:'8px 11px',fontSize:10,color:C.t2,whiteSpace:'nowrap'}}>{ci.type}</td>
                    <td style={{padding:'8px 11px'}}><StatusBadge status={ci.status}/></td>
                    <td style={{padding:'8px 11px'}}><EnvBadge env={ci.env}/></td>
                    <td style={{padding:'8px 11px',fontSize:10,color:C.t2,whiteSpace:'nowrap',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis'}}>{ci.location}</td>
                    <td style={{padding:'8px 11px'}}>
                      {mgr?<div style={{display:'flex',alignItems:'center',gap:5}}><Avatar name={mgr.name} size={18}/><span style={{fontSize:10,color:C.t2}}>{mgr.name.split(' ')[0]}</span></div>:<span style={{fontSize:10,color:C.t3}}>—</span>}
                    </td>
                    <td style={{padding:'8px 11px',textAlign:'center'}}><span style={{fontSize:11,fontWeight:700,color:relCount>0?C.teal:C.t3}}>{relCount}</span></td>
                    <td style={{padding:'8px 11px',fontSize:9,color:C.t3,whiteSpace:'nowrap'}}>{ci.lastSeen}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
          <div style={{padding:'8px 12px',borderTop:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:10,color:C.t2}}>Showing {Math.min((page-1)*PAGE+1,filtered.length)}–{Math.min(page*PAGE,filtered.length)} of {filtered.length}</span>
            <div style={{display:'flex',gap:4}}>
              <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}>‹</Btn>
              {Array.from({length:Math.min(5,totalP)},(_,i)=>{const p=Math.max(1,Math.min(totalP-4,page-2))+i;return p<=totalP?<button key={p} onClick={()=>setPage(p)} style={{width:26,height:26,borderRadius:5,border:`1px solid ${p===page?C.teal:C.border}`,background:p===page?C.teal:'transparent',color:p===page?'#fff':C.t2,fontSize:11,cursor:'pointer'}}>{p}</button>:null;})}
              <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.min(totalP,p+1))} disabled={page>=totalP}>›</Btn>
            </div>
          </div>
        </div>
      </>}
    </div>

    {/* Detail panel */}
    {selected&&<div style={{width:480,flexShrink:0,background:C.card,display:'flex',flexDirection:'column',animation:'slideIn .2s ease',borderLeft:`1px solid ${C.border}`}}>
      <CIDetail ci={selected}/>
    </div>}

    <Modal open={showNew} title="Register Configuration Item" onClose={()=>setSN(false)} width={640}>
      <AddCIForm/>
    </Modal>
  </div>;
};

// ─── MODULE SHELL ─────────────────────────────────
const Shell=({module})=>{
  const M={incidents:{t:'Incident Management',icon:'🚨',color:C.danger,pt:'Part 3 ✓'},service_req:{t:'Service Request Management',icon:'📋',color:C.success,pt:'Part 3 ✓'},imac:{t:'IMAC Module',icon:'🔄',color:C.primary,pt:'Part 2 ✓'},problems:{t:'Problem Management',icon:'🔍',color:C.warning,pt:'Part 4 ✓'},changes:{t:'Change Management',icon:'🔧',color:C.purple,pt:'Part 4 ✓'},knowledge:{t:'Knowledge Base',icon:'📚',color:C.success,pt:'Part 6'},sla:{t:'SLA & Escalation',icon:'⏱️',color:C.warning,pt:'Part 6'},employees:{t:'Employee Mgmt',icon:'👥',color:C.primary,pt:'Part 2 ✓'},users:{t:'User Mgmt',icon:'🔐',color:C.primary,pt:'Part 1 ✓'},reports:{t:'Reports',icon:'📊',color:C.purple,pt:'Part 7'}};
  const c=M[module]||{t:module,icon:'📋',color:C.primary,pt:'Upcoming'};
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'calc(100vh - 110px)'}}>
    <div style={{textAlign:'center',maxWidth:400}}>
      <div style={{width:64,height:64,borderRadius:16,background:`${c.color}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,margin:'0 auto 14px'}}>{c.icon}</div>
      <h2 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 6px'}}>{c.t}</h2>
      <div style={{background:`${c.color}0D`,border:`1px dashed ${c.color}60`,borderRadius:8,padding:'10px 14px',display:'inline-flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:16}}>🔨</span><div><div style={{fontSize:10,fontWeight:800,color:c.color}}>{c.pt}</div><div style={{fontSize:10,color:C.t2}}>Module in scheduled part</div></div>
      </div>
    </div>
  </div>;
};

// ─── LOGIN ────────────────────────────────────────
const Login=({onLogin})=>{
  const[email,setEmail]=useState('');const[pw,setPw]=useState('');const[loading,setL]=useState(false);const[err,setErr]=useState('');const[sel,setSel]=useState(null);
  const DEMOS=[{r:'SUPER_ADMIN',e:'superadmin@itsm.com',p:'Admin@123'},{r:'ADMIN',e:'admin@itsm.com',p:'Admin@123'},{r:'EMPLOYEE',e:'employee@company.com',p:'Employee@123'},{r:'HELPDESK',e:'helpdesk@company.com',p:'Helpdesk@123'},{r:'AGENT',e:'agent@company.com',p:'Agent@123'},{r:'SERVICE_MANAGER',e:'manager@company.com',p:'Manager@123'}];
  const fill=d=>{setEmail(d.e);setPw(d.p);setSel(d.r);setErr('');};
  const sub=e=>{e.preventDefault();if(!email||!pw){setErr('Enter credentials');return;}setL(true);setTimeout(()=>{const u=USERS.find(x=>x.email===email&&x.pw===pw);if(!u){setErr('Invalid credentials');setL(false);return;}onLogin(u);},600);};
  return <div style={{minHeight:'100vh',display:'flex',background:C.bg}}>
    <div style={{width:'42%',background:'linear-gradient(150deg,#0D1B2A,#0F2540 60%,#1A3A6C)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:40,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-60,left:-60,width:260,height:260,borderRadius:'50%',background:'rgba(13,148,136,0.07)'}}/>
      <div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:36,height:36,borderRadius:8,background:C.teal,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>⚡</div><div><div style={{fontSize:17,fontWeight:800,color:'#fff'}}>ITSM<span style={{color:'#5EEAD4'}}>Pro</span></div><div style={{fontSize:8,color:'#475569',letterSpacing:'0.1em',textTransform:'uppercase'}}>Enterprise Service Mgmt</div></div></div></div>
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.teal,letterSpacing:'0.1em',marginBottom:6}}>✅ Part 5 Live</div>
        <h1 style={{fontSize:26,fontWeight:800,color:'#fff',margin:'0 0 10px',lineHeight:1.2}}>Asset & CMDB<br/><span style={{color:'#5EEAD4'}}>Management</span></h1>
        {['12 CI Types (Hardware/Software/Cloud)','3-Step CI Registration Wizard','Multi-tab CI Detail View','CI Relationship Mapping','Interactive Topology Graph','Software License Seat Tracking','Warranty Expiry Alerts','Linked Incidents/Changes/Problems','Full Audit History per CI','In/Outbound Relationship Traversal'].map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}><div style={{width:14,height:14,borderRadius:'50%',background:'rgba(13,148,136,0.25)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><div style={{width:5,height:5,borderRadius:'50%',background:'#5EEAD4'}}/></div><span style={{fontSize:11,color:'#94A3B8'}}>{f}</span></div>)}
      </div>
      <div style={{display:'flex',gap:20,borderTop:'1px solid rgba(255,255,255,0.07)',paddingTop:16}}>{[['15','CIs Registered'],['12','CI Types'],['2','Licenses']].map(([v,l])=><div key={l}><div style={{fontSize:16,fontWeight:800,color:'#fff'}}>{v}</div><div style={{fontSize:10,color:'#475569'}}>{l}</div></div>)}</div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 50px'}}>
      <div style={{width:'100%',maxWidth:380}}>
        <h2 style={{fontSize:22,fontWeight:800,color:C.t1,margin:'0 0 4px'}}>Sign In</h2>
        <p style={{fontSize:12,color:C.t2,margin:'0 0 18px'}}>ITSM Pro — Part 5</p>
        <div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:18}}>
          <p style={{fontSize:9,fontWeight:800,color:C.t3,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 7px'}}>Quick Login</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {DEMOS.map(d=>{const m=ROLE_META[d.r];const a=sel===d.r;return <button key={d.r} onClick={()=>fill(d)} style={{padding:'3px 8px',borderRadius:20,fontSize:10,fontWeight:700,border:`1px solid ${a?m.color:m.border}`,background:a?m.bg:'#fff',color:a?m.color:C.t2,cursor:'pointer'}}>{m.label}</button>;})}
          </div>
        </div>
        <form onSubmit={sub} style={{display:'flex',flexDirection:'column',gap:11}}>
          <Input label="Email" type="email" value={email} onChange={setEmail} required placeholder="you@company.com"/>
          <Input label="Password" type="password" value={pw} onChange={setPw} required placeholder="Password"/>
          {err&&<div style={{padding:'8px 11px',background:C.dangerLt,border:`1px solid #FECACA`,borderRadius:6,fontSize:12,color:C.danger}}>⚠ {err}</div>}
          <Btn type="submit" size="lg" disabled={loading} sx={{width:'100%',justifyContent:'center',marginTop:3}}>{loading?'Signing in…':'Sign In →'}</Btn>
        </form>
      </div>
    </div>
  </div>;
};

// ─── MAIN APP ─────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[cis,setCIs]=useState(SEED_CIS);
  const[active,setActive]=useState('dashboard');
  const[col,setCol]=useState(false);
  const[toasts,setToasts]=useState([]);
  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);};
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome, ${u.name}!`);};
  const logout=()=>{setUser(null);setActive('dashboard');};
  if(!user)return <Login onLogin={login}/>;
  const sw=col?56:228;
  const render=()=>{
    if(active==='dashboard')return <Dashboard user={user} cis={cis}/>;
    if(active==='cmdb')return <CMDBModule me={user} cis={cis} setCIs={setCIs} addToast={addToast}/>;
    return <Shell module={active}/>;
  };
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <Sidebar user={user} active={active} onNav={m=>setActive(m)} col={col} setCol={setCol}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <Header user={user} active={active} cis={cis} onLogout={logout}/>
      <main style={{flex:1,overflow:'hidden'}}>{render()}</main>
    </div>
    <Toast toasts={toasts} rem={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
