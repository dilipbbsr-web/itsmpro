const Btn=({children,variant='primary',size='md',onClick,disabled,style:sx={},type='button',icon})=>{
  const[h,sH]=useState(false);
  const V={primary:{bg:C.primary,bgh:C.primaryH,text:'#fff',bdr:C.primary},danger:{bg:C.danger,bgh:'#B91C1C',text:'#fff',bdr:C.danger},ghost:{bg:'transparent',bgh:C.primaryLt,text:C.primary,bdr:C.border},success:{bg:C.success,bgh:'#047857',text:'#fff',bdr:C.success},warning:{bg:C.warning,bgh:'#B45309',text:'#fff',bdr:C.warning},outline:{bg:'transparent',bgh:'#F8FAFC',text:C.t2,bdr:C.border}};
  const v=V[variant]||V.primary;
  const sz=size==='sm'?{padding:'4px 10px',fontSize:12}:size==='lg'?{padding:'10px 22px',fontSize:14}:{padding:'7px 14px',fontSize:13};
  return <button type={type} disabled={disabled} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} onClick={onClick} style={{background:h&&!disabled?v.bgh:v.bg,color:v.text,border:`1px solid ${v.bdr}`,borderRadius:6,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.6:1,fontWeight:500,display:'inline-flex',alignItems:'center',gap:6,transition:'all .15s',...sz,...sx}}>{icon&&<span style={{fontSize:13}}>{icon}</span>}{children}</button>;
};

const Modal=({open,title,onClose,children,width=540})=>{
  if(!open)return null;
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>

        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:22,color:C.t3,lineHeight:1,padding:'2px 4px'}}>×</button>
      </div>
      <div style={{padding:20,overflowY:'auto',flex:1}}>{children}</div>
    </div>
  </div>;
};

const UserMgmt=({me,users,setUsers,addToast})=>{
  const[search,setSearch]=useState('');
  const[fRole,setFR]=useState('');
  const[fStatus,setFS]=useState('');
  const[fDept,setFD]=useState('');
  const[sortBy,setSB]=useState('name');
  const[sortDir,setSD]=useState('asc');
  const[page,setPage]=useState(1);
  const[showAdd,setSA]=useState(false);
  const[editU,setEU]=useState(null);
  const[viewU,setVU]=useState(null);
  const[delReq,setDR]=useState(null);
  const[delPending,setDP]=useState([]);
  const PAGE=7;

  const EF={name:'',email:'',pw:'',role:'EMPLOYEE',dept:'IT',title:'',phone:'',loc:'HQ - New York',status:'active',mgr:''};
  const[form,setForm]=useState(EF);
  const[ferr,setFErr]=useState({});
  const roleOpts=Object.entries(ROLE_META).map(([v,m])=>({value:v,label:m.label}));

  const vf=()=>{
    const e={};
    if(!form.name.trim())e.name='Name is required';
    if(!form.email||!validateEmail(form.email))e.email='Valid email required';
    if(!editU&&!validatePw(form.pw))e.pw='Min 6 chars, 1 uppercase, 1 number';
    if(!editU&&users.find(u=>u.email===form.email))e.email='Email already exists';
    if(!form.title.trim())e.title='Designation required';
    return e;
  };

  const save=()=>{
    const e=vf();if(Object.keys(e).length){setFErr(e);return;}
    if(editU){
      setUsers(p=>p.map(u=>u.id===editU.id?{...u,...form,id:u.id,joined:u.joined,lastLogin:u.lastLogin}:u));
      addToast('success',`"${form.name}" updated`);
    }else{
      const nu={...form,id:genId(),joined:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),lastLogin:'—'};
      setUsers(p=>[...p,nu]);addToast('success',`"${form.name}" created`);
    }
    close();
  };

  const openAdd=()=>{setForm(EF);setFErr({});setEU(null);setSA(true);};
  const openEdit=u=>{setForm({name:u.name,email:u.email,pw:'',role:u.role,dept:u.dept,title:u.title,phone:u.phone||'',loc:u.loc,status:u.status,mgr:u.mgr||''});setFErr({});setEU(u);setSA(true);};
  const close=()=>{setSA(false);setEU(null);setFErr({});};

  const handleDel=u=>{
    if(u.id===me.id){addToast('error',"Can't delete your own account");return;}
    if(me.role==='SUPER_ADMIN'){setDR(u);}
    else{setDP(p=>[...p,{uid:u.id,uname:u.name,by:me.name,at:new Date().toLocaleTimeString()}]);addToast('info',`Delete request for "${u.name}" sent to Super Admin`);}
  };
  const confirmDel=()=>{setUsers(p=>p.filter(u=>u.id!==delReq.id));addToast('success',`"${delReq.name}" deleted`);setDR(null);};
  const toggleStatus=u=>{
    if(u.id===me.id){addToast('error',"Can't deactivate yourself");return;}
    setUsers(p=>p.map(x=>x.id===u.id?{...x,status:x.status==='active'?'inactive':'active'}:x));
    addToast('success',`${u.name} ${u.status==='active'?'deactivated':'activated'}`);
  };
  const ff=(k,v)=>{setForm(p=>({...p,[k]:v}));if(ferr[k])setFErr(p=>({...p,[k]:''}));};

  const filtered=useMemo(()=>users
    .filter(u=>{const q=search.toLowerCase();return(!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||u.title.toLowerCase().includes(q))&&(!fRole||u.role===fRole)&&(!fStatus||u.status===fStatus)&&(!fDept||u.dept===fDept);})
    .sort((a,b)=>(a[sortBy]||'').localeCompare(b[sortBy]||'')*(sortDir==='asc'?1:-1))
  ,[users,search,fRole,fStatus,fDept,sortBy,sortDir]);

  const paged=filtered.slice((page-1)*PAGE,page*PAGE);
  const totalP=Math.ceil(filtered.length/PAGE);
  const sortCol=c=>{if(sortBy===c)setSD(d=>d==='asc'?'desc':'asc');else{setSB(c);setSD('asc');}};
  const SI=({c})=><span style={{opacity:.4,fontSize:10}}>{sortBy===c?(sortDir==='asc'?'↑':'↓'):'↕'}</span>;

  return <div style={{padding:'20px 22px',maxWidth:1400}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
      <div>
        <h2 style={{fontSize:20,fontWeight:800,color:C.t1,margin:'0 0 3px'}}>User Management</h2>
        <p style={{fontSize:12,color:C.t2,margin:0}}>{users.filter(u=>u.status==='active').length} active · {users.length} total users</p>
      </div>
      <div style={{display:'flex',gap:8}}>
        {delPending.length>0&&me.role==='SUPER_ADMIN'&&<Btn variant="warning" icon="⚠️">{delPending.length} Delete Request{delPending.length>1?'s':''}</Btn>}
        <Btn icon="+" onClick={openAdd}>Add User</Btn>
      </div>
    </div>

    <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:12,marginBottom:14,display:'flex',gap:9,flexWrap:'wrap',alignItems:'flex-end'}}>
      <div style={{flex:1,minWidth:200}}><InputField placeholder="Search name, email, title…" value={search} onChange={v=>{setSearch(v);setPage(1);}}/></div>
      <SelectField value={fRole} onChange={v=>{setFR(v);setPage(1);}} options={[{value:'',label:'All Roles'},...roleOpts]} style={{minWidth:150}}/>
      <SelectField value={fStatus} onChange={v=>{setFS(v);setPage(1);}} options={[{value:'',label:'All Status'},{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}]} style={{minWidth:130}}/>
      <SelectField value={fDept} onChange={v=>{setFD(v);setPage(1);}} options={[{value:'',label:'All Depts'},...DEPTS.map(d=>({value:d,label:d}))]} style={{minWidth:150}}/>
      {(search||fRole||fStatus||fDept)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFR('');setFS('');setFD('');setPage(1);}}>Clear ×</Btn>}
    </div>

    <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',minWidth:860}}>
          <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
            {[['User','name'],['Email','email'],['Role','role'],['Dept','dept'],['Status','status'],['Joined','joined'],['Actions','']].map(([h,k])=><th key={h} onClick={()=>k&&sortCol(k)} style={{padding:'9px 12px',fontSize:10,fontWeight:700,color:C.t3,textAlign:'left',letterSpacing:'0.06em',textTransform:'uppercase',cursor:k?'pointer':'default',whiteSpace:'nowrap'}}>
              {h} {k&&<SI c={k}/>}
            </th>)}
          </tr></thead>
          <tbody>
            {paged.length===0&&<tr><td colSpan={7} style={{padding:40,textAlign:'center',color:C.t3,fontSize:13}}>No users found</td></tr>}
            {paged.map(u=><tr key={u.id} style={{borderBottom:`1px solid ${C.borderFaint}`,cursor:'pointer',transition:'background .1s'}} onMouseEnter={e=>e.currentTarget.style.background='#FAFBFF'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <td style={{padding:'10px 12px'}}>
                <div style={{display:'flex',alignItems:'center',gap:9}}>
                  <Avatar name={u.name} size={30}/>
                  <div>
                    <div style={{fontSize:12,fontWeight:700,color:C.t1}}>{u.name}{u.id===me.id&&<span style={{fontSize:9,color:C.t3,marginLeft:4}}>(you)</span>}</div>
                    <div style={{fontSize:11,color:C.t2}}>{u.title}</div>
                  </div>
                </div>
              </td>
              <td style={{padding:'10px 12px',fontSize:11,color:C.t2,fontFamily:'monospace'}}>{u.email}</td>
              <td style={{padding:'10px 12px'}}><RoleBadge role={u.role}/></td>
              <td style={{padding:'10px 12px',fontSize:12,color:C.t2}}>{u.dept}</td>
              <td style={{padding:'10px 12px'}}><StatusBadge status={u.status}/></td>
              <td style={{padding:'10px 12px',fontSize:11,color:C.t2,whiteSpace:'nowrap'}}>{u.joined}</td>
              <td style={{padding:'10px 12px'}}>
                <div style={{display:'flex',gap:5}}>
                  {[['👁️','View',()=>setVU(u),'#475569'],['✏️','Edit',()=>openEdit(u),C.primary],
                    [u.status==='active'?'⊘':'✓',u.status==='active'?'Deactivate':'Activate',()=>toggleStatus(u),u.status==='active'?C.warning:C.success],
                    ...((me.role==='SUPER_ADMIN'||me.role==='ADMIN')&&u.id!==me.id?[['🗑️','Delete',()=>handleDel(u),C.danger]]:[])
                  ].map(([ic,tt,fn,col])=><button key={tt} title={tt} onClick={fn} style={{background:'none',border:`1px solid ${C.border}`,borderRadius:5,padding:'4px 6px',cursor:'pointer',fontSize:13,color:col,transition:'all .15s'}} onMouseEnter={e=>e.currentTarget.style.borderColor=col} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>{ic}</button>)}
                </div>
              </td>
            </tr>)}
          </tbody>
        </table>
      </div>
      <div style={{padding:'10px 14px',borderTop:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span style={{fontSize:11,color:C.t2}}>Showing {Math.min((page-1)*PAGE+1,filtered.length)}–{Math.min(page*PAGE,filtered.length)} of {filtered.length}</span>
        <div style={{display:'flex',gap:5}}>
          <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}>‹</Btn>
          {Array.from({length:Math.min(5,totalP)},(_,i)=>{const p=Math.max(1,Math.min(totalP-4,page-2))+i;return p<=totalP?<button key={p} onClick={()=>setPage(p)} style={{width:28,height:28,borderRadius:5,border:`1px solid ${p===page?C.primary:C.border}`,background:p===page?C.primary:'transparent',color:p===page?'#fff':C.t2,fontSize:12,cursor:'pointer'}}>{p}</button>:null;})}
          <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.min(totalP,p+1))} disabled={page>=totalP||totalP===0}>›</Btn>
        </div>
      </div>
    </div>

    {delPending.length>0&&me.role==='SUPER_ADMIN'&&<div style={{marginTop:14,background:'#FFFBEB',border:`1px solid #FDE68A`,borderRadius:8,padding:16}}>
      <div style={{fontSize:13,fontWeight:700,color:C.warning,marginBottom:10}}>⚠ Pending Delete Approvals</div>
      {delPending.map((req,i)=>{
        const u=users.find(x=>x.id===req.uid);if(!u)return null;
        return <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'9px 0',borderBottom:`1px solid #FDE68A`}}>
          <Avatar name={u.name} size={28}/><div style={{flex:1}}><span style={{fontSize:12,fontWeight:700,color:C.t1}}>{u.name}</span><span style={{fontSize:11,color:C.t2}}> — Requested by {req.by} at {req.at}</span></div>
          <Btn size="sm" variant="success" onClick={()=>{setUsers(p=>p.filter(x=>x.id!==req.uid));setDP(p=>p.filter((_,j)=>j!==i));addToast('success',`Approved: ${u.name} deleted`);}}>✓ Approve</Btn>
          <Btn size="sm" variant="outline" onClick={()=>{setDP(p=>p.filter((_,j)=>j!==i));addToast('info','Request rejected');}}>✗ Reject</Btn>
        </div>;
      })}
    </div>}

    <Modal open={showAdd} title={editU?`Edit: ${editU.name}`:'Create New User'} onClose={close} width={560}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <InputField label="Full Name" value={form.name} onChange={v=>ff('name',v)} required error={ferr.name} style={{gridColumn:'1/-1'}}/>
        <InputField label="Email" type="email" value={form.email} onChange={v=>ff('email',v)} required error={ferr.email} disabled={!!editU}/>
        {!editU&&<InputField label="Password" type="password" value={form.pw} onChange={v=>ff('pw',v)} required error={ferr.pw} placeholder="6+ chars, 1 upper, 1 num"/>}
        <SelectField label="Role" value={form.role} onChange={v=>ff('role',v)} options={roleOpts} required/>
        <SelectField label="Department" value={form.dept} onChange={v=>ff('dept',v)} options={DEPTS.map(d=>({value:d,label:d}))} required/>
        <InputField label="Designation / Title" value={form.title} onChange={v=>ff('title',v)} required error={ferr.title}/>
        <InputField label="Phone" value={form.phone} onChange={v=>ff('phone',v)} placeholder="+1-555-…"/>
        <SelectField label="Location" value={form.loc} onChange={v=>ff('loc',v)} options={LOCS.map(l=>({value:l,label:l}))}/>
        <SelectField label="Reporting Manager" value={form.mgr} onChange={v=>ff('mgr',v)} options={[{value:'',label:'— No Manager —'},...users.filter(u=>u.id!==editU?.id).map(u=>({value:u.id,label:u.name}))]}/>
        <SelectField label="Status" value={form.status} onChange={v=>ff('status',v)} options={[{value:'active',label:'Active'},{value:'inactive',label:'Inactive'}]}/>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:9,marginTop:18,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={close}>Cancel</Btn>
        <Btn onClick={save}>{editU?'Save Changes':'Create User'}</Btn>
      </div>
    </Modal>

    <Modal open={!!viewU} title="User Profile" onClose={()=>setVU(null)} width={460}>
      {viewU&&<div>
        <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:18,paddingBottom:16,borderBottom:`1px solid ${C.border}`}}>
          <Avatar name={viewU.name} size={56}/>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:800,color:C.t1}}>{viewU.name}</div>
            <div style={{fontSize:12,color:C.t2,margin:'3px 0'}}>{viewU.title}</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}><RoleBadge role={viewU.role}/><StatusBadge status={viewU.status}/></div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[['📧 Email',viewU.email],['🏢 Department',viewU.dept],['📞 Phone',viewU.phone||'—'],['📍 Location',viewU.loc],['👔 Manager',users.find(u=>u.id===viewU.mgr)?.name||'—'],['📅 Joined',viewU.joined],['🔑 Last Login',viewU.lastLogin],['🆔 User ID',viewU.id]].map(([k,v])=>(
            <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'9px 11px'}}>
              <div style={{fontSize:10,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:2}}>{k}</div>
              <div style={{fontSize:12,color:C.t1,fontWeight:600,wordBreak:'break-all'}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',gap:9,marginTop:16}}>
          <Btn variant="outline" onClick={()=>setVU(null)}>Close</Btn>
          <Btn onClick={()=>{openEdit(viewU);setVU(null);}}>Edit User</Btn>
        </div>
      </div>}
    </Modal>
    <Confirm open={!!delReq} title="Delete User" danger msg={`Permanently delete "${delReq?.name}"? This cannot be undone.`} onOk={confirmDel} onCancel={()=>setDR(null)}/>
  </div>;
};

// ─── MY PROFILE ───────────────────────────────────
const MyProfile=({user,users,setUsers,addToast})=>{
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({name:user.name,phone:user.phone||'',loc:user.loc,title:user.title});
  const[pwF,setPwF]=useState({cur:'',nw:'',cf:''});
  const[pwErr,setPwErr]=useState({});
  const[showPw,setSPw]=useState(false);
  const mgr=users.find(u=>u.id===user.mgr);

  const saveProfile=()=>{setUsers(p=>p.map(u=>u.id===user.id?{...u,...form}:u));addToast('success','Profile updated');setEditing(false);};
  const changePw=()=>{
    const e={};
    if(!pwF.cur)e.cur='Enter current password';
    else if(user.pw!==pwF.cur)e.cur='Incorrect password';
    if(!validatePw(pwF.nw))e.nw='6+ chars, 1 uppercase, 1 number';
    if(pwF.nw!==pwF.cf)e.cf='Passwords do not match';
    if(Object.keys(e).length){setPwErr(e);return;}
    setUsers(p=>p.map(u=>u.id===user.id?{...u,pw:pwF.nw}:u));
    addToast('success','Password changed');setPwF({cur:'',nw:'',cf:''});setPwErr({});setSPw(false);
  };

  return <div style={{padding:'20px 22px',maxWidth:780}}>
    <h2 style={{fontSize:20,fontWeight:800,color:C.t1,margin:'0 0 18px'}}>My Profile</h2>
    <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden',marginBottom:14}}>
      <div style={{background:'linear-gradient(135deg,#0D1B2A,#1E3A6C)',height:72,position:'relative'}}/>
      <div style={{padding:'0 22px 22px'}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:14,marginTop:-30,marginBottom:18}}>
          <Avatar name={user.name} size={60} style={{border:'3px solid #fff',boxShadow:'0 2px 10px rgba(0,0,0,0.15)'}}/>
          <div style={{paddingBottom:4,flex:1}}>
            <div style={{fontSize:17,fontWeight:800,color:C.t1}}>{user.name}</div>
            <div style={{display:'flex',gap:7,alignItems:'center',marginTop:3}}><span style={{fontSize:12,color:C.t2}}>{user.title}</span><RoleBadge role={user.role}/></div>
          </div>
          {editing?<div style={{display:'flex',gap:8,paddingBottom:4}}>
            <Btn variant="outline" size="sm" onClick={()=>setEditing(false)}>Cancel</Btn>
            <Btn size="sm" onClick={saveProfile}>Save Changes</Btn>
          </div>:<Btn variant="ghost" size="sm" onClick={()=>setEditing(true)}>✏️ Edit</Btn>}
        </div>
        {editing?<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <InputField label="Full Name" value={form.name} onChange={v=>setForm(p=>({...p,name:v}))}/>
          <InputField label="Designation" value={form.title} onChange={v=>setForm(p=>({...p,title:v}))}/>
          <InputField label="Phone" value={form.phone} onChange={v=>setForm(p=>({...p,phone:v}))}/>
          <SelectField label="Location" value={form.loc} onChange={v=>setForm(p=>({...p,loc:v}))} options={LOCS.map(l=>({value:l,label:l}))}/>
        </div>:<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {[['📧','Email',user.email],['🏢','Department',user.dept],['📞','Phone',user.phone||'—'],['📍','Location',user.loc],['👔','Reports to',mgr?.name||'—'],['📅','Member since',user.joined]].map(([ic,k,v])=><div key={k} style={{display:'flex',gap:9}}>
            <span style={{fontSize:16}}>{ic}</span>
            <div><div style={{fontSize:10,color:C.t3,textTransform:'uppercase',letterSpacing:'0.05em'}}>{k}</div><div style={{fontSize:12,color:C.t1,fontWeight:600,marginTop:1}}>{v}</div></div>
          </div>)}
        </div>}
      </div>
    </div>
    <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
      <div style={{padding:'13px 18px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}} onClick={()=>setSPw(!showPw)}>
        <div><div style={{fontSize:13,fontWeight:700,color:C.t1}}>🔒 Change Password</div><div style={{fontSize:11,color:C.t2,marginTop:1}}>Update your account password securely</div></div>
        <span style={{color:C.t3}}>{showPw?'▲':'▼'}</span>
      </div>
      {showPw&&<div style={{padding:18,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <InputField label="Current Password" type="password" value={pwF.cur} onChange={v=>setPwF(p=>({...p,cur:v}))} error={pwErr.cur} style={{gridColumn:'1/-1'}}/>
        <InputField label="New Password" type="password" value={pwF.nw} onChange={v=>setPwF(p=>({...p,nw:v}))} error={pwErr.nw}/>
        <InputField label="Confirm New Password" type="password" value={pwF.cf} onChange={v=>setPwF(p=>({...p,cf:v}))} error={pwErr.cf}/>
        <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end'}}><Btn onClick={changePw}>Update Password</Btn></div>
      </div>}
    </div>
  </div>;
};

      <h2 style={{fontSize:22,fontWeight:800,color:C.t1,margin:'0 0 10px'}}>{c.t}</h2>

// ─── MAIN APP ─────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[users,setUsers]=useState(SEED_USERS);
  const[active,setActive]=useState('dashboard');
  const[collapsed,setCollapsed]=useState(false);
  const[notifs,setNotifs]=useState(INIT_NOTIFS);
  const[showN,setShowN]=useState(false);
  const[toasts,setToasts]=useState([]);

  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4000);};
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome back, ${u.name}!`);};
  const logout=()=>{setUser(null);setActive('dashboard');setCollapsed(false);setShowN(false);};
  const nav=m=>{setActive(m);setShowN(false);};

  const currentUser=users.find(u=>u.id===user?.id)||user;

  if(!user)return <LoginPage onLogin={login} users={users}/>;

  const sw=collapsed?60:236;

  const render=()=>{
    if(active==='dashboard')return <Dashboard user={currentUser} users={users}/>;
    if(active==='users')return can(currentUser.role,'manageUsers')?<UserMgmt me={currentUser} users={users} setUsers={setUsers} addToast={addToast}/>:<Shell module="users"/>;
    if(active==='profile')return <MyProfile user={currentUser} users={users} setUsers={setUsers} addToast={addToast}/>;
    return <Shell module={active}/>;
  };

  return <div style={{display:'flex',minHeight:'100vh'}} onClick={()=>{if(showN)setShowN(false);}}>
    <Sidebar user={currentUser} active={active} onNav={nav} collapsed={collapsed} setC={setCollapsed}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <Header user={currentUser} active={active} onLogout={logout} notifs={notifs} markRead={()=>setNotifs(p=>p.map(n=>({...n,read:true})))} showN={showN} setShowN={setShowN} onProfile={()=>nav('profile')}/>
      <main style={{flex:1,overflowY:'auto'}}>{render()}</main>
    </div>
    <Toast toasts={toasts} remove={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
