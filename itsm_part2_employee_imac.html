  const sz=size==='sm'?{padding:'4px 10px',fontSize:11}:size==='lg'?{padding:'10px 22px',fontSize:14}:{padding:'7px 13px',fontSize:12};
  return <button type={type} disabled={disabled} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} onClick={onClick} style={{background:h&&!disabled?v.bgh:v.bg,color:v.text,border:`1px solid ${v.bdr}`,borderRadius:6,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.6:1,fontWeight:600,display:'inline-flex',alignItems:'center',gap:5,transition:'all .15s',...sz,...sx}}>{icon&&<span style={{fontSize:12}}>{icon}</span>}{children}</button>;

const Modal=({open,title,onClose,children,width=560})=>{

  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>

  </div>;
};

    {toasts.map(t=>{const g=t.type==='success'?{bg:'#ECFDF5',bdr:'#A7F3D0',left:C.success,ic:'✓'}:t.type==='error'?{bg:'#FEF2F2',bdr:'#FECACA',left:C.danger,ic:'✗'}:{bg:'#EFF6FF',bdr:'#BFDBFE',left:C.primary,ic:'ℹ'};

const Dashboard=({user,users,imacList})=>{
  const myImac=imacList.filter(i=>i.reqBy===user.id);
  const pending=imacList.filter(i=>(i.approvals||[]).some(a=>a.approver===user.id&&a.status==='Pending'));
  const deptCount=DEPTS.reduce((a,d)=>({...a,[d]:users.filter(u=>u.dept===d&&u.status==='active').length}),{});
  const topDepts=Object.entries(deptCount).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const cards=user.role==='EMPLOYEE'?[
    {l:'My IMAC Requests',v:myImac.length,ic:'🔄',c:C.primary},
    {l:'Pending Approval',v:myImac.filter(i=>['L1 Pending','L2 Pending','L3 Pending'].includes(i.status)).length,ic:'⏳',c:C.warning},
    {l:'Approved',v:myImac.filter(i=>i.status==='Approved'||i.status==='Completed').length,ic:'✅',c:C.success},
    {l:'Rejected',v:myImac.filter(i=>i.status==='Rejected').length,ic:'✗',c:C.danger},
  ]:[
    {l:'Total Employees',v:users.filter(u=>u.status==='active').length,ic:'👥',c:C.primary},
    {l:'IMAC Requests',v:imacList.length,ic:'🔄',c:C.cyan},
    {l:'Awaiting My Approval',v:pending.length,ic:'⏳',c:C.warning},
    {l:'Completed This Month',v:imacList.filter(i=>i.status==='Completed').length,ic:'✅',c:C.success},
    {l:'Depts Active',v:Object.values(deptCount).filter(v=>v>0).length,ic:'🏢',c:C.purple},
    {l:'On Probation',v:users.filter(u=>u.probation&&u.status==='active').length,ic:'🔔',c:C.warning},

  return <div style={{padding:'18px 20px',maxWidth:1200}}>
    <div style={{marginBottom:16}}>
      <h1 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 3px'}}>Dashboard — {ROLE_META[user.role]?.label}</h1>
      <p style={{fontSize:11,color:C.t2,margin:0}}>{today()} · Welcome back, {user.name.split(' ')[0]}</p>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:11,marginBottom:16}}>
      {cards.map((s,i)=><div key={i} style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
        <div style={{width:34,height:34,borderRadius:7,background:`${s.c}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,marginBottom:10}}>{s.ic}</div>
        <div style={{fontSize:22,fontWeight:800,color:C.t1,lineHeight:1}}>{s.v}</div>
        <div style={{fontSize:11,color:C.t2,marginTop:2}}>{s.l}</div>
      </div>)}
    </div>
    {user.role!=='EMPLOYEE'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
        <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:12}}>Employees by Department</div>
        {topDepts.map(([dept,cnt])=><div key={dept} style={{marginBottom:10}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}><span style={{fontSize:11,color:C.t2}}>{dept}</span><span style={{fontSize:11,fontWeight:700,color:C.t1}}>{cnt}</span></div>
          <div style={{height:5,background:'#F1F5F9',borderRadius:3}}><div style={{height:5,borderRadius:3,background:C.primary,width:`${Math.min(100,cnt/users.length*100*3)}%`,transition:'width .5s'}}/></div>
        </div>)}
      </div>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
        <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:12}}>IMAC Request Status</div>
        {['L1 Pending','L2 Pending','L3 Pending','Approved','Completed','Rejected'].map(s=>{const cnt=imacList.filter(i=>i.status===s).length;if(!cnt)return null;return <div key={s} style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <StatusPill status={s} size={10}/><span style={{fontSize:11,fontWeight:700,color:C.t1}}>{cnt}</span>
        </div>;})}
        {pending.length>0&&<div style={{marginTop:10,padding:'9px',background:C.warningLt,borderRadius:6,border:`1px solid #FDE68A`}}><span style={{fontSize:11,fontWeight:700,color:C.warning}}>⚠ {pending.length} request{pending.length>1?'s':''} awaiting your approval</span></div>}
      </div>

  </div>;
};

// EMPLOYEE MANAGEMENT MODULE
// ══════════════════════════════════════════════════════════
const EmployeeModule=({me,users,setUsers,addToast})=>{
  const[tab,setTab]=useState('directory');
  const[search,setSearch]=useState('');
  const[fDept,setFD]=useState('');
  const[fRole,setFR]=useState('');
  const[fStatus,setFS]=useState('');
  const[viewEmp,setVE]=useState(null);
  const[editEmp,setEE]=useState(null);
  const[showOB,setSO]=useState(false);
  const[obStep,setOBS]=useState(1);
  const[obData,setOBD]=useState({name:'',email:'',pw:'',role:'EMPLOYEE',dept:'IT',title:'',phone:'',loc:'HQ - New York',mgr:'',dob:'',blood:'O+',emergency:'',skills:'',certifications:'',contractType:'Permanent',doj:today()});
  const[obErr,setOBE]=useState({});

  const filtered=useMemo(()=>users.filter(u=>{
    const q=search.toLowerCase();
    return(!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||u.empId?.toLowerCase().includes(q)||u.title?.toLowerCase().includes(q))&&(!fDept||u.dept===fDept)&&(!fRole||u.role===fRole)&&(!fStatus||u.status===fStatus);
  }),[users,search,fDept,fRole,fStatus]);

  const buildTree=(uid,depth=0)=>{const u=users.find(x=>x.id===uid);if(!u)return null;const children=users.filter(x=>x.mgr===uid);return{...u,depth,children:children.map(c=>buildTree(c.id,depth+1))};};
  const roots=users.filter(u=>!u.mgr||!users.find(x=>x.id===u.mgr));
  const trees=roots.map(r=>buildTree(r.id));

  const getChain=uid=>{const chain=[];let cur=uid;for(let i=0;i<5;i++){const u=users.find(x=>x.id===cur);if(!u)break;chain.push(u);if(!u.mgr)break;cur=u.mgr;}return chain;};

  const OrgNode=({node})=>{
    const[open,setOpen]=useState(node.depth<2);
    const hasKids=node.children&&node.children.length>0;
    return <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',cursor:'pointer'}} onClick={()=>setVE(node)}>
        <div style={{background:node.id===me.id?C.primaryLt:C.card,border:`2px solid ${node.id===me.id?C.primary:C.border}`,borderRadius:10,padding:'10px 14px',display:'flex',flexDirection:'column',alignItems:'center',gap:5,width:130,boxShadow:'0 2px 8px rgba(0,0,0,0.06)',transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 4px 14px rgba(37,99,235,0.15)';e.currentTarget.style.borderColor=C.primary;}}
          onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.06)';e.currentTarget.style.borderColor=node.id===me.id?C.primary:C.border;}}>
          <Avatar name={node.name} size={36}/>
          <div style={{fontSize:10,fontWeight:700,color:C.t1,textAlign:'center',lineHeight:1.3,wordBreak:'break-word'}}>{node.name}</div>
          <div style={{fontSize:9,color:C.t2,textAlign:'center'}}>{node.title}</div>
          <RoleBadge role={node.role}/>
        </div>
        {hasKids&&<button onClick={e=>{e.stopPropagation();setOpen(!open);}} style={{background:open?C.primary:'#F8FAFC',border:`1px solid ${open?C.primary:C.border}`,borderRadius:'50%',width:18,height:18,fontSize:11,cursor:'pointer',color:open?'#fff':C.t2,display:'flex',alignItems:'center',justifyContent:'center',marginTop:4}}>{open?'−':'+'}</button>}
      </div>
      {hasKids&&open&&<div style={{display:'flex',gap:12,marginTop:8,position:'relative',paddingTop:8}}>
        <div style={{position:'absolute',top:0,left:'50%',width:1,height:8,background:C.border}}/>
        {node.children.map((child,ci)=><div key={child.id} style={{display:'flex',flexDirection:'column',alignItems:'center',position:'relative'}}>
          <div style={{width:1,height:8,background:C.border}}/>
          {node.children.length>1&&<div style={{position:'absolute',top:8,left:ci===0?'50%':0,right:ci===node.children.length-1?'50%':0,height:1,background:C.border}}/>}
          <div style={{marginTop:8}}><OrgNode node={child}/></div>
        </div>)}
      </div>}
    </div>;
  };

  const validateOB=()=>{const e={};if(!obData.name.trim())e.name='Required';if(!obData.email||!validateEmail(obData.email))e.email='Valid email required';if(!validatePw(obData.pw))e.pw='6+ chars, 1 upper, 1 number';if(users.find(u=>u.email===obData.email))e.email='Email already taken';if(!obData.title.trim())e.title='Required';return e;};
  const nextOBStep=()=>{if(obStep===1){const e=validateOB();if(Object.keys(e).length){setOBE(e);return;}}if(obStep<3)setOBS(s=>s+1);else{const nu={...obData,id:'u'+Math.random().toString(36).substr(2,8),empId:`EMP-${String(users.length+1).padStart(3,'0')}`,joined:today(),lastLogin:'—',status:'active'};setUsers(p=>[...p,nu]);addToast('success',`${nu.name} onboarded successfully!`);setSO(false);setOBS(1);}};
  const ff=k=>v=>setOBD(p=>({...p,[k]:v}));
  const roleOpts=Object.entries(ROLE_META).map(([v,m])=>({v,l:m.label}));

  return <div style={{padding:'18px 20px',maxWidth:1200}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
      <div><h2 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Employee Management</h2><p style={{fontSize:11,color:C.t2,margin:0}}>{users.filter(u=>u.status==='active').length} active employees across {[...new Set(users.map(u=>u.dept))].length} departments</p></div>
      {(me.role==='SUPER_ADMIN'||me.role==='ADMIN')&&<Btn icon="👤" onClick={()=>{setSO(true);setOBS(1);setOBD({name:'',email:'',pw:'',role:'EMPLOYEE',dept:'IT',title:'',phone:'',loc:'HQ - New York',mgr:'',dob:'',blood:'O+',emergency:'',skills:'',certifications:'',contractType:'Permanent',doj:today()});setOBE({});}}>Onboard Employee</Btn>}
    </div>

    <div style={{display:'flex',gap:0,marginBottom:14,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:4,width:'fit-content'}}>
      {[['directory','📋 Directory'],['orgchart','🌳 Org Chart'],['departments','🏢 Departments']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:'6px 14px',borderRadius:6,border:'none',background:tab===v?C.primary:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer',transition:'all .15s'}}>{l}</button>)}
    </div>

    {tab==='directory'&&<>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:10,marginBottom:12,display:'flex',gap:8,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:180}}><Input placeholder="Search name, email, ID…" value={search} onChange={v=>setSearch(v)}/></div>
        <Select value={fDept} onChange={setFD} opts={[{v:'',l:'All Depts'},...DEPTS.map(d=>({v:d,l:d}))]} sx={{minWidth:140}}/>
        <Select value={fRole} onChange={setFR} opts={[{v:'',l:'All Roles'},...roleOpts]} sx={{minWidth:140}}/>
        <Select value={fStatus} onChange={setFS} opts={[{v:'',l:'All Status'},{v:'active',l:'Active'},{v:'inactive',l:'Inactive'}]} sx={{minWidth:120}}/>
        {(search||fDept||fRole||fStatus)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFD('');setFR('');setFS('');}}>Clear ×</Btn>}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:10}}>
        {filtered.length===0&&<div style={{gridColumn:'1/-1',padding:40,textAlign:'center',color:C.t3}}>No employees found</div>}
        {filtered.map(u=><div key={u.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:14,display:'flex',gap:12,cursor:'pointer',transition:'all .15s'}}
          onClick={()=>setVE(u)}
          onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 3px 10px rgba(0,0,0,0.08)';e.currentTarget.style.borderColor=C.primary;}}
          onMouseLeave={e=>{e.currentTarget.style.boxShadow='none';e.currentTarget.style.borderColor=C.border;}}>
          <Avatar name={u.name} size={44}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
              <span style={{fontSize:13,fontWeight:800,color:C.t1}}>{u.name}</span>
              {u.id===me.id&&<span style={{fontSize:9,color:C.t3,background:'#F1F5F9',padding:'1px 5px',borderRadius:10}}>you</span>}
              {u.probation&&<span style={{fontSize:9,color:C.warning,background:C.warningLt,padding:'1px 5px',borderRadius:10,fontWeight:700}}>Probation</span>}
            </div>
            <div style={{fontSize:11,color:C.t2,margin:'2px 0'}}>{u.title} · {u.dept}</div>
            <div style={{fontSize:10,color:C.t3,margin:'1px 0'}}>{u.empId} · {u.loc}</div>
            <div style={{display:'flex',gap:5,marginTop:5,flexWrap:'wrap'}}><RoleBadge role={u.role}/><StatusPill status={u.status}/>{u.contractType&&u.contractType!=='Permanent'&&<span style={{fontSize:9,fontWeight:700,color:C.orange,background:C.orangeLt,padding:'2px 6px',borderRadius:10}}>{u.contractType}</span>}</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:5,alignItems:'flex-end',flexShrink:0}}>
            <Btn size="sm" onClick={e=>{e.stopPropagation();setEE(u);}}>Edit</Btn>
            <button onClick={e=>{e.stopPropagation();setUsers(p=>p.map(x=>x.id===u.id?{...x,status:x.status==='active'?'inactive':'active'}:x));addToast('success',`${u.name} ${u.status==='active'?'deactivated':'activated'}`);}} style={{padding:'4px 9px',border:`1px solid ${C.border}`,borderRadius:5,background:'none',cursor:'pointer',fontSize:11,color:u.status==='active'?C.warning:C.success,fontWeight:600}}>{u.status==='active'?'Deactivate':'Activate'}</button>
          </div>
        </div>)}
      </div>
    </>}

    {tab==='orgchart'&&<div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:20,overflowX:'auto'}}>
      <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:14}}>Organization Hierarchy <span style={{fontSize:10,color:C.t3,fontWeight:400}}>— Click any node to view profile</span></div>
      <div style={{overflowX:'auto',display:'flex',justifyContent:'center',paddingBottom:16}}>
        <div style={{display:'flex',gap:24,flexWrap:'wrap',justifyContent:'center'}}>
          {trees.map(t=><OrgNode key={t.id} node={t}/>)}
        </div>
      </div>
    </div>}

    {tab==='departments'&&<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:12}}>
      {DEPTS.map(dept=>{
        const emps=users.filter(u=>u.dept===dept&&u.status==='active');
        const roles=[...new Set(emps.map(u=>u.role))];
        if(!emps.length)return null;
        return <div key={dept} style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14,cursor:'pointer',transition:'all .15s'}} onMouseEnter={e=>e.currentTarget.style.boxShadow='0 3px 10px rgba(0,0,0,0.08)'} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:800,color:C.t1}}>{dept}</div>
            <span style={{fontSize:22,fontWeight:800,color:C.primary}}>{emps.length}</span>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:8}}>{roles.map(r=><RoleBadge key={r} role={r}/>)}</div>
          <div style={{display:'flex',gap:-6}}>
            {emps.slice(0,5).map((e,i)=><div key={e.id} style={{marginLeft:i>0?-8:0,position:'relative',zIndex:5-i}}><Avatar name={e.name} size={22} sx={{border:'2px solid #fff'}}/></div>)}

              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>

          <div style={{fontSize:9,color:obStep===i+1?C.primary:C.t3,fontWeight:obStep===i+1?700:400,textAlign:'center'}}>{s}</div>

        <Select label="Blood Group" value={obData.blood} onChange={ff('blood')} opts={['O+','O-','A+','A-','B+','B-','AB+','AB-'].map(b=>({v:b,l:b}))}/>
        <Input label="Emergency Contact" value={obData.emergency} onChange={ff('emergency')} placeholder="Name - Phone"/>
      </div>}
      {obStep===2&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Select label="Role" value={obData.role} onChange={ff('role')} opts={roleOpts} required/>
        <Select label="Department" value={obData.dept} onChange={ff('dept')} opts={DEPTS.map(d=>({v:d,l:d}))} required/>
        <Select label="Location" value={obData.loc} onChange={ff('loc')} opts={LOCS.map(l=>({v:l,l:l}))}/>
        <Select label="Contract Type" value={obData.contractType} onChange={ff('contractType')} opts={['Permanent','Contract','Internship','Part-time'].map(c=>({v:c,l:c}))}/>
        <Select label="Reporting Manager" value={obData.mgr} onChange={ff('mgr')} opts={[{v:'',l:'— No Manager —'},...users.map(u=>({v:u.id,l:`${u.name} (${u.title})`}))]} sx={{gridColumn:'1/-1'}}/>

        <Textarea label="Bio / Summary" value={obData.bio||''} onChange={ff('bio')} rows={2} placeholder="Brief professional background…"/>
        <Input label="Skills" value={obData.skills} onChange={ff('skills')} placeholder="e.g. Python, Excel, Project Mgmt"/>
        <Input label="Certifications" value={obData.certifications} onChange={ff('certifications')} placeholder="e.g. ITIL, PMP, AWS"/>
        <div style={{background:'#ECFDF5',border:'1px solid #A7F3D0',borderRadius:6,padding:12}}>
          <div style={{fontSize:12,fontWeight:700,color:C.success,marginBottom:6}}>✓ Ready to Onboard</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>
            <span style={{fontSize:11,color:C.t1}}><strong>{obData.name||'—'}</strong></span>
            <span style={{fontSize:11,color:C.t2}}>·</span>
            <span style={{fontSize:11,color:C.t2}}>{obData.dept}</span>
            <span style={{fontSize:11,color:C.t2}}>·</span>
            <RoleBadge role={obData.role}/>
          </div>

      </div>}
      <div style={{display:'flex',justifyContent:'space-between',marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={obStep===1?()=>setSO(false):()=>setOBS(s=>s-1)}>{obStep===1?'Cancel':'← Back'}</Btn>

// ══════════════════════════════════════════════════════════
// IMAC MODULE — 3-Level Approval Workflow
// ══════════════════════════════════════════════════════════
const IMACModule=({me,users,imacList,setImacList,addToast})=>{
  const[tab,setTab]=useState('list');
  const[showNew,setSN]=useState(false);
  const[viewReq,setVR]=useState(null);
  const[search,setSearch]=useState('');
  const[fType,setFT]=useState('');
  const[fStatus,setFS]=useState('');
  const[fPrio,setFP]=useState('');

  const getApprovalChain=reqById=>{
    const emp=users.find(u=>u.id===reqById);if(!emp)return [];
    const L1=users.find(u=>u.id===emp.mgr);
    const L2=L1?users.find(u=>u.id===L1.mgr):null;
    const L3=users.find(u=>u.role==='SERVICE_MANAGER')||users.find(u=>u.role==='ADMIN')||users.find(u=>u.role==='SUPER_ADMIN');
    return [L1||{id:'',name:'No L1 Manager'},L2||L1||{id:'',name:'No L2 Manager'},L3||{id:'',name:'No L3 Approver'}];
  };

  const myPendingApprovals=imacList.filter(req=>(req.approvals||[]).some(a=>a.approver===me.id&&a.status==='Pending'));

  const filtered=useMemo(()=>{
    let list=imacList;
    if(me.role==='EMPLOYEE')list=list.filter(r=>r.reqBy===me.id);
    const q=search.toLowerCase();
    return list.filter(r=>(!q||r.id.toLowerCase().includes(q)||r.title.toLowerCase().includes(q))&&(!fType||r.type===fType)&&(!fStatus||r.status===fStatus)&&(!fPrio||r.priority===fPrio)).sort((a,b)=>b.id.localeCompare(a.id));
  },[imacList,search,fType,fStatus,fPrio,me]);

  const handleApprove=(req,level,approve,comment)=>{
    const updApprovals=req.approvals.map(a=>a.level===level?{...a,status:approve?'Approved':'Rejected',comment,date:now()}:a);
    let newStatus=req.status;
    let newHistory=[...req.history,{action:approve?`L${level} Approved`:`L${level} Rejected`,by:me.id,at:now(),note:comment}];
    if(!approve){newStatus='Rejected';}
    else{if(level===1)newStatus='L2 Pending';else if(level===2)newStatus='L3 Pending';else if(level===3){newStatus='Approved';newHistory.push({action:'Approved',by:'System',at:now(),note:'All 3 approval levels completed.'});}}
    setImacList(p=>p.map(r=>r.id===req.id?{...r,approvals:updApprovals,status:newStatus,history:newHistory}:r));
    setVR(prev=>({...prev,approvals:updApprovals,status:newStatus,history:newHistory}));
    addToast(approve?'success':'error',`IMAC ${req.id} ${approve?`L${level} Approved`:'Rejected'}`);
  };

  const IMACForm=()=>{
    const[form,setForm]=useState({type:'Install',category:'New Laptop/Desktop',title:'',desc:'',priority:'Medium',targetDate:'',asset:'',justification:''});
    const[errs,setErrs]=useState({});
    const ff=k=>v=>setForm(p=>({...p,[k]:v,...(k==='type'?{category:IMAC_CATS[v][0]}:{})}));
    const chain=getApprovalChain(me.id);
    const submit=()=>{
      const e={};
      if(!form.title.trim())e.title='Required';
      if(!form.desc.trim())e.desc='Required';
      if(!form.justification.trim())e.justification='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      const chain3=getApprovalChain(me.id);
      const newReq={id:genId('IMAC'),type:form.type,category:form.category,title:form.title,desc:form.desc,priority:form.priority,status:'L1 Pending',reqBy:me.id,reqDate:today(),targetDate:form.targetDate||'Not Set',asset:form.asset,justification:form.justification,
        approvals:[{level:1,approver:chain3[0]?.id||'',status:'Pending',comment:'',date:''},{level:2,approver:chain3[1]?.id||'',status:'Pending',comment:'',date:''},{level:3,approver:chain3[2]?.id||'',status:'Pending',comment:'',date:''}],
        history:[{action:'Submitted',by:me.id,at:now(),note:'IMAC request created and submitted for approval.'}]};
      setImacList(p=>[newReq,...p]);addToast('success',`${newReq.id} submitted — L1 approval pending`);setSN(false);
    };
    return <div>
      <div style={{background:C.primaryLt,border:`1px solid #BFDBFE`,borderRadius:8,padding:11,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:C.primary,marginBottom:6}}>📋 3-Level Approval Chain for Your Request</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {chain.map((c,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:6,background:'#fff',border:`1px solid #BFDBFE`,borderRadius:6,padding:'5px 9px'}}>
            <div style={{width:20,height:20,borderRadius:'50%',background:C.primary,color:'#fff',fontSize:9,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>L{i+1}</div>
            <div><div style={{fontSize:11,fontWeight:600,color:C.t1}}>{c.name||'—'}</div><div style={{fontSize:9,color:C.t2}}>{c.title||['Direct Manager','Dept Head','IT Service Mgr'][i]}</div></div>
          </div>)}
        </div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Select label="IMAC Type" value={form.type} onChange={ff('type')} opts={IMAC_TYPES.map(t=>({v:t,l:t}))} required/>
        <Select label="Category" value={form.category} onChange={ff('category')} opts={(IMAC_CATS[form.type]||[]).map(c=>({v:c,l:c}))} required/>
        <Input label="Request Title" value={form.title} onChange={ff('title')} required error={errs.title} sx={{gridColumn:'1/-1'}} placeholder="Brief title…"/>
        <Textarea label="Description" value={form.desc} onChange={ff('desc')} rows={2} required sx={{gridColumn:'1/-1'}} placeholder="Detailed description…"/>
        <Textarea label="Business Justification" value={form.justification} onChange={ff('justification')} rows={2} required sx={{gridColumn:'1/-1'}} placeholder="Why is this needed?…"/>
        <Input label="Asset / Item (if known)" value={form.asset} onChange={ff('asset')} placeholder="e.g. Dell Latitude 5540"/>
        <Select label="Priority" value={form.priority} onChange={ff('priority')} opts={PRIORITY_OPTS.map(p=>({v:p,l:p}))}/>
        <Input label="Required By Date" type="date" value={form.targetDate} onChange={ff('targetDate')} sx={{gridColumn:'1/-1'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSN(false)}>Cancel</Btn>
        <Btn onClick={submit}>🚀 Submit Request</Btn>
      </div>
    </div>;
  };

  const ApprovalPane=({req})=>{
    const[comment,setComment]=useState('');
    const[showReject,setShowR]=useState(false);
    const myApproval=req.approvals.find(a=>a.approver===me.id&&a.status==='Pending');
    const isServiceMgr=me.role==='SERVICE_MANAGER'||me.role==='SUPER_ADMIN'||me.role==='ADMIN';
    const canOverride=isServiceMgr&&['L1 Pending','L2 Pending','L3 Pending'].includes(req.status)&&!myApproval;
    if(!myApproval&&!canOverride)return null;
    const level=myApproval?.level||(req.status==='L1 Pending'?1:req.status==='L2 Pending'?2:3);
    return <div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:14,marginTop:14}}>
      <div style={{fontSize:12,fontWeight:800,color:C.warning,marginBottom:8}}>{canOverride?'⚡ Service Manager Override':'⏳ Your Approval Required'} — Level {level}</div>
      <Textarea label="Comments / Notes" value={comment} onChange={setComment} rows={2} placeholder="Add approval comments (required for rejection)…"/>
      <div style={{display:'flex',gap:8,marginTop:10}}>
        <Btn variant="success" onClick={()=>handleApprove(req,level,true,comment)}>✓ Approve</Btn>
        {!showReject?<Btn variant="outline" onClick={()=>setShowR(true)}>✗ Reject</Btn>:<Btn variant="danger" onClick={()=>{if(!comment.trim()){addToast('error','Rejection reason required');return;}handleApprove(req,level,false,comment);}}>✗ Confirm Reject</Btn>}
      </div>
    </div>;
  };

  const TypeIcon={Install:'💿',Move:'📦',Add:'➕',Change:'🔧'};

  return <div style={{padding:'18px 20px',maxWidth:1200}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
      <div><h2 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>IMAC — Install / Move / Add / Change</h2><p style={{fontSize:11,color:C.t2,margin:0}}>Hardware & software lifecycle requests with 3-level approval workflow</p></div>
      <Btn icon="+" onClick={()=>setSN(true)}>New IMAC Request</Btn>
    </div>

    {myPendingApprovals.length>0&&<div style={{background:'#FFFBEB',border:'1px solid #FDE68A',borderRadius:8,padding:12,marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
      <span style={{fontSize:18}}>⏳</span>
      <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700,color:C.warning}}>{myPendingApprovals.length} request{myPendingApprovals.length>1?'s':''} waiting for your approval</div><div style={{fontSize:11,color:C.t2,marginTop:1}}>{myPendingApprovals.map(r=>r.id).join(', ')}</div></div>
    </div>}

    <div style={{display:'flex',gap:0,marginBottom:12,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:3,width:'fit-content'}}>
      {[['list','📋 All Requests'],['approvals','⏳ Pending Approvals']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:'5px 12px',borderRadius:5,border:'none',background:tab===v?C.primary:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer'}}>{l}{v==='approvals'&&myPendingApprovals.length>0?<span style={{marginLeft:5,background:'#fff',color:C.primary,borderRadius:10,fontSize:9,padding:'1px 5px',fontWeight:800}}>{myPendingApprovals.length}</span>:''}</button>)}
    </div>

    {tab==='approvals'&&<div>
      {myPendingApprovals.length===0?<div style={{padding:40,textAlign:'center',color:C.t3,fontSize:13,background:C.card,borderRadius:8,border:`1px solid ${C.border}`}}>No pending approvals</div>:
      myPendingApprovals.map(req=><div key={req.id} style={{background:C.card,borderRadius:8,border:`1px solid #FDE68A`,padding:14,marginBottom:10,cursor:'pointer'}} onClick={()=>setVR(req)}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
          <div style={{flex:1}}>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4,flexWrap:'wrap'}}>
              <span style={{fontSize:11,fontFamily:'monospace',color:C.primary,fontWeight:800}}>{req.id}</span>
              <StatusPill status={req.status}/>
              <PrioBadge p={req.priority}/>
            </div>
            <div style={{fontSize:13,fontWeight:700,color:C.t1,marginBottom:2}}>{req.title}</div>
            <div style={{fontSize:11,color:C.t2}}>Requested by {users.find(u=>u.id===req.reqBy)?.name||'Unknown'} · {req.reqDate}</div>
          </div>
          <Btn size="sm" onClick={e=>{e.stopPropagation();setVR(req);}}>Review →</Btn>
        </div>
      </div>)}
    </div>}

    {tab==='list'&&<>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:10,marginBottom:10,display:'flex',gap:8,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:180}}><Input placeholder="Search ID or title…" value={search} onChange={v=>setSearch(v)}/></div>
        <Select value={fType} onChange={setFT} opts={[{v:'',l:'All Types'},...IMAC_TYPES.map(t=>({v:t,l:t}))]} sx={{minWidth:120}}/>
        <Select value={fStatus} onChange={setFS} opts={[{v:'',l:'All Status'},{v:'L1 Pending',l:'L1 Pending'},{v:'L2 Pending',l:'L2 Pending'},{v:'L3 Pending',l:'L3 Pending'},{v:'Approved',l:'Approved'},{v:'Completed',l:'Completed'},{v:'Rejected',l:'Rejected'}]} sx={{minWidth:140}}/>
        <Select value={fPrio} onChange={setFP} opts={[{v:'',l:'All Priority'},...PRIORITY_OPTS.map(p=>({v:p,l:p}))]} sx={{minWidth:130}}/>
        {(search||fType||fStatus||fPrio)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFT('');setFS('');setFP('');}}>Clear ×</Btn>}
      </div>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:780}}>
            <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
              {['ID','Type','Title','Requested By','Status','Priority','Target Date','Actions'].map(h=><th key={h} style={{padding:'8px 11px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',letterSpacing:'0.07em',textTransform:'uppercase',borderBottom:`1px solid ${C.border}`,whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {filtered.length===0&&<tr><td colSpan={8} style={{padding:40,textAlign:'center',color:C.t3,fontSize:12}}>No requests found</td></tr>}
              {filtered.map(req=>{
                const reqUser=users.find(u=>u.id===req.reqBy);
                const hasPending=req.approvals?.some(a=>a.approver===me.id&&a.status==='Pending');
                return <tr key={req.id} style={{borderBottom:`1px solid ${C.borderFaint}`,background:hasPending?'#FFFDF0':'transparent',cursor:'pointer',transition:'background .1s'}} onMouseEnter={e=>e.currentTarget.style.background=hasPending?'#FFF9E6':'#FAFBFF'} onMouseLeave={e=>e.currentTarget.style.background=hasPending?'#FFFDF0':'transparent'}>
                  <td style={{padding:'9px 11px',fontFamily:'monospace',fontSize:11,color:C.primary,fontWeight:800,whiteSpace:'nowrap'}}>{req.id}</td>
                  <td style={{padding:'9px 11px'}}><span style={{fontSize:12}}>{TypeIcon[req.type]||'📋'}</span> <span style={{fontSize:11,color:C.t2}}>{req.type}</span></td>
                  <td style={{padding:'9px 11px',maxWidth:200}}><div style={{fontSize:11,fontWeight:600,color:C.t1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{req.title}</div><div style={{fontSize:9,color:C.t3}}>{req.category}</div></td>
                  <td style={{padding:'9px 11px'}}><div style={{display:'flex',alignItems:'center',gap:5}}><Avatar name={reqUser?.name||'?'} size={18}/><span style={{fontSize:11,color:C.t2,whiteSpace:'nowrap'}}>{reqUser?.name||'—'}</span></div></td>
                  <td style={{padding:'9px 11px'}}><StatusPill status={req.status}/>{hasPending&&<span style={{display:'block',fontSize:9,color:C.warning,fontWeight:700,marginTop:2}}>⏳ Your action</span>}</td>
                  <td style={{padding:'9px 11px'}}><PrioBadge p={req.priority}/></td>
                  <td style={{padding:'9px 11px',fontSize:11,color:C.t2,whiteSpace:'nowrap'}}>{req.targetDate}</td>
                  <td style={{padding:'9px 11px'}}><Btn size="sm" variant="ghost" onClick={()=>setVR(req)}>View →</Btn></td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    </>}

    {/* New Request Modal */}
    <Modal open={showNew} title="New IMAC Request" onClose={()=>setSN(false)} width={580}><IMACForm/></Modal>

    {/* View/Approve Request Modal */}
    <Modal open={!!viewReq} title={viewReq?.id||''} onClose={()=>setVR(null)} width={620}>
      {viewReq&&(()=>{
        const reqUser=users.find(u=>u.id===viewReq.reqBy);
        return <div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            <StatusPill status={viewReq.status}/><PrioBadge p={viewReq.priority}/>
            <span style={{fontSize:11,color:C.primary,fontWeight:700,background:C.primaryLt,padding:'2px 7px',borderRadius:20}}>{viewReq.type}</span>
            <span style={{fontSize:11,color:C.t2,background:'#F1F5F9',padding:'2px 7px',borderRadius:20}}>{viewReq.category}</span>
          </div>
          <h3 style={{fontSize:15,fontWeight:800,color:C.t1,margin:'0 0 8px'}}>{viewReq.title}</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
            {[['Requested By',reqUser?.name||'—'],['Request Date',viewReq.reqDate],['Target Date',viewReq.targetDate],['Asset / Item',viewReq.asset||'—']].map(([k,v])=>(
              <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'7px 10px'}}><div style={{fontSize:9,color:C.t3,marginBottom:2}}>{k}</div><div style={{fontSize:11,fontWeight:600,color:C.t1}}>{v}</div></div>
            ))}
          </div>
          <div style={{marginBottom:10,background:'#F8FAFC',borderRadius:6,padding:'9px 11px'}}><div style={{fontSize:9,color:C.t3,marginBottom:3}}>DESCRIPTION</div><div style={{fontSize:12,color:C.t1,lineHeight:1.6}}>{viewReq.desc}</div></div>
          <div style={{marginBottom:14,background:'#F8FAFC',borderRadius:6,padding:'9px 11px'}}><div style={{fontSize:9,color:C.t3,marginBottom:3}}>BUSINESS JUSTIFICATION</div><div style={{fontSize:12,color:C.t1,lineHeight:1.6}}>{viewReq.justification}</div></div>

          {/* 3-Level Approval Tracker */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>📊 Approval Progress</div>
            <div style={{display:'flex',alignItems:'flex-start',gap:0,position:'relative'}}>
              <div style={{position:'absolute',top:20,left:'16.5%',width:'67%',height:2,background:'#E2E8F0',zIndex:0}}/>
              {viewReq.approvals.map((a,i)=>{
                const approver=users.find(u=>u.id===a.approver);
                const sc={Approved:{ic:'✓',bg:C.success,bdr:C.success},Rejected:{ic:'✗',bg:C.danger,bdr:C.danger},Pending:{ic:String(i+1),bg:'#fff',bdr:C.border}};
                const s=sc[a.status]||sc.Pending;
                return <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5,position:'relative',zIndex:1}}>
                  <div style={{width:40,height:40,borderRadius:'50%',background:s.bg,border:`2px solid ${s.bdr}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:a.status==='Pending'?C.t3:'#fff',fontWeight:800}}>{s.ic}</div>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:9,fontWeight:800,color:C.t3,letterSpacing:'0.08em'}}>LEVEL {i+1}</div>
                    <div style={{fontSize:10,fontWeight:700,color:C.t1}}>{approver?.name||'—'}</div>
                    <div style={{fontSize:9,color:C.t2}}>{approver?.title||'—'}</div>
                    <StatusPill status={a.status} size={9}/>
                    {a.date&&<div style={{fontSize:9,color:C.t3,marginTop:2}}>{a.date}</div>}
                    {a.comment&&<div style={{fontSize:9,color:C.t2,marginTop:2,background:'#F8FAFC',padding:'3px 6px',borderRadius:4,maxWidth:100,textAlign:'center'}}>"{a.comment}"</div>}
                  </div>
                </div>;
              })}
            </div>
          </div>

          <ApprovalPane req={viewReq}/>

          {/* Activity History */}
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>📜 Activity History</div>
            <div style={{maxHeight:160,overflowY:'auto'}}>
              {[...viewReq.history].reverse().map((h,i)=>{
                const actor=users.find(u=>u.id===h.by);
                return <div key={i} style={{display:'flex',gap:8,marginBottom:8,paddingBottom:8,borderBottom:`1px solid ${C.borderFaint}`}}>
                  <Avatar name={actor?.name||h.by} size={24}/>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}><span style={{fontSize:11,fontWeight:700,color:C.t1}}>{actor?.name||h.by}</span><span style={{fontSize:10,color:C.t3}}>· {h.at}</span></div>
                    <div style={{fontSize:11,color:C.primary,fontWeight:600}}>{h.action}</div>
                    {h.note&&<div style={{fontSize:10,color:C.t2,marginTop:1}}>{h.note}</div>}
                  </div>
                </div>;
              })}
            </div>
          </div>

          {(me.role==='SERVICE_MANAGER'||me.role==='SUPER_ADMIN')&&viewReq.status==='Approved'&&<div style={{marginTop:12,display:'flex',gap:8}}>
            <Btn variant="success" onClick={()=>{setImacList(p=>p.map(r=>r.id===viewReq.id?{...r,status:'In Progress',history:[...r.history,{action:'In Progress',by:me.id,at:now(),note:'Implementation started'}]}:r));setVR(prev=>({...prev,status:'In Progress'}));addToast('success','Marked as In Progress');}}>▶ Start Implementation</Btn>
            <Btn variant="outline" onClick={()=>{setImacList(p=>p.map(r=>r.id===viewReq.id?{...r,status:'Completed',history:[...r.history,{action:'Completed',by:me.id,at:now(),note:'Request fulfilled and closed.'}]}:r));setVR(prev=>({...prev,status:'Completed'}));addToast('success','Request Completed');}}>✓ Mark Completed</Btn>
          </div>}
        </div>;
      })()}
    </Modal>
  </div>;
};

// ─── MODULE SHELL ─────────────────────────────────
const Shell=({module})=>{
  const M={incidents:{t:'Incident Management',icon:'🚨',color:C.danger,pt:'Part 3'},service_req:{t:'Service Request Management',icon:'📋',color:C.success,pt:'Part 3'},problems:{t:'Problem Management',icon:'🔍',color:C.warning,pt:'Part 4'},changes:{t:'Change Management',icon:'🔧',color:C.purple,pt:'Part 4'},cmdb:{t:'Asset & Configuration Management',icon:'🖥️',color:C.cyan,pt:'Part 5'},knowledge:{t:'Knowledge Base',icon:'📚',color:C.success,pt:'Part 6'},sla:{t:'SLA & Escalation',icon:'⏱️',color:C.warning,pt:'Part 6'},reports:{t:'Reports & Analytics',icon:'📊',color:C.purple,pt:'Part 7'},users:{t:'User Management',icon:'🔐',color:C.primary,pt:'Part 1 ✓'}};
  const c=M[module]||M.incidents;
  return <div style={{padding:24,display:'flex',alignItems:'center',justifyContent:'center',minHeight:'calc(100vh - 110px)'}}>
    <div style={{textAlign:'center',maxWidth:440}}>
      <div style={{width:70,height:70,borderRadius:18,background:`${c.color}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:34,margin:'0 auto 16px'}}>{c.icon}</div>
      <h2 style={{fontSize:20,fontWeight:800,color:C.t1,margin:'0 0 8px'}}>{c.t}</h2>
      <div style={{background:`${c.color}0D`,border:`1px dashed ${c.color}60`,borderRadius:8,padding:'12px 16px',display:'inline-flex',alignItems:'center',gap:10,marginTop:12}}>
        <span style={{fontSize:18}}>🔨</span>
        <div style={{textAlign:'left'}}><div style={{fontSize:10,fontWeight:800,color:c.color}}>COMING IN {c.pt}</div><div style={{fontSize:10,color:C.t2,marginTop:1}}>Module is architected. Building in next phase.</div></div>
      </div>
    </div>
  </div>;
};

// ─── LOGIN ────────────────────────────────────────
const Login=({onLogin,users})=>{
  const[email,setEmail]=useState('');
  const[pw,setPw]=useState('');
  const[loading,setL]=useState(false);
  const[err,setErr]=useState('');
  const[sel,setSel]=useState(null);
  const DEMOS=[{r:'SUPER_ADMIN',e:'superadmin@itsm.com',p:'Admin@123'},{r:'ADMIN',e:'admin@itsm.com',p:'Admin@123'},{r:'EMPLOYEE',e:'employee@company.com',p:'Employee@123'},{r:'HELPDESK',e:'helpdesk@company.com',p:'Helpdesk@123'},{r:'AGENT',e:'agent@company.com',p:'Agent@123'},{r:'SERVICE_MANAGER',e:'manager@company.com',p:'Manager@123'}];
  const fill=d=>{setEmail(d.e);setPw(d.p);setSel(d.r);setErr('');};
  const sub=e=>{e.preventDefault();if(!email||!pw){setErr('Enter email and password');return;}setL(true);setTimeout(()=>{const u=users.find(x=>x.email===email&&x.pw===pw);if(!u){setErr('Invalid credentials');setL(false);return;}if(u.status==='inactive'){setErr('Account deactivated');setL(false);return;}onLogin(u);},600);};
  return <div style={{minHeight:'100vh',display:'flex',background:C.bg}}>
    <div style={{width:'42%',background:'linear-gradient(150deg,#0D1B2A,#0F2540 60%,#1A3A6C)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:40,overflow:'hidden',position:'relative'}}>
      <div style={{position:'absolute',top:-60,left:-60,width:260,height:260,borderRadius:'50%',background:'rgba(37,99,235,0.07)'}}/>
      <div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:36,height:36,borderRadius:8,background:C.primary,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>⚡</div><div><div style={{fontSize:17,fontWeight:800,color:'#fff'}}>ITSM<span style={{color:'#60A5FA'}}>Pro</span></div><div style={{fontSize:8,color:'#475569',letterSpacing:'0.1em',textTransform:'uppercase'}}>Enterprise Service Mgmt</div></div></div></div>
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.primary,letterSpacing:'0.1em',marginBottom:6}}>🎉 Part 2 Build</div>
        <h1 style={{fontSize:28,fontWeight:800,color:'#fff',margin:'0 0 12px',lineHeight:1.2}}>Employee & IMAC<br/><span style={{color:'#60A5FA'}}>Management</span></h1>
        {['Org Hierarchy & Tree View','3-Level IMAC Approval Chain','Employee Onboarding Wizard','Department Overview','Full Profile Management'].map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}><div style={{width:16,height:16,borderRadius:'50%',background:'rgba(37,99,235,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><div style={{width:5,height:5,borderRadius:'50%',background:'#60A5FA'}}/></div><span style={{fontSize:12,color:'#94A3B8'}}>{f}</span></div>)}
      </div>
      <div style={{display:'flex',gap:24,borderTop:'1px solid rgba(255,255,255,0.07)',paddingTop:18}}>{[['10+','Employees'],['3','Approval Levels'],['4','IMAC Types']].map(([v,l])=><div key={l}><div style={{fontSize:16,fontWeight:800,color:'#fff'}}>{v}</div><div style={{fontSize:10,color:'#475569'}}>{l}</div></div>)}</div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 50px'}}>
      <div style={{width:'100%',maxWidth:380}}>
        <h2 style={{fontSize:22,fontWeight:800,color:C.t1,margin:'0 0 4px'}}>Sign In</h2>
        <p style={{fontSize:12,color:C.t2,margin:'0 0 18px'}}>ITSM Pro — Part 2 Build</p>
        <div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:18}}>
          <p style={{fontSize:9,fontWeight:800,color:C.t3,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 7px'}}>Quick Login</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {DEMOS.map(d=>{const m=ROLE_META[d.r];const a=sel===d.r;return <button key={d.r} onClick={()=>fill(d)} style={{padding:'3px 8px',borderRadius:20,fontSize:10,fontWeight:700,border:`1px solid ${a?m.color:m.border}`,background:a?m.bg:'#fff',color:a?m.color:C.t2,cursor:'pointer'}}>{m.label}</button>;})}
          </div>
        </div>
        <form onSubmit={sub} style={{display:'flex',flexDirection:'column',gap:11}}>
          <Input label="Email" type="email" value={email} onChange={setEmail} required placeholder="you@company.com"/>
          <Input label="Password" type="password" value={pw} onChange={setPw} required placeholder="Password"/>
          {err&&<div style={{padding:'8px 11px',background:C.dangerLt,border:`1px solid #FECACA`,borderRadius:6,fontSize:12,color:C.danger}}>⚠ {err}</div>}
          <Btn type="submit" size="lg" disabled={loading} sx={{width:'100%',justifyContent:'center',marginTop:3}}>{loading?'Signing in…':'Sign In →'}</Btn>
        </form>
      </div>
    </div>
  </div>;
};

// ─── MAIN APP ─────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[users,setUsers]=useState(SEED_USERS);
  const[imacList,setImacList]=useState(SEED_IMAC);
  const[active,setActive]=useState('dashboard');
  const[col,setCol]=useState(false);
  const[toasts,setToasts]=useState([]);

  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);};
  const currentUser=useMemo(()=>users.find(u=>u.id===user?.id)||user,[users,user]);
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome, ${u.name}!`);};
  const logout=()=>{setUser(null);setActive('dashboard');};

  if(!user)return <Login onLogin={login} users={users}/>;

  const sw=col?56:230;
  const renderModule=()=>{
    if(active==='dashboard')return <Dashboard user={currentUser} users={users} imacList={imacList}/>;
    if(active==='employees')return <EmployeeModule me={currentUser} users={users} setUsers={setUsers} addToast={addToast}/>;
    if(active==='imac')return <IMACModule me={currentUser} users={users} imacList={imacList} setImacList={setImacList} addToast={addToast}/>;
    return <Shell module={active}/>;
  };

  return <div style={{display:'flex',minHeight:'100vh'}}>
    <Sidebar user={currentUser} active={active} onNav={m=>setActive(m)} col={col} setCol={setCol}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <Header user={currentUser} active={active} onLogout={logout} onProfile={()=>setActive('profile')}/>
      <main style={{flex:1,overflowY:'auto'}}>{renderModule()}</main>
    </div>
    <Toast toasts={toasts} rem={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
