const Btn=({children,variant='primary',size='md',onClick,disabled,sx={},type='button',icon})=>{
  const[h,sH]=useState(false);
  const V={primary:{bg:C.primary,bgh:C.primaryH,text:'#fff',bdr:C.primary},danger:{bg:C.danger,bgh:'#B91C1C',text:'#fff',bdr:C.danger},ghost:{bg:'transparent',bgh:C.primaryLt,text:C.primary,bdr:C.border},success:{bg:C.success,bgh:'#047857',text:'#fff',bdr:C.success},warning:{bg:C.warning,bgh:'#B45309',text:'#fff',bdr:C.warning},outline:{bg:'transparent',bgh:'#F8FAFC',text:C.t2,bdr:C.border},purple:{bg:C.purple,bgh:'#6D28D9',text:'#fff',bdr:C.purple},teal:{bg:C.teal,bgh:'#0F766E',text:'#fff',bdr:C.teal},indigo:{bg:C.indigo,bgh:'#4338CA',text:'#fff',bdr:C.indigo}};
  const v=V[variant]||V.primary;
  const sz=size==='sm'?{padding:'4px 10px',fontSize:11}:size==='xs'?{padding:'3px 7px',fontSize:10}:size==='lg'?{padding:'10px 22px',fontSize:14}:{padding:'7px 13px',fontSize:12};
  return <button type={type} disabled={disabled} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} onClick={onClick} style={{background:h&&!disabled?v.bgh:v.bg,color:v.text,border:`1px solid ${v.bdr}`,borderRadius:6,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.6:1,fontWeight:600,display:'inline-flex',alignItems:'center',gap:5,transition:'all .15s',...sz,...sx}}>{icon&&<span style={{fontSize:12}}>{icon}</span>}{children}</button>;
};
const Input=({label,value,onChange,type='text',placeholder,required,error,disabled,sx={}})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3,...sx}}>
    {label&&<label style={{fontSize:10,fontWeight:700,color:C.t2,letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>}
    <input type={type} value={value} onChange={e=>onChange?.(e.target.value)} placeholder={placeholder} disabled={disabled} style={{padding:'7px 10px',border:`1px solid ${error?C.danger:C.border}`,borderRadius:6,fontSize:12,color:C.t1,background:disabled?'#F8FAFC':'#fff',outline:'none',width:'100%'}} onFocus={e=>{if(!error)e.target.style.borderColor=C.primary;}} onBlur={e=>e.target.style.borderColor=error?C.danger:C.border;}/>
    {error&&<span style={{fontSize:10,color:C.danger}}>{error}</span>}
  </div>
);
const Sel=({label,value,onChange,opts,required,disabled,sx={}})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3,...sx}}>
    {label&&<label style={{fontSize:10,fontWeight:700,color:C.t2,letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>}
    <select value={value} onChange={e=>onChange?.(e.target.value)} disabled={disabled} style={{padding:'7px 10px',border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,color:C.t1,background:disabled?'#F8FAFC':'#fff',outline:'none',cursor:'pointer',width:'100%',appearance:'none',backgroundImage:"url(\"data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2394A3B8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E\")",backgroundRepeat:'no-repeat',backgroundPosition:'right 10px center',paddingRight:26}}>
      {opts.map(o=><option key={o.v??o} value={o.v??o}>{o.l??o}</option>)}
    </select>
  </div>
);
const Modal=({open,title,onClose,children,width=620})=>{
  if(!open)return null;
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:'#fff',borderRadius:10,boxShadow:'0 25px 60px rgba(0,0,0,0.25)',width:'100%',maxWidth:width,maxHeight:'92vh',display:'flex',flexDirection:'column',overflow:'hidden',animation:'slideUp .2s ease'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <h3 style={{margin:0,fontSize:14,fontWeight:800,color:C.t1}}>{title}</h3>
        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:C.t3,lineHeight:1,padding:'2px 6px'}}>×</button>
      </div>
      <div style={{padding:18,overflowY:'auto',flex:1}}>{children}</div>
    </div>
  </div>;
};
const Toast=({toasts,rem})=>(
  <div style={{position:'fixed',bottom:18,right:18,zIndex:9999,display:'flex',flexDirection:'column',gap:7}}>
    {toasts.map(t=>{const g=t.type==='success'?{bg:'#ECFDF5',bdr:'#A7F3D0',left:C.success,ic:'✓'}:t.type==='error'?{bg:'#FEF2F2',bdr:'#FECACA',left:C.danger,ic:'✗'}:t.type==='warning'?{bg:'#FFFBEB',bdr:'#FDE68A',left:C.warning,ic:'⚠'}:{bg:'#EFF6FF',bdr:'#BFDBFE',left:C.primary,ic:'ℹ'};
    return <div key={t.id} onClick={()=>rem(t.id)} style={{background:g.bg,border:`1px solid ${g.bdr}`,borderLeft:`3px solid ${g.left}`,color:g.left,padding:'9px 13px',borderRadius:6,fontSize:12,fontWeight:600,boxShadow:'0 4px 14px rgba(0,0,0,0.1)',display:'flex',alignItems:'center',gap:9,minWidth:260,maxWidth:340,cursor:'pointer',animation:'slideUp .2s ease'}}>
      <span>{g.ic}</span><span style={{flex:1}}>{t.msg}</span><span style={{opacity:.4}}>×</span>
    </div>;})}
  </div>
);

// ── SVG CHARTS ────────────────────────────────────
const BarChart=({data,keyX='month',keys=[],colors=[],height=120,showLegend=true,title})=>{
  const maxVal=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  const cW=Math.floor(560/data.length)-4;
  const bW=Math.floor((cW-4)/keys.length);
  const totalW=560;
  return <div>
    {title&&<div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>{title}</div>}
    {showLegend&&<div style={{display:'flex',gap:10,marginBottom:8,flexWrap:'wrap'}}>
      {keys.map((k,i)=><div key={k} style={{display:'flex',alignItems:'center',gap:4}}><div style={{width:10,height:10,borderRadius:2,background:colors[i]||C.primary}}/><span style={{fontSize:10,color:C.t2}}>{k}</span></div>)}
    </div>}
    <svg width="100%" viewBox={`0 0 ${totalW} ${height+30}`}>
      {data.map((d,di)=>{
        const xBase=di*(cW+4)+2;
        return <g key={di}>
          {keys.map((k,ki)=>{const val=d[k]||0;const h=Math.max(2,(val/maxVal)*height);const x=xBase+ki*(bW+2)+2;const y=height-h;
            return <g key={k}><rect x={x} y={y} width={bW} height={h} rx={2} fill={colors[ki]||C.primary} opacity={0.8}/><text x={x+bW/2} y={y-3} fontSize="8" fill={C.t3} textAnchor="middle">{val}</text></g>;})}
          <text x={xBase+cW/2} y={height+16} fontSize="9" fill={C.t3} textAnchor="middle">{d[keyX]}</text>
        </g>;})}
      <line x1={0} y1={height} x2={totalW} y2={height} stroke={C.border} strokeWidth={1}/>
    </svg>
  </div>;
};

const LineChart=({data,keyX='month',keys=[],colors=[],height=100,title})=>{
  const maxVal=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  const stepW=560/(data.length-1||1);
  const totalW=560;
  const pts=(key)=>data.map((d,i)=>({x:i*stepW,y:height-(d[key]/maxVal)*height}));
  return <div>
    {title&&<div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>{title}</div>}
    <div style={{display:'flex',gap:10,marginBottom:8,flexWrap:'wrap'}}>
      {keys.map((k,i)=><div key={k} style={{display:'flex',alignItems:'center',gap:4}}><div style={{width:14,height:3,borderRadius:2,background:colors[i]||C.primary}}/><span style={{fontSize:10,color:C.t2}}>{k}</span></div>)}
    </div>
    <svg width="100%" viewBox={`0 0 ${totalW} ${height+30}`}>
      <line x1={0} y1={height} x2={totalW} y2={height} stroke={C.border} strokeWidth={0.5}/>
      {[0.25,0.5,0.75].map(f=><line key={f} x1={0} y1={height*(1-f)} x2={totalW} y2={height*(1-f)} stroke={C.borderFaint} strokeWidth={0.5}/>)}
      {keys.map((k,ki)=>{
        const p=pts(k);
        const d='M'+p.map(pt=>`${pt.x},${pt.y}`).join('L');
        const areaD='M'+p.map(pt=>`${pt.x},${pt.y}`).join('L')+`L${p[p.length-1].x},${height}L${p[0].x},${height}Z`;
        return <g key={k}>
          <path d={areaD} fill={colors[ki]||C.primary} opacity={0.07}/>
          <path d={d} fill="none" stroke={colors[ki]||C.primary} strokeWidth={2} strokeLinejoin="round"/>
          {p.map((pt,pi)=><circle key={pi} cx={pt.x} cy={pt.y} r={3} fill={colors[ki]||C.primary}/>)}
        </g>;})}
      {data.map((d,i)=><text key={i} x={i*stepW} y={height+16} fontSize="9" fill={C.t3} textAnchor="middle">{d[keyX]}</text>)}
    </svg>
  </div>;
};

const DonutChart=({data,colors=[],size=140,title})=>{
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  let cumulative=0;
  const R=56,cx=70,cy=70,strokeW=18;
  const circumference=2*Math.PI*R;
  const segments=data.map((d,i)=>{const start=cumulative;const pct=d.value/total;cumulative+=pct;return{...d,pct,dasharray:`${circumference*pct} ${circumference*(1-pct)}`,offset:circumference*(1-start)};});
  return <div style={{display:'flex',alignItems:'center',gap:14}}>
    <div style={{flexShrink:0}}>
      {title&&<div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:6,textAlign:'center'}}>{title}</div>}
      <svg width={size} height={size} viewBox={`0 0 ${cx*2} ${cy*2}`}>
        <circle cx={cx} cy={cy} r={R} fill="none" stroke={C.borderFaint} strokeWidth={strokeW}/>
        {segments.map((s,i)=><circle key={i} cx={cx} cy={cy} r={R} fill="none" stroke={colors[i]||C.primary} strokeWidth={strokeW} strokeDasharray={s.dasharray} strokeDashoffset={s.offset} transform={`rotate(-90 ${cx} ${cy})`} opacity={0.85}/>)}
        <text x={cx} y={cy-4} fontSize="18" fontWeight="800" fill={C.t1} textAnchor="middle" dominantBaseline="middle">{total}</text>
        <text x={cx} y={cy+14} fontSize="9" fill={C.t3} textAnchor="middle">Total</text>
      </svg>
    </div>
    <div style={{flex:1}}>
      {segments.map((s,i)=><div key={s.label} style={{display:'flex',alignItems:'center',gap:7,marginBottom:5}}>
        <div style={{width:8,height:8,borderRadius:2,background:colors[i]||C.primary,flexShrink:0}}/>
        <span style={{fontSize:10,color:C.t2,flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.label}</span>
        <span style={{fontSize:10,fontWeight:700,color:C.t1,flexShrink:0}}>{s.value}</span>
        <span style={{fontSize:9,color:C.t3,flexShrink:0}}>{Math.round(s.pct*100)}%</span>
      </div>)}
    </div>
  </div>;
};

const GaugeChart=({value,max=100,label,color=C.primary,size=100})=>{
  const pct=Math.min(value/max,1);const angle=pct*180-180;const R=42;const cx=60,cy=60;
  const toXY=(deg,r)=>({x:cx+r*Math.cos((deg*Math.PI)/180),y:cy+r*Math.sin((deg*Math.PI)/180)});
  const arcPath=(startDeg,endDeg,r)=>{const s=toXY(startDeg,r),e=toXY(endDeg,r);const large=endDeg-startDeg>180?1:0;return `M${s.x},${s.y} A${r},${r},0,${large},1,${e.x},${e.y}`;};
  const needle=toXY(180+pct*180,30);
  return <div style={{textAlign:'center'}}>
    <svg width={size} height={size*0.7} viewBox="0 0 120 75">
      <path d={arcPath(180,360,R)} fill="none" stroke="#F1F5F9" strokeWidth={10} strokeLinecap="round"/>
      <path d={arcPath(180,180+pct*180,R)} fill="none" stroke={color} strokeWidth={10} strokeLinecap="round"/>
      <line x1={cx} y1={cy} x2={needle.x} y2={needle.y} stroke={C.t1} strokeWidth={2} strokeLinecap="round"/>
      <circle cx={cx} cy={cy} r={4} fill={C.t1}/>
      <text x={cx} y={70} fontSize="14" fontWeight="800" fill={color} textAnchor="middle">{Math.round(value)}%</text>
    </svg>
    <div style={{fontSize:10,color:C.t2,marginTop:-4}}>{label}</div>
  </div>;
};

const StatCard=({label,value,icon,color,trend,trendUp,sub,big=false})=>(
  <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:big?16:13,display:'flex',flexDirection:'column',gap:9}}>
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>

              <span style={{fontSize:11,color:C.t2,minWidth:110}}>{c.cat}</span>
              <div style={{flex:1,height:7,background:'#F1F5F9',borderRadius:3}}>
                <div style={{height:7,borderRadius:3,background:C.primary,width:`${c.pct*5}%`,transition:'width .5s'}}/>
              </div>
              <span style={{fontSize:11,fontWeight:700,color:C.t1,minWidth:24,textAlign:'right'}}>{c.count}</span>
              <span style={{fontSize:10,color:C.t3,minWidth:32}}>{c.pct}%</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,fontWeight:800,color:C.t1}}>Priority Breakdown & SLA</span>
          <Btn size="sm" variant="outline" icon="📥" onClick={()=>simulateExport('CSV','Incident Priority Report')}>{exportingId==='Incident Priority Report'?'Exporting…':'Export CSV'}</Btn>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:600}}>
            <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
              {['Priority','Total','Resolved','Open','Avg Resolve','SLA Compliance','SLA Breaches'].map(h=><th key={h} style={{padding:'7px 12px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>{D.incidentByPriority.map(p=><tr key={p.priority} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
              <td style={{padding:'9px 12px'}}><span style={{fontSize:11,fontWeight:800,color:priColors[p.priority]}}>{p.priority}</span></td>
              <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:C.t1}}>{p.count}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.success}}>{p.resolved}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.warning}}>{p.count-p.resolved}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.t2}}>{p.avgH}h</td>
              <td style={{padding:'9px 12px'}}>
                <div style={{display:'flex',alignItems:'center',gap:7}}>
                  <div style={{width:60,height:5,background:'#F1F5F9',borderRadius:2}}>
                    <div style={{height:5,borderRadius:2,background:p.sla>=90?C.success:p.sla>=80?C.warning:C.danger,width:`${p.sla}%`}}/>
                  </div>
                  <span style={{fontSize:11,fontWeight:700,color:p.sla>=90?C.success:p.sla>=80?C.warning:C.danger}}>{p.sla}%</span>
                </div>
              </td>
              <td style={{padding:'9px 12px',fontSize:11,color:p.count-p.resolved>0?C.danger:C.success}}>{p.count-p.resolved}</td>
            </tr>)}</tbody>
          </table>
        </div>
      </div>
    </div>}

    {/* ── SERVICE REQUESTS ────────────────────── */}
    {tab==='service'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}}>
        <StatCard label="Total SRs" value={D.summary.totalSR} icon="📋" color={C.cyan}/>
        <StatCard label="Open SRs" value={D.summary.openSR} icon="📂" color={C.warning}/>
        <StatCard label="Fulfilled (30d)" value={D.summary.fulfilledThisMonth} icon="✅" color={C.success}/>
        <StatCard label="Avg Fulfilment" value={`${D.summary.avgFulfilmentH}h`} icon="⏱️" color={C.primary}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <BarChart title="SR Volume by Month (Submitted vs Fulfilled)" data={D.srByMonth} keyX="month" keys={['submitted','fulfilled']} colors={[C.cyan,C.success]}/>
        </div>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <DonutChart title="Top Catalog Items" data={D.srByCatalog.slice(0,6).map(s=>({label:s.name,value:s.count}))} colors={[C.primary,C.cyan,C.teal,C.indigo,C.purple,C.orange]} size={130}/>
        </div>
      </div>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,fontWeight:800,color:C.t1}}>Service Catalog Performance</span>
          <Btn size="sm" variant="outline" icon="📥" onClick={()=>simulateExport('CSV','SR Catalog Report')}>Export CSV</Btn>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:560}}>
            <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
              {['Catalog Item','Total','Fulfilled','Pending','Avg Time','Fulfilment Rate'].map(h=><th key={h} style={{padding:'7px 12px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>{D.srByCatalog.map(s=>{const rate=Math.round(s.fulfilled/s.count*100);return <tr key={s.name} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
              <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:C.t1}}>{s.name}</td>
              <td style={{padding:'9px 12px',fontSize:12,color:C.t1}}>{s.count}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.success}}>{s.fulfilled}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.warning}}>{s.count-s.fulfilled}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.t2}}>{s.avgH}h</td>
              <td style={{padding:'9px 12px'}}>
                <div style={{display:'flex',alignItems:'center',gap:7}}>
                  <div style={{width:50,height:5,background:'#F1F5F9',borderRadius:2}}><div style={{height:5,borderRadius:2,background:rate>=90?C.success:rate>=70?C.warning:C.danger,width:`${rate}%`}}/></div>
                  <span style={{fontSize:11,fontWeight:700,color:rate>=90?C.success:rate>=70?C.warning:C.danger}}>{rate}%</span>
                </div>
              </td>
            </tr>;})}
            </tbody>
          </table>
        </div>
      </div>
    </div>}

    {/* ── AGENT PERFORMANCE ───────────────────── */}
    {tab==='agents'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}}>
        <StatCard label="Active Agents" value={D.summary.activeAgents} icon="👥" color={C.primary}/>
        <StatCard label="Avg FCR Rate" value={`${Math.round(D.agentPerf.reduce((s,a)=>s+a.fcr,0)/D.agentPerf.length)}%`} icon="🎯" color={C.success}/>
        <StatCard label="Avg CSAT" value={(D.agentPerf.reduce((s,a)=>s+a.csat,0)/D.agentPerf.length).toFixed(1)} icon="⭐" color={C.warning}/>
        <StatCard label="Total Breaches" value={D.agentPerf.reduce((s,a)=>s+a.breaches,0)} icon="⚠️" color={C.danger}/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <BarChart title="Tickets Assigned vs Resolved per Agent" data={D.agentPerf.map(a=>({month:a.name.split(' ')[0],assigned:a.assigned,resolved:a.resolved}))} keyX="month" keys={['assigned','resolved']} colors={[C.primary,C.success]}/>
        </div>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>CSAT & FCR by Agent</div>
          {D.agentPerf.map(a=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,padding:'8px 10px',background:'#F8FAFC',borderRadius:6}}>
              <Avatar name={a.name} size={30}/>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:700,color:C.t1}}>{a.name}</div>
                <div style={{display:'flex',gap:10,marginTop:3}}>
                  <span style={{fontSize:10,color:C.warning}}>⭐ {a.csat}/5 CSAT</span>
                  <span style={{fontSize:10,color:C.primary}}>🎯 {a.fcr}% FCR</span>
                  <span style={{fontSize:10,color:C.t3}}>⏱ {a.avgResH}h avg</span>
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:13,fontWeight:800,color:a.breaches>4?C.danger:a.breaches>2?C.warning:C.success}}>{a.breaches}</div>
                <div style={{fontSize:9,color:C.t3}}>breaches</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,fontWeight:800,color:C.t1}}>Agent Performance Table</span>
          <Btn size="sm" variant="outline" icon="📥" onClick={()=>simulateExport('CSV','Agent Performance Report')}>Export CSV</Btn>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:700}}>
            <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
              {['Agent','Role','Assigned','Resolved','Resolve Rate','Avg Time','FCR','CSAT','Breaches','Reopened'].map(h=><th key={h} style={{padding:'7px 12px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>{D.agentPerf.map(a=>{const u=USERS.find(x=>x.id===a.id);const rate=Math.round(a.resolved/a.assigned*100);return <tr key={a.id} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
              <td style={{padding:'9px 12px'}}><div style={{display:'flex',alignItems:'center',gap:7}}><Avatar name={a.name} size={24}/><span style={{fontSize:12,fontWeight:700,color:C.t1}}>{a.name}</span></div></td>
              <td style={{padding:'9px 12px'}}><RoleBadge role={u?.role}/></td>
              <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:C.t1}}>{a.assigned}</td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.success}}>{a.resolved}</td>
              <td style={{padding:'9px 12px'}}><span style={{fontSize:11,fontWeight:700,color:rate>=90?C.success:rate>=80?C.warning:C.danger}}>{rate}%</span></td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.t2}}>{a.avgResH}h</td>
              <td style={{padding:'9px 12px'}}><span style={{fontSize:11,fontWeight:700,color:a.fcr>=75?C.success:C.warning}}>{a.fcr}%</span></td>
              <td style={{padding:'9px 12px'}}><span style={{fontSize:11,fontWeight:700,color:a.csat>=4.5?C.success:a.csat>=4?C.warning:C.danger}}>{'⭐'.repeat(Math.round(a.csat))} {a.csat}</span></td>
              <td style={{padding:'9px 12px'}}><span style={{fontSize:11,fontWeight:700,color:a.breaches>4?C.danger:a.breaches>2?C.warning:C.success}}>{a.breaches}</span></td>
              <td style={{padding:'9px 12px',fontSize:11,color:C.t2}}>{a.reopened}</td>
            </tr>;})}
            </tbody>
          </table>
        </div>
      </div>
    </div>}

    {/* ── SLA ─────────────────────────────────── */}
    {tab==='sla'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:14}}>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:18,textAlign:'center'}}>
          <GaugeChart value={D.summary.slaCompliance} max={100} label="Overall SLA Compliance" color={D.summary.slaCompliance>=90?C.success:C.warning} size={140}/>
          <div style={{fontSize:11,color:C.t3,marginTop:4}}>{D.summary.withinSLA||215}/{D.summary.totalIncidents} tickets within SLA</div>
        </div>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>By Priority</div>
          {D.incidentByPriority.map(p=><div key={p.priority} style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
              <span style={{fontSize:11,fontWeight:700,color:priColors[p.priority]}}>{p.priority}</span>
              <span style={{fontSize:11,fontWeight:800,color:p.sla>=90?C.success:p.sla>=80?C.warning:C.danger}}>{p.sla}%</span>
            </div>
            <div style={{height:8,background:'#F1F5F9',borderRadius:3}}>
              <div style={{height:8,borderRadius:3,background:p.sla>=90?C.success:p.sla>=80?C.warning:C.danger,width:`${p.sla}%`,transition:'width .6s'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:2}}>
              <span style={{fontSize:9,color:C.t3}}>{p.within||Math.round(p.count*p.sla/100)}/{p.count}</span>
              <span style={{fontSize:9,color:C.danger,fontWeight:700}}>{p.count-p.resolved>0?`${p.count-Math.round(p.count*p.sla/100)} breached`:''}</span>
            </div>
          </div>)}
        </div>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <LineChart title="Compliance Trend" data={D.slaByMonth} keyX="month" keys={['compliance','breaches']} colors={[C.success,C.danger]} height={110}/>
        </div>
      </div>
    </div>}

    {/* ── ASSETS ──────────────────────────────── */}
    {tab==='assets'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}}>
        <StatCard label="Total Assets" value={D.summary.totalAssets} icon="🖥️" color={C.teal}/>
        <StatCard label="Active" value={D.summary.activeAssets} icon="✅" color={C.success}/>
        <StatCard label="In Repair / Retired" value={D.summary.totalAssets-D.summary.activeAssets} icon="🔧" color={C.warning}/>
        <StatCard label="Expiring Licenses" value={1} icon="⚠️" color={C.danger}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <BarChart title="Assets by Type" data={D.assetsByType.map(a=>({month:a.type.substring(0,8),active:a.active,inactive:a.count-a.active}))} keyX="month" keys={['active','inactive']} colors={[C.teal,C.t3]}/>
        </div>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <DonutChart title="Distribution by Type" data={D.assetsByType.slice(0,7).map(a=>({label:a.type,value:a.count}))} colors={[C.teal,C.primary,C.indigo,C.cyan,C.orange,C.purple,C.t3]} size={130}/>
        </div>
      </div>
    </div>}

    {/* ── SAVED REPORTS ───────────────────────── */}
    {tab==='saved'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12,marginBottom:14}}>
        {REPORT_TEMPLATES.map(t=>(
          <div key={t.id} onClick={()=>setST(t)} style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14,cursor:'pointer',transition:'all .15s'}} onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 2px 10px rgba(0,0,0,0.08)';e.currentTarget.style.borderColor=C.purple;}} onMouseLeave={e=>{e.currentTarget.style.boxShadow='none';e.currentTarget.style.borderColor=C.border;}}>
            <div style={{fontSize:28,marginBottom:8}}>{t.icon}</div>
            <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:3}}>{t.name}</div>
            <div style={{fontSize:11,color:C.t2,marginBottom:8}}>{t.desc}</div>
            <Tag label={t.category} color={C.purple} bg={C.purpleLt}/>
            <div style={{marginTop:8,display:'flex',gap:6}}>
              <Btn size="xs" variant="outline" onClick={e=>{e.stopPropagation();simulateExport('PDF',t.name);}}>PDF</Btn>
              <Btn size="xs" variant="outline" onClick={e=>{e.stopPropagation();simulateExport('CSV',t.name);}}>CSV</Btn>
              <Btn size="xs" variant="outline" onClick={e=>{e.stopPropagation();simulateExport('Excel',t.name);}}>Excel</Btn>
            </div>
          </div>
        ))}
      </div>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,fontSize:12,fontWeight:800,color:C.t1}}>Recently Generated Reports</div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
            {['Report Name','Template','Generated By','Date','Format','Actions'].map(h=><th key={h} style={{padding:'7px 12px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{h}</th>)}
          </tr></thead>
          <tbody>{savedReports.map(r=>{const u=USERS.find(x=>x.id===r.by);const t=REPORT_TEMPLATES.find(x=>x.id===r.template);return <tr key={r.id} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
            <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:C.t1}}>{r.name}</td>
            <td style={{padding:'9px 12px',fontSize:11,color:C.t2}}>{t?.name||'—'}</td>
            <td style={{padding:'9px 12px'}}>{u&&<div style={{display:'flex',alignItems:'center',gap:5}}><Avatar name={u.name} size={20}/><span style={{fontSize:11,color:C.t2}}>{u.name}</span></div>}</td>
            <td style={{padding:'9px 12px',fontSize:11,color:C.t3,whiteSpace:'nowrap'}}>{r.created}</td>
            <td style={{padding:'9px 12px'}}><Tag label={r.format} color={r.format==='PDF'?C.danger:r.format==='Excel'?C.success:C.primary} bg={r.format==='PDF'?C.dangerLt:r.format==='Excel'?C.successLt:C.primaryLt}/></td>
            <td style={{padding:'9px 12px'}}><Btn size="xs" variant="outline" icon="📥" onClick={()=>simulateExport(r.format,r.name)}>Download</Btn></td>
          </tr>;})}
          </tbody>
        </table>
      </div>
    </div>}

    <Modal open={!!selectedTemplate} title={selectedTemplate?.name||''} onClose={()=>setST(null)} width={500}>
      {selectedTemplate&&<div>
        <div style={{fontSize:36,textAlign:'center',marginBottom:8}}>{selectedTemplate.icon}</div>
        <p style={{fontSize:13,color:C.t2,textAlign:'center',marginBottom:16}}>{selectedTemplate.desc}</p>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:7}}>Includes</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
            {selectedTemplate.fields.map(f=><Tag key={f} label={f} color={C.primary} bg={C.primaryLt}/>)}
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
          <Sel label="Date Range" value={dateRange} onChange={setDR} opts={[{v:'7d',l:'Last 7 days'},{v:'30d',l:'Last 30 days'},{v:'90d',l:'Last 90 days'},{v:'ytd',l:'Year to date'}]}/>
          <Sel label="Format" value="PDF" onChange={()=>{}} opts={[{v:'PDF',l:'PDF'},{v:'Excel',l:'Excel'},{v:'CSV',l:'CSV'}]}/>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <Btn variant="outline" onClick={()=>setST(null)}>Cancel</Btn>
          <Btn variant="outline" icon="📥" onClick={()=>{simulateExport('CSV',selectedTemplate.name);setST(null);}}>Export CSV</Btn>
          <Btn icon="📄" onClick={()=>{simulateExport('PDF',selectedTemplate.name);setST(null);}}>Generate PDF</Btn>
        </div>
      </div>}
    </Modal>
    <Modal open={showBuilder} title="Custom Report Builder" onClose={()=>setSB(false)} width={580}>
      <div style={{fontSize:13,color:C.t2,marginBottom:14}}>Build a custom report by selecting modules and metrics.</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
        <Input label="Report Name" value="My Custom Report" onChange={()=>{}} placeholder="Report name…"/>
        <Sel label="Primary Module" value="incidents" onChange={()=>{}} opts={['incidents','service_req','problems','changes','cmdb','knowledge','sla','agents'].map(v=>({v,l:v}))}/>
        <Sel label="Date Range" value={dateRange} onChange={setDR} opts={[{v:'7d',l:'Last 7 days'},{v:'30d',l:'Last 30 days'},{v:'90d',l:'Last 90 days'},{v:'ytd',l:'Year to date'}]}/>
        <Sel label="Group By" value="month" onChange={()=>{}} opts={['month','week','priority','category','agent','department'].map(v=>({v,l:v}))}/>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:700,color:C.t2,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:8}}>Metrics to Include</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {['Volume','SLA Compliance','Resolution Time','First Call Resolution','CSAT','Breaches','Agent Performance','Category Breakdown'].map(m=>(
            <label key={m} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.t1,padding:'4px 9px',border:`1px solid ${C.border}`,borderRadius:6,cursor:'pointer',background:'#F8FAFC'}}>
              <input type="checkbox" defaultChecked/> {m}
            </label>
          ))}
        </div>
      </div>
      <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
        <Btn variant="outline" onClick={()=>setSB(false)}>Cancel</Btn>
        <Btn onClick={()=>{simulateExport('CSV','Custom Report');setSB(false);}}>Generate & Export</Btn>
      </div>
    </Modal>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// INTEGRATIONS MODULE
// ══════════════════════════════════════════════════════════════
const IntegrationsModule=({me,integrations,setIntegrations,addToast})=>{
  const[tab,setTab]=useState('connectors');
  const[selected,setSelected]=useState(null);
  const[showNew,setSN]=useState(false);
  const[testResult,setTR]=useState(null);
  const[testingId,setTI]=useState(null);
  const canEdit=['ADMIN','SUPER_ADMIN'].includes(me.role);
  const catColors={ITSM:C.primary,'Identity':C.purple,'Project Mgmt':C.indigo,'Notifications':C.cyan,'Alerting':C.danger,'Email':C.teal,'Asset Discovery':C.orange,'Monitoring':C.teal,'Analytics':C.warning,'HR':C.rose,'Cloud':C.indigo,'API':C.success};

  const toggleInt=id=>{
    setIntegrations(p=>p.map(i=>i.id===id?{...i,enabled:!i.enabled}:i));
    addToast('success','Integration updated');
  };

  const testConnection=id=>{
    setTI(id);
    setTimeout(()=>{
      setTI(null);
      const success=Math.random()>0.2;
      setTR({id,success,msg:success?'Connection successful — 200 OK (142ms)':'Connection failed — timeout after 5000ms'});
      addToast(success?'success':'error',success?'Connection test passed':'Connection test failed');
    },1500);
  };

  const ApiDocSection=()=>(
    <div>
      <div style={{background:'linear-gradient(135deg,#0D1B2A,#1E3A6C)',borderRadius:10,padding:20,marginBottom:14,color:'#fff'}}>
        <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>⚡ ITSM Pro REST API</div>
        <div style={{fontSize:11,opacity:.7,marginBottom:10}}>Base URL: <code style={{background:'rgba(255,255,255,0.1)',padding:'2px 7px',borderRadius:4,fontFamily:'monospace'}}>https://itsm.company.com/api/v1</code></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <span style={{background:'rgba(255,255,255,0.1)',padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700}}>REST JSON</span>
          <span style={{background:'rgba(255,255,255,0.1)',padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700}}>JWT Auth</span>
          <span style={{background:'rgba(255,255,255,0.1)',padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700}}>OpenAPI 3.0</span>
          <span style={{background:'rgba(255,255,255,0.1)',padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700}}>Webhook Support</span>
          <span style={{background:'rgba(255,255,255,0.1)',padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:700}}>Rate: 1000 req/min</span>
        </div>
      </div>

      {[
        {method:'GET',path:'/incidents',desc:'List all incidents with filters',params:'?status=Open&priority=P1&page=1&limit=50'},
        {method:'POST',path:'/incidents',desc:'Create a new incident',body:'{"title":"…","priority":"P1","category":"Network","assignedTo":"u5"}'},
        {method:'GET',path:'/incidents/{id}',desc:'Get incident by ID',params:''},
        {method:'PATCH',path:'/incidents/{id}',desc:'Update incident status/assignment',body:'{"status":"Resolved","notes":"Fixed via script"}'},
        {method:'GET',path:'/service-requests',desc:'List service requests',params:'?status=Pending+Approval'},
        {method:'POST',path:'/service-requests',desc:'Submit a service request from catalog',body:'{"catalogId":"sc3","title":"VPN Access","fields":{}}'},
        {method:'GET',path:'/cmdb/cis',desc:'Query CMDB configuration items',params:'?type=Server&status=Active&env=Production'},
        {method:'POST',path:'/cmdb/cis',desc:'Register a new CI in CMDB',body:'{"name":"NEW-SRV-01","type":"Server","env":"Production"}'},
        {method:'GET',path:'/users',desc:'List users with role filter',params:'?role=AGENT&dept=IT'},
        {method:'GET',path:'/analytics/summary',desc:'Get platform analytics summary',params:'?range=30d'},
        {method:'POST',path:'/webhooks',desc:'Register an outbound webhook',body:'{"url":"https://…","events":["incident.created","sla.breached"]}'},
        {method:'GET',path:'/sla/policies',desc:'List SLA policies',params:'?active=true'},
      ].map((ep,i)=>{
        const mc={GET:C.success,POST:C.primary,PATCH:C.warning,DELETE:C.danger};
        return <div key={i} style={{background:'#F8FAFC',borderRadius:7,border:`1px solid ${C.border}`,padding:'9px 12px',marginBottom:6,fontFamily:'monospace'}}>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:ep.params||ep.body?5:0}}>
            <span style={{fontSize:10,fontWeight:800,color:mc[ep.method]||C.t2,background:mc[ep.method]+'18',padding:'2px 7px',borderRadius:20,minWidth:46,textAlign:'center'}}>{ep.method}</span>
            <span style={{fontSize:12,color:C.primary,fontWeight:700}}>{ep.path}</span>
            <span style={{fontSize:10,color:C.t3,fontFamily:'sans-serif',marginLeft:'auto'}}>{ep.desc}</span>
          </div>
          {ep.params&&<div style={{fontSize:10,color:C.t3,paddingLeft:54}}>Params: <span style={{color:C.teal}}>{ep.params}</span></div>}
          {ep.body&&<div style={{fontSize:10,color:C.t3,paddingLeft:54}}>Body: <span style={{color:C.orange}}>{ep.body}</span></div>}
        </div>;
      })}
    </div>
  );

  const WebhookSection=()=>(
    <div>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14,marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>Webhook Events Available</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
          {['incident.created','incident.updated','incident.resolved','incident.sla_breached','service_request.submitted','service_request.approved','change.submitted','change.approved','change.completed','problem.kedb_added','asset.registered','user.created'].map(ev=>(
            <div key={ev} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',background:'#F8FAFC',borderRadius:6,border:`1px solid ${C.border}`}}>
              <div style={{width:7,height:7,borderRadius:'50%',background:C.success,flexShrink:0}}/>
              <code style={{fontSize:11,color:C.primary}}>{ev}</code>
            </div>
          ))}
        </div>
      </div>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,fontSize:12,fontWeight:800,color:C.t1}}>Recent Webhook Deliveries</div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
            {['Event','Target','Status','Payload Preview','Time','Duration'].map(h=><th key={h} style={{padding:'7px 12px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{h}</th>)}
          </tr></thead>
          <tbody>{WEBHOOK_LOGS.map(l=><tr key={l.id} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
            <td style={{padding:'8px 12px'}}><code style={{fontSize:10,color:C.primary}}>{l.event}</code></td>
            <td style={{padding:'8px 12px',fontSize:11,color:C.t2}}>{l.target}</td>
            <td style={{padding:'8px 12px'}}><span style={{fontSize:10,fontWeight:700,color:l.status==='Success'?C.success:C.danger,background:l.status==='Success'?C.successLt:C.dangerLt,padding:'2px 7px',borderRadius:20}}>{l.status}</span></td>
            <td style={{padding:'8px 12px',fontSize:10,color:C.t2,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.payload}</td>
            <td style={{padding:'8px 12px',fontSize:10,color:C.t3,whiteSpace:'nowrap'}}>{l.at}</td>
            <td style={{padding:'8px 12px',fontSize:10,color:l.ms>1000?C.danger:C.success}}>{l.ms}ms</td>
          </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  );

  return <div style={{height:'calc(100vh - 50px)',overflowY:'auto',padding:'16px 18px',maxWidth:1300}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Integration Framework</h2><p style={{fontSize:10,color:C.t2,margin:0}}>{integrations.filter(i=>i.enabled).length} active · {integrations.length} configured · Built for enterprise extensibility</p></div>
      {canEdit&&<Btn icon="+" onClick={()=>setSN(true)}>Add Integration</Btn>}
    </div>

    <div style={{display:'flex',gap:0,marginBottom:12,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:3,width:'fit-content'}}>
      {[['connectors','🔌 Connectors'],['api','📡 REST API Docs'],['webhooks','🔔 Webhooks']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:'5px 13px',borderRadius:5,border:'none',background:tab===v?C.indigo:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>{l}</button>)}
    </div>

    {tab==='api'&&<ApiDocSection/>}
    {tab==='webhooks'&&<WebhookSection/>}

    {tab==='connectors'&&<>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:10}}>
        {integrations.map(int=>{
          const catColor=catColors[int.category]||C.primary;
          const isSelected=selected?.id===int.id;
          const isTesting=testingId===int.id;
          const tRes=testResult?.id===int.id?testResult:null;
          return <div key={int.id} onClick={()=>setSelected(isSelected?null:int)} style={{background:C.card,borderRadius:8,border:`2px solid ${isSelected?catColor:int.enabled?C.border:'#F1F5F9'}`,padding:14,cursor:'pointer',transition:'all .15s',opacity:int.enabled?1:0.65}} onMouseEnter={e=>{if(!isSelected)e.currentTarget.style.borderColor=catColor;}} onMouseLeave={e=>{if(!isSelected)e.currentTarget.style.borderColor=int.enabled?C.border:'#F1F5F9';}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:10}}>
              <div style={{width:40,height:40,borderRadius:9,background:`${catColor}18`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{int.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:2}}>{int.name}</div>
                <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                  <Tag label={int.type} color={catColor} bg={catColor+'18'}/>
                  <Tag label={int.category} color={C.t3} bg='#F1F5F9'/>
                </div>
              </div>
              <span style={{fontSize:9,fontWeight:800,color:int.enabled?C.success:C.t3,background:int.enabled?C.successLt:'#F1F5F9',padding:'2px 7px',borderRadius:20,flexShrink:0}}>{int.enabled?'Active':'Off'}</span>
            </div>
            <div style={{fontSize:11,color:C.t2,marginBottom:8,lineHeight:1.5}}>{int.desc}</div>
            <div style={{fontSize:10,color:C.t3,marginBottom:8,fontFamily:'monospace',background:'#F8FAFC',padding:'4px 8px',borderRadius:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{int.endpoint}</div>
            <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:6}}>
              <span style={{fontSize:9,color:C.t3}}>🔑 {int.authType}</span>
              <span style={{fontSize:9,color:C.t3}}>· {int.syncCount.toLocaleString()} syncs</span>
              <span style={{fontSize:9,color:C.t3}}>· Last: {int.lastSync}</span>
            </div>
            {tRes&&<div style={{padding:'5px 8px',borderRadius:5,background:tRes.success?C.successLt:C.dangerLt,fontSize:10,fontWeight:600,color:tRes.success?C.success:C.danger,marginBottom:6}}>{tRes.success?'✓':'✗'} {tRes.msg}</div>}
            {canEdit&&<div style={{display:'flex',gap:5}} onClick={e=>e.stopPropagation()}>
              <Btn size="xs" variant="outline" onClick={()=>testConnection(int.id)} disabled={isTesting}>{isTesting?'Testing…':'Test'}</Btn>
              <Btn size="xs" variant={int.enabled?'warning':'success'} onClick={()=>toggleInt(int.id)}>{int.enabled?'Disable':'Enable'}</Btn>
            </div>}
          </div>;
        })}
      </div>
    </>}

    <Modal open={showNew} title="Add New Integration" onClose={()=>setSN(false)} width={540}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Input label="Integration Name" value="" onChange={()=>{}} required sx={{gridColumn:'1/-1'}} placeholder="e.g. ServiceNow Import"/>
        <Sel label="Type" value="Import" onChange={()=>{}} opts={['Import','Export','Sync','Bidirectional','Webhook','API','Email'].map(v=>({v,l:v}))}/>
        <Sel label="Category" value="ITSM" onChange={()=>{}} opts={Object.keys(catColors).map(c=>({v:c,l:c}))}/>
        <Input label="Endpoint URL" value="" onChange={()=>{}} placeholder="https://…" sx={{gridColumn:'1/-1'}}/>
        <Sel label="Auth Type" value="API Key" onChange={()=>{}} opts={['API Key','OAuth2','JWT Bearer','Basic Auth','Webhook URL','Kerberos','IAM Role','Token','NTLM'].map(v=>({v,l:v}))}/>
        <Input label="API Key / Token" type="password" value="" onChange={()=>{}} placeholder="Enter credentials…"/>
        <Input label="Description" value="" onChange={()=>{}} sx={{gridColumn:'1/-1'}} placeholder="What does this integration do?…"/>
        <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end',gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
          <Btn variant="outline" onClick={()=>setSN(false)}>Cancel</Btn>
          <Btn onClick={()=>{addToast('success','Integration configured — test connection to verify');setSN(false);}}>Save Integration</Btn>
        </div>
      </div>
    </Modal>
  </div>;
};

// ── MODULE SHELL ──────────────────────────────────
const Shell=({module})=>{
  const M={incidents:{t:'Incident Management',icon:'🚨',color:C.danger,pt:'Part 3 ✓'},service_req:{t:'Service Requests',icon:'📋',color:C.success,pt:'Part 3 ✓'},imac:{t:'IMAC',icon:'🔄',color:C.primary,pt:'Part 2 ✓'},problems:{t:'Problem Management',icon:'🔍',color:C.warning,pt:'Part 4 ✓'},changes:{t:'Change Management',icon:'🔧',color:C.purple,pt:'Part 4 ✓'},cmdb:{t:'Asset & CMDB',icon:'🖥️',color:C.cyan,pt:'Part 5 ✓'},knowledge:{t:'Knowledge Base',icon:'📚',color:C.emerald,pt:'Part 6 ✓'},sla:{t:'SLA & Escalation',icon:'⏱️',color:C.warning,pt:'Part 6 ✓'},employees:{t:'Employee Mgmt',icon:'👥',color:C.primary,pt:'Part 2 ✓'},users:{t:'User Mgmt',icon:'🔐',color:C.primary,pt:'Part 1 ✓'}};
  const c=M[module]||{t:module,icon:'📋',color:C.primary,pt:'✓'};
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'calc(100vh - 110px)'}}>
    <div style={{textAlign:'center',maxWidth:400}}>
      <div style={{width:64,height:64,borderRadius:16,background:`${c.color}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,margin:'0 auto 14px'}}>{c.icon}</div>
      <h2 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 6px'}}>{c.t}</h2>
      <div style={{background:`${c.color}0D`,border:`1px dashed ${c.color}60`,borderRadius:8,padding:'10px 14px',display:'inline-flex',alignItems:'center',gap:8}}>
        <span>✅</span><div><div style={{fontSize:10,fontWeight:800,color:c.color}}>{c.pt}</div><div style={{fontSize:10,color:C.t2}}>Module built and complete</div></div>
      </div>
    </div>
  </div>;
};

// ── LOGIN ──────────────────────────────────────────
const Login=({onLogin})=>{
  const[email,setEmail]=useState('');const[pw,setPw]=useState('');const[loading,setL]=useState(false);const[err,setErr]=useState('');const[sel,setSel]=useState(null);
  const DEMOS=[{r:'SUPER_ADMIN',e:'superadmin@itsm.com',p:'Admin@123'},{r:'ADMIN',e:'admin@itsm.com',p:'Admin@123'},{r:'EMPLOYEE',e:'employee@company.com',p:'Employee@123'},{r:'HELPDESK',e:'helpdesk@company.com',p:'Helpdesk@123'},{r:'AGENT',e:'agent@company.com',p:'Agent@123'},{r:'SERVICE_MANAGER',e:'manager@company.com',p:'Manager@123'}];
  const fill=d=>{setEmail(d.e);setPw(d.p);setSel(d.r);setErr('');};
  const sub=e=>{e.preventDefault();if(!email||!pw){setErr('Enter credentials');return;}setL(true);setTimeout(()=>{const u=USERS.find(x=>x.email===email&&x.pw===pw);if(!u){setErr('Invalid credentials');setL(false);return;}onLogin(u);},600);};
  return <div style={{minHeight:'100vh',display:'flex',background:C.bg}}>
    <div style={{width:'42%',background:'linear-gradient(150deg,#0D1B2A,#1E0040 50%,#2D0060)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:40,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-80,left:-80,width:320,height:320,borderRadius:'50%',background:'rgba(124,58,237,0.08)'}}/>
      <div style={{position:'absolute',bottom:-60,right:-60,width:280,height:280,borderRadius:'50%',background:'rgba(79,70,229,0.08)'}}/>
      <div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:36,height:36,borderRadius:8,background:'linear-gradient(135deg,#7C3AED,#4F46E5)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>⚡</div><div><div style={{fontSize:17,fontWeight:800,color:'#fff'}}>ITSM<span style={{color:'#A78BFA'}}>Pro</span></div><div style={{fontSize:8,color:'#5B21B6',letterSpacing:'0.1em',textTransform:'uppercase'}}>Enterprise Service Mgmt</div></div></div></div>
      <div>
        <div style={{fontSize:10,fontWeight:800,color:'#A78BFA',letterSpacing:'0.12em',marginBottom:8}}>🎉 ALL 7 PARTS COMPLETE</div>
        <h1 style={{fontSize:26,fontWeight:800,color:'#fff',margin:'0 0 10px',lineHeight:1.2}}>Reports, Analytics<br/><span style={{color:'#A78BFA'}}>&amp; Integration Framework</span></h1>
        {['Executive Dashboard with Gauges','Bar, Line & Donut SVG Charts','Incident Volume & Priority Reports','Agent Performance Leaderboard','SLA Compliance Trend Charts','Asset Inventory Reports','Custom Report Builder','8 Report Templates + Export (CSV)','12 Integration Connectors','REST API Documentation','Webhook Event System','Live Integration Test & Toggle'].map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}><div style={{width:14,height:14,borderRadius:'50%',background:'rgba(167,139,250,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><div style={{width:5,height:5,borderRadius:'50%',background:'#A78BFA'}}/></div><span style={{fontSize:11,color:'#94A3B8'}}>{f}</span></div>)}
      </div>
      <div style={{display:'flex',gap:20,borderTop:'1px solid rgba(255,255,255,0.07)',paddingTop:16}}>{[['7','Parts Built'],['12','Integrations'],['247','Incidents']].map(([v,l])=><div key={l}><div style={{fontSize:16,fontWeight:800,color:'#fff'}}>{v}</div><div style={{fontSize:10,color:'#5B21B6'}}>{l}</div></div>)}</div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 50px'}}>
      <div style={{width:'100%',maxWidth:380}}>
        <h2 style={{fontSize:22,fontWeight:800,color:C.t1,margin:'0 0 4px'}}>Sign In</h2>
        <p style={{fontSize:12,color:C.t2,margin:'0 0 6px'}}>ITSM Pro — Part 7 (Final)</p>
        <div style={{background:'linear-gradient(135deg,#F5F3FF,#EEF2FF)',border:`1px solid #DDD6FE`,borderRadius:8,padding:'10px 14px',marginBottom:14,fontSize:11,color:C.purple,fontWeight:600}}>
          🎊 ITSM Pro — All 7 parts complete! Full enterprise ITSM platform.
        </div>
        <div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:18}}>
          <p style={{fontSize:9,fontWeight:800,color:C.t3,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 7px'}}>Quick Login</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {DEMOS.map(d=>{const m=ROLE_META[d.r];const a=sel===d.r;return <button key={d.r} onClick={()=>fill(d)} style={{padding:'3px 8px',borderRadius:20,fontSize:10,fontWeight:700,border:`1px solid ${a?m.color:m.border}`,background:a?m.bg:'#fff',color:a?m.color:C.t2,cursor:'pointer'}}>{m.label}</button>;})}
          </div>
        </div>
        <form onSubmit={sub} style={{display:'flex',flexDirection:'column',gap:11}}>
          <Input label="Email" type="email" value={email} onChange={setEmail} required placeholder="you@company.com"/>
          <Input label="Password" type="password" value={pw} onChange={setPw} required placeholder="Password"/>
          {err&&<div style={{padding:'8px 11px',background:C.dangerLt,border:`1px solid #FECACA`,borderRadius:6,fontSize:12,color:C.danger}}>⚠ {err}</div>}
          <Btn type="submit" size="lg" disabled={loading} sx={{width:'100%',justifyContent:'center',marginTop:3}}>{loading?'Signing in…':'Sign In →'}</Btn>
        </form>
      </div>
    </div>
  </div>;
};

// ── MAIN APP ──────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[active,setActive]=useState('dashboard');
  const[col,setCol]=useState(false);
  const[toasts,setToasts]=useState([]);
  const[integrations,setIntegrations]=useState(INTEGRATIONS);
  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);};
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome, ${u.name}! 🎉 All 7 parts now live.`);};
  const logout=()=>{setUser(null);setActive('dashboard');};
  if(!user)return <Login onLogin={login}/>;
  const sw=col?56:228;
  const render=()=>{
    if(active==='dashboard')return <ReportsModule me={user} addToast={addToast}/>;
    if(active==='reports')return <ReportsModule me={user} addToast={addToast}/>;
    if(active==='integrations')return <IntegrationsModule me={user} integrations={integrations} setIntegrations={setIntegrations} addToast={addToast}/>;
    return <Shell module={active}/>;
  };
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <Sidebar user={user} active={active} onNav={m=>setActive(m)} col={col} setCol={setCol}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <Header user={user} active={active} onLogout={logout}/>
      <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <div style={{display:'flex',gap:0,padding:'8px 18px 0',background:'#fff',borderBottom:`1px solid ${C.border}`}}>
          {[['reports','📊 Reports & Analytics'],['integrations','🔌 Integration Framework']].map(([v,l])=>(
            <button key={v} onClick={()=>setActive(v)} style={{padding:'6px 14px',border:'none',borderBottom:`2px solid ${active===v?C.purple:'transparent'}`,background:'transparent',color:active===v?C.purple:C.t2,fontSize:12,fontWeight:active===v?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>{l}</button>
          ))}
        </div>
        <div style={{flex:1,overflow:'hidden'}}>{render()}</div>
      </main>
    </div>
    <Toast toasts={toasts} rem={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
