const ProblemModule=({me,problems,setProblems,addToast})=>{
  const[tab,setTab]=useState('list');
  const[selected,setSelected]=useState(null);
  const[showNew,setSN]=useState(false);
  const[search,setSearch]=useState('');
  const[fStatus,setFS]=useState('');
  const[fImpact,setFI]=useState('');
  const[showRCA,setSRCA]=useState(false);
  const[rcaData,setRCAData]=useState({rootCause:'',workaround:'',fixPlan:'',knownError:false});
  const[noteText,setNT]=useState('');

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return problems.filter(p=>(!q||p.id.toLowerCase().includes(q)||p.title.toLowerCase().includes(q))&&(!fStatus||p.status===fStatus)&&(!fImpact||p.impact===fImpact)).sort((a,b)=>b.id.localeCompare(a.id));
  },[problems,search,fStatus,fImpact]);

  const kedbItems=problems.filter(p=>p.knownError);

  const updateProb=(p)=>{setProblems(prev=>prev.map(x=>x.id===p.id?p:x));setSelected(p);addToast('success',`${p.id} updated`);};

  const canEdit=['AGENT','HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);

  const NewProbForm=()=>{
    const[f,setF]=useState({title:'',desc:'',category:PROB_CATS[0],impact:'High',owner:me.id});
    const[errs,setErrs]=useState({});
    const ff=k=>v=>setF(p=>({...p,[k]:v}));
    const submit=()=>{
      const e={};if(!f.title.trim())e.title='Required';if(!f.desc.trim())e.desc='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      const np={id:genId('PRB'),title:f.title,desc:f.desc,category:f.category,impact:f.impact,status:'Open',owner:f.owner,team:'IT',created:now(),updated:now(),linkedIncidents:[],rootCause:'',workaround:'',knownError:false,kedbId:'',fixPlan:'',timeline:[{action:'Problem Opened',by:me.id,at:now(),note:'New problem record created'}]};
      setProblems(p=>[np,...p]);addToast('success',`${np.id} created`);setSN(false);
    };
    return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <Input label="Problem Title" value={f.title} onChange={ff('title')} required error={errs.title} sx={{gridColumn:'1/-1'}} placeholder="Brief description of the problem pattern…"/>
      <Textarea label="Description" value={f.desc} onChange={ff('desc')} required rows={3} sx={{gridColumn:'1/-1'}} placeholder="Describe the recurring issue, affected users, incidents linked…"/>
      <Sel label="Category" value={f.category} onChange={ff('category')} opts={PROB_CATS.map(c=>({v:c,l:c}))} required/>
      <Sel label="Impact" value={f.impact} onChange={ff('impact')} opts={PROB_IMPACT.map(x=>({v:x,l:x}))} required/>
      <Sel label="Assign Owner" value={f.owner} onChange={ff('owner')} opts={USERS.filter(u=>['AGENT','HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(u.role)).map(u=>({v:u.id,l:u.name}))} sx={{gridColumn:'1/-1'}}/>
      <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end',gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSN(false)}>Cancel</Btn>
        <Btn onClick={submit}>🔍 Create Problem Record</Btn>
      </div>
    </div>;
  };

  const ProbDetail=({p})=>{
    const[showRCAForm,setSRF]=useState(false);
    const[rcaF,setRCAF]=useState({rootCause:p.rootCause||'',workaround:p.workaround||'',fixPlan:p.fixPlan||'',knownError:p.knownError||false});
    const owner=USERS.find(u=>u.id===p.owner);

    const saveRCA=()=>{
      const kedbId=rcaF.knownError&&!p.kedbId?`KEDB-${String(problems.length+1).padStart(5,'0')}`:p.kedbId;
      const newStatus=rcaF.knownError?'Known Error':rcaF.rootCause?'Root Cause Identified':p.status;
      const upd={...p,...rcaF,kedbId,status:newStatus,updated:now(),timeline:[...p.timeline,{action:`RCA Updated${rcaF.knownError?' — KEDB Entry Created':''}`,by:me.id,at:now(),note:rcaF.knownError?`KEDB ID: ${kedbId}`:'Root cause documented'}]};
      updateProb(upd);setSRF(false);
    };

    const setStatus=(ns)=>{
      const upd={...p,status:ns,updated:now(),timeline:[...p.timeline,{action:`Status: ${ns}`,by:me.id,at:now(),note:`Changed by ${USERS.find(u=>u.id===me.id)?.name}`}]};
      if(ns==='Resolved')upd.resolved=now();
      updateProb(upd);
    };

    const addNote=()=>{
      if(!noteText.trim())return;
      const upd={...p,updated:now(),timeline:[...p.timeline,{action:'Note Added',by:me.id,at:now(),note:noteText}]};
      updateProb(upd);setNT('');
    };

    const impactColors={Critical:C.danger,High:C.orange,Medium:C.warning,Low:C.success};

    return <div style={{padding:16,overflowY:'auto',flex:1}}>
      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:10}}>
        <ImpactBadge impact={p.impact}/><StatusBadge status={p.status}/>
        {p.knownError&&<Tag label={`📖 ${p.kedbId}`} color={C.purple} bg={C.purpleLt}/>}
        <Tag label={p.category} color={C.t2} bg='#F1F5F9'/>
      </div>
      <h3 style={{fontSize:15,fontWeight:800,color:C.t1,margin:'0 0 8px',lineHeight:1.3}}>{p.title}</h3>

      {canEdit&&<div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
        {!['Resolved','Closed'].includes(p.status)&&<Btn size="sm" variant="outline" icon="🔬" onClick={()=>setSRF(!showRCAForm)}>RCA / KEDB</Btn>}
        {['Open','Under Investigation'].includes(p.status)&&<Btn size="sm" variant="outline" onClick={()=>setStatus('Under Investigation')}>→ Investigating</Btn>}
        {['Root Cause Identified','Known Error','Fix In Progress'].includes(p.status)&&<Btn size="sm" variant="success" onClick={()=>setStatus('Resolved')}>✓ Mark Resolved</Btn>}
        {p.status==='Resolved'&&<Btn size="sm" variant="outline" onClick={()=>setStatus('Closed')}>Close Problem</Btn>}
      </div>}

      {showRCAForm&&<div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:10}}>🔬 Root Cause Analysis</div>
        <div style={{display:'flex',flexDirection:'column',gap:9}}>
          <Textarea label="Root Cause" value={rcaF.rootCause} onChange={v=>setRCAF(f=>({...f,rootCause:v}))} rows={2} placeholder="What is the underlying root cause?…"/>
          <Textarea label="Workaround" value={rcaF.workaround} onChange={v=>setRCAF(f=>({...f,workaround:v}))} rows={2} placeholder="Steps users / helpdesk can take to work around the issue…"/>
          <Textarea label="Fix Plan" value={rcaF.fixPlan} onChange={v=>setRCAF(f=>({...f,fixPlan:v}))} rows={2} placeholder="Permanent fix plan and timeline…"/>
          <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:C.t1,cursor:'pointer'}}>
            <input type="checkbox" checked={rcaF.knownError} onChange={e=>setRCAF(f=>({...f,knownError:e.target.checked}))}/>
            <span>Publish to Known Error Database (KEDB){!p.kedbId&&rcaF.knownError&&<span style={{color:C.purple,fontWeight:700}}> — New KEDB ID will be assigned</span>}</span>
          </label>
        </div>
        <div style={{display:'flex',gap:7,marginTop:10}}><Btn size="sm" onClick={saveRCA}>Save RCA</Btn><Btn size="sm" variant="outline" onClick={()=>setSRF(false)}>Cancel</Btn></div>
      </div>}

      {/* RCA display */}
      {(p.rootCause||p.workaround||p.fixPlan)&&<div style={{marginBottom:12}}>
        {[['🎯 Root Cause',p.rootCause,C.danger],[' Workaround',p.workaround,C.orange],['🔧 Fix Plan',p.fixPlan,C.primary]].filter(([,v])=>v).map(([k,v,col])=>(
          <div key={k} style={{marginBottom:8,background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:6,padding:'9px 11px',borderLeft:`3px solid ${col}`}}>
            <div style={{fontSize:9,color:col,fontWeight:800,textTransform:'uppercase',marginBottom:3}}>{k}</div>
            <div style={{fontSize:12,color:C.t1,lineHeight:1.6}}>{v}</div>
          </div>
        ))}
      </div>}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:12}}>
        {[['Owner',owner?.name||'—'],['Team',p.team||'—'],['Category',p.category],['Created',p.created],['Linked Incidents',p.linkedIncidents?.join(', ')||'None']].map(([k,v])=>(
          <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'6px 9px',gridColumn:k==='Linked Incidents'?'1/-1':undefined}}>
            <div style={{fontSize:9,color:C.t3,marginBottom:2,textTransform:'uppercase'}}>{k}</div>
            <div style={{fontSize:11,fontWeight:600,color:C.t1}}>{v}</div>
          </div>
        ))}
      </div>

      <div style={{background:'#F8FAFC',borderRadius:6,padding:'9px 11px',marginBottom:12}}>
        <div style={{fontSize:9,color:C.t3,marginBottom:3,textTransform:'uppercase'}}>Description</div>
        <div style={{fontSize:12,color:C.t1,lineHeight:1.6}}>{p.desc}</div>
      </div>

      {/* Timeline */}
      <div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>Timeline</div>
        {[...p.timeline].reverse().map((t,i)=>{
          const actor=USERS.find(u=>u.id===t.by);
          return <div key={i} style={{display:'flex',gap:8,marginBottom:7,paddingBottom:7,borderBottom:`1px solid ${C.borderFaint}`}}>
            <Avatar name={actor?.name||'System'} size={22}/>
            <div style={{flex:1}}><div style={{display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}}><span style={{fontSize:10,fontWeight:700,color:C.t1}}>{actor?.name||'System'}</span><span style={{fontSize:9,color:C.t3}}>{t.at}</span></div>
              <div style={{fontSize:10,color:C.purple,fontWeight:700}}>{t.action}</div>
              {t.note&&<div style={{fontSize:10,color:C.t2,marginTop:1}}>{t.note}</div>}
            </div>
          </div>;})}
      </div>

      {canEdit&&!['Closed'].includes(p.status)&&<div style={{display:'flex',gap:7,alignItems:'flex-end'}}>
        <div style={{flex:1}}><Textarea value={noteText} onChange={setNT} rows={2} placeholder="Add update or note…"/></div>
        <Btn size="sm" onClick={addNote} disabled={!noteText.trim()}>Add</Btn>
      </div>}
    </div>;
  };

  return <div style={{display:'flex',height:'calc(100vh - 50px)'}}>
    {/* Left panel */}
    <div style={{flex:1,overflowY:'auto',padding:'16px 18px',borderRight:selected?`1px solid ${C.border}`:'none',minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Problem Management</h2><p style={{fontSize:10,color:C.t2,margin:0}}>{problems.length} records · {kedbItems.length} KEDB entries</p></div>
        {canEdit&&<Btn icon="+" onClick={()=>setSN(true)}>New Problem</Btn>}
      </div>

      <div style={{display:'flex',gap:0,marginBottom:10,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:3,width:'fit-content'}}>
        {[['list','📋 Problems'],['kedb','📖 KEDB']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:'5px 12px',borderRadius:5,border:'none',background:tab===v?C.purple:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer'}}>{l}{v==='kedb'?<span style={{marginLeft:5,background:tab==='kedb'?'rgba(255,255,255,0.3)':C.purpleLt,color:tab==='kedb'?'#fff':C.purple,borderRadius:10,fontSize:9,padding:'1px 5px',fontWeight:800}}>{kedbItems.length}</span>:''}</button>)}
      </div>

      {tab==='kedb'&&<div>
        <div style={{background:C.purpleLt,border:`1px solid #DDD6FE`,borderRadius:8,padding:'10px 14px',marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:800,color:C.purple,marginBottom:2}}>📖 Known Error Database (KEDB)</div>
          <div style={{fontSize:11,color:C.t2}}>Published workarounds for known issues. Visible to all helpdesk and agents.</div>
        </div>
        {kedbItems.length===0?<div style={{padding:40,textAlign:'center',color:C.t3}}>No KEDB entries yet</div>:kedbItems.map(p=>(
          <div key={p.id} onClick={()=>setSelected(p)} style={{background:C.card,borderRadius:8,border:`1px solid ${selected?.id===p.id?C.purple:C.border}`,padding:'11px 14px',marginBottom:8,cursor:'pointer',transition:'all .15s',borderLeft:`4px solid ${C.purple}`}} onMouseEnter={e=>e.currentTarget.style.boxShadow='0 2px 8px rgba(124,58,237,0.1)'} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
            <div style={{display:'flex',gap:6,marginBottom:5,flexWrap:'wrap',alignItems:'center'}}>
              <Tag label={p.kedbId} color={C.purple} bg={C.purpleLt}/>
              <ImpactBadge impact={p.impact}/>
              <Tag label={p.category} color={C.t2} bg='#F1F5F9'/>
            </div>
            <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:4}}>{p.title}</div>
            {p.workaround&&<div style={{fontSize:11,color:C.t2,background:C.purpleLt,padding:'6px 9px',borderRadius:5,marginTop:4}}>
              <span style={{fontWeight:700,color:C.purple}}>Workaround: </span>{p.workaround}
            </div>}
          </div>
        ))}
      </div>}

      {tab==='list'&&<>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:9,marginBottom:10,display:'flex',gap:7,flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:160}}><Input placeholder="Search problems…" value={search} onChange={v=>setSearch(v)}/></div>
          <Sel value={fStatus} onChange={setFS} opts={[{v:'',l:'All Status'},...PROB_STATUS.map(s=>({v:s,l:s}))]} sx={{minWidth:160}}/>
          <Sel value={fImpact} onChange={setFI} opts={[{v:'',l:'All Impact'},...PROB_IMPACT.map(s=>({v:s,l:s}))]} sx={{minWidth:120}}/>
          {(search||fStatus||fImpact)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFS('');setFI('');}}>Clear ×</Btn>}
        </div>
        {filtered.length===0&&<div style={{padding:40,textAlign:'center',color:C.t3,background:C.card,borderRadius:8,border:`1px solid ${C.border}`}}>No problems found</div>}
        {filtered.map(p=>{
          const owner=USERS.find(u=>u.id===p.owner);
          const isV=selected?.id===p.id;
          const impactColor={Critical:C.danger,High:C.orange,Medium:C.warning,Low:C.success}[p.impact]||C.t3;
          return <div key={p.id} onClick={()=>setSelected(isV?null:p)} style={{background:C.card,borderRadius:8,border:`1px solid ${isV?C.purple:C.border}`,padding:'11px 14px',marginBottom:7,cursor:'pointer',transition:'all .15s',borderLeft:`4px solid ${impactColor}`}} onMouseEnter={e=>{if(!isV)e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)';}} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4,alignItems:'center'}}>
                  <span style={{fontFamily:'monospace',fontSize:10,color:C.purple,fontWeight:800}}>{p.id}</span>
                  <ImpactBadge impact={p.impact}/>
                  <StatusBadge status={p.status}/>
                  {p.knownError&&<Tag label={`📖 ${p.kedbId}`} color={C.purple} bg={C.purpleLt}/>}
                </div>
                <div style={{fontSize:13,fontWeight:700,color:C.t1,marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title}</div>
                <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:C.t2}}>{p.category}</span>
                  <span style={{fontSize:10,color:C.t3}}>{p.linkedIncidents?.length||0} linked incidents</span>
                  <span style={{fontSize:10,color:C.t3}}>{p.updated}</span>
                </div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                {owner&&<div style={{display:'flex',alignItems:'center',gap:5,justifyContent:'flex-end'}}><Avatar name={owner.name} size={20}/><span style={{fontSize:10,color:C.t2}}>{owner.name.split(' ')[0]}</span></div>}
              </div>
            </div>
          </div>;})}
      </>}
    </div>

    {/* Detail panel */}
    {selected&&<div style={{width:460,flexShrink:0,background:C.card,display:'flex',flexDirection:'column',animation:'slideIn .2s ease'}}>
      <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <span style={{fontSize:12,fontWeight:800,color:C.t1}}>{selected.id}</span>
        <button onClick={()=>setSelected(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:C.t3}}>×</button>
      </div>
      <div style={{flex:1,overflowY:'auto'}}><ProbDetail p={selected}/></div>
    </div>}

    <Modal open={showNew} title="Create Problem Record" onClose={()=>setSN(false)} width={560}><NewProbForm/></Modal>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// CHANGE MANAGEMENT MODULE
// ══════════════════════════════════════════════════════════════
const ChangeModule=({me,changes,setChanges,problems,addToast})=>{
  const[tab,setTab]=useState('list');
  const[selected,setSelected]=useState(null);
  const[showNew,setSN]=useState(false);
  const[search,setSearch]=useState('');
  const[fStatus,setFS]=useState('');
  const[fType,setFT]=useState('');
  const[cabComment,setCABComment]=useState('');
  const[showCABVote,setSCAB]=useState(false);
  const[implementNote,setIN]=useState('');

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return changes.filter(c=>(!q||c.id.toLowerCase().includes(q)||c.title.toLowerCase().includes(q))&&(!fStatus||c.status===fStatus)&&(!fType||c.type===fType)).sort((a,b)=>b.id.localeCompare(a.id));
  },[changes,search,fStatus,fType]);

  const cabPending=changes.filter(c=>c.status==='CAB Review');
  const isCabMember=CAB_ROLES.includes(me.role);
  const canCreate=['AGENT','HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);

  const updateChange=(c)=>{setChanges(prev=>prev.map(x=>x.id===c.id?c:x));setSelected(c);addToast('success',`${c.id} updated`);};

  const submitCABVote=(chg,vote)=>{
    if(!cabComment.trim()&&vote==='Reject'){addToast('error','Rejection reason required');return;}
    const votes=[...(chg.cabVotes||[]),{voter:me.id,vote,comment:cabComment,at:now()}];
    const approvals=votes.filter(v=>v.vote==='Approve').length;
    const rejections=votes.filter(v=>v.vote==='Reject').length;
    const totalCAB=USERS.filter(u=>CAB_ROLES.includes(u.role)).length;
    let newStatus=chg.status;
    let histNote=`${vote} by ${me.name}. ${cabComment}`;
    if(rejections>0){newStatus='Cancelled';histNote='CAB Rejected — Change cancelled.';}
    else if(approvals>=Math.ceil(totalCAB/2)){newStatus='CAB Approved';histNote=`CAB Approved — ${approvals} votes in favour.`;}
    const upd={...chg,cabVotes:votes,status:newStatus,updated:now(),timeline:[...chg.timeline,{action:`CAB Vote: ${vote}`,by:me.id,at:now(),note:histNote}]};
    updateChange(upd);setCABComment('');setSCAB(false);
    addToast(vote==='Approve'?'success':'warning',`CAB ${vote}: ${chg.id}`);
  };

  const NewChangeForm=()=>{
    const[f,setF]=useState({type:'Normal',title:'',desc:'',category:CHG_CATS[0],risk:'Medium',impact:'Moderate',scheduledStart:'',scheduledEnd:'',rollbackPlan:'',testPlan:'',impactedSystems:'',justification:'',linkedProblems:''});
    const[errs,setErrs]=useState({});
    const ff=k=>v=>setF(p=>({...p,[k]:v}));
    const chgType=CHG_TYPES[f.type]||CHG_TYPES.Normal;
    const submit=()=>{
      const e={};if(!f.title.trim())e.title='Required';if(!f.desc.trim())e.desc='Required';if(!f.rollbackPlan.trim())e.rollbackPlan='Rollback plan is required for all changes';if(!f.testPlan.trim())e.testPlan='Test plan is required';
      if(Object.keys(e).length){setErrs(e);return;}
      const initStatus=f.type==='Standard'?'Scheduled':f.type==='Emergency'?'In Progress':'Submitted';
      const nc={id:genId('CHG'),type:f.type,title:f.title,desc:f.desc,category:f.category,risk:f.risk,impact:f.impact,status:initStatus,reqBy:me.id,owner:me.id,team:'IT',created:now(),updated:now(),scheduledStart:f.scheduledStart||'TBD',scheduledEnd:f.scheduledEnd||'TBD',rollbackPlan:f.rollbackPlan,testPlan:f.testPlan,impactedSystems:f.impactedSystems.split(',').map(s=>s.trim()).filter(Boolean),justification:f.justification,cabVotes:[],linkedProblems:f.linkedProblems?[f.linkedProblems]:[],
        timeline:[{action:'Change Record Created',by:me.id,at:now(),note:`${chgType.label} — ${initStatus}`}]};
      setChanges(p=>[nc,...p]);addToast('success',`${nc.id} created — ${initStatus}`);setSN(false);
    };
    return <div style={{display:'flex',flexDirection:'column',gap:0}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7,marginBottom:12}}>
        {Object.entries(CHG_TYPES).map(([k,v])=><div onClick={()=>ff('type')(k)} style={{padding:'10px 12px',borderRadius:8,border:`2px solid ${f.type===k?v.color:C.border}`,background:f.type===k?v.bg:'#fff',cursor:'pointer',transition:'all .15s'}}>
          <div style={{fontSize:18,marginBottom:4}}>{v.icon}</div>
          <div style={{fontSize:11,fontWeight:700,color:f.type===k?v.color:C.t1}}>{k}</div>
          <div style={{fontSize:9,color:C.t2,marginTop:2}}>{v.desc}</div>
          {v.cab&&<div style={{fontSize:9,color:C.warning,marginTop:3,fontWeight:700}}>Requires CAB</div>}
        </div>)}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Input label="Change Title" value={f.title} onChange={ff('title')} required error={errs.title} sx={{gridColumn:'1/-1'}}/>
        <Textarea label="Description" value={f.desc} onChange={ff('desc')} required rows={2} sx={{gridColumn:'1/-1'}} error={errs.desc}/>
        <Sel label="Category" value={f.category} onChange={ff('category')} opts={CHG_CATS.map(c=>({v:c,l:c}))} required/>
        <Sel label="Risk Level" value={f.risk} onChange={ff('risk')} opts={RISK_LEVELS.map(r=>({v:r,l:r}))} required/>
        <Sel label="Business Impact" value={f.impact} onChange={ff('impact')} opts={CHG_IMPACT.map(i=>({v:i,l:i}))} required/>
        <Input label="Impacted Systems (comma-separated)" value={f.impactedSystems} onChange={ff('impactedSystems')} placeholder="Server-01, App-02…" sx={{gridColumn:'1/-1'}}/>
        <Input label="Scheduled Start" type="datetime-local" value={f.scheduledStart} onChange={ff('scheduledStart')}/>
        <Input label="Scheduled End" type="datetime-local" value={f.scheduledEnd} onChange={ff('scheduledEnd')}/>
        <Textarea label="Business Justification" value={f.justification} onChange={ff('justification')} rows={2} sx={{gridColumn:'1/-1'}}/>
        <Textarea label="Rollback Plan ★ Required" value={f.rollbackPlan} onChange={ff('rollbackPlan')} required rows={2} sx={{gridColumn:'1/-1'}} error={errs.rollbackPlan}/>
        <Textarea label="Test Plan ★ Required" value={f.testPlan} onChange={ff('testPlan')} required rows={2} sx={{gridColumn:'1/-1'}} error={errs.testPlan}/>
        <Sel label="Link to Problem" value={f.linkedProblems} onChange={ff('linkedProblems')} opts={[{v:'',l:'— None —'},...problems.map(p=>({v:p.id,l:`${p.id}: ${p.title.substring(0,40)}`}))]} sx={{gridColumn:'1/-1'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:14,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSN(false)}>Cancel</Btn>
        <Btn onClick={submit}>{CHG_TYPES[f.type]?.icon} Submit {f.type} Change</Btn>
      </div>
    </div>;
  };

  const ChangeDetail=({chg})=>{
    const[showImpl,setSI]=useState(false);
    const reqUser=USERS.find(u=>u.id===chg.reqBy);
    const owner=USERS.find(u=>u.id===chg.owner);
    const chgType=CHG_TYPES[chg.type]||CHG_TYPES.Normal;
    const myVote=(chg.cabVotes||[]).find(v=>v.voter===me.id);
    const canVote=isCabMember&&chg.status==='CAB Review'&&!myVote;
    const canImplement=['SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role)||chg.owner===me.id;
    const approvals=(chg.cabVotes||[]).filter(v=>v.vote==='Approve').length;
    const totalCAB=USERS.filter(u=>CAB_ROLES.includes(u.role)).length;

    const doAction=(action,ns,note)=>{
      updateChange({...chg,status:ns,updated:now(),timeline:[...chg.timeline,{action,by:me.id,at:now(),note:note||action}]});
    };

    const submitForCAB=()=>doAction('Submitted for CAB Review','CAB Review','Change submitted for CAB voting');
    const startImpl=()=>{setIN('');setSI(true);};
    const confirmStart=()=>{doAction('Implementation Started','In Progress',implementNote||'Implementation started');setSI(false);setIN('');};
    const markComplete=()=>doAction('Change Completed','Completed','Change implemented successfully');
    const markFailed=()=>doAction('Change Failed — Rollback Initiated','Failed','Implementation failed. Rollback executed.');
    const rollback=()=>doAction('Rolled Back','Rolled Back','Change rolled back to previous state');

    return <div style={{padding:16,overflowY:'auto',flex:1}}>
      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:8}}>
        <TypeBadge type={chg.type}/>
        <StatusBadge status={chg.status} module="chg"/>
        <ImpactBadge impact={chg.risk}/>
        <Tag label={chg.category} color={C.t2} bg='#F1F5F9'/>
      </div>
      <h3 style={{fontSize:14,fontWeight:800,color:C.t1,margin:'0 0 10px',lineHeight:1.3}}>{chg.title}</h3>

      {/* Actions */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
        {chg.status==='Draft'&&canImplement&&<Btn size="sm" variant="primary" onClick={submitForCAB}>📤 Submit for CAB</Btn>}
        {canVote&&<Btn size="sm" variant="warning" onClick={()=>setSCAB(!showCABVote)}>🗳 Cast CAB Vote</Btn>}
        {chg.status==='CAB Approved'&&canImplement&&<Btn size="sm" variant="primary" onClick={startImpl}>▶ Start Implementation</Btn>}
        {chg.status==='Scheduled'&&canImplement&&<Btn size="sm" variant="primary" onClick={startImpl}>▶ Start Implementation</Btn>}
        {chg.status==='In Progress'&&canImplement&&<>
          <Btn size="sm" variant="success" onClick={markComplete}>✓ Mark Completed</Btn>
          <Btn size="sm" variant="danger" onClick={markFailed}>✗ Mark Failed</Btn>
        </>}
        {chg.status==='Failed'&&canImplement&&<Btn size="sm" variant="warning" onClick={rollback}>↩ Rollback</Btn>}
      </div>

      {showCABVote&&<div style={{background:C.warningLt,border:'1px solid #FDE68A',borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.warning,marginBottom:7}}>🗳 Cast Your CAB Vote</div>
        <div style={{fontSize:11,color:C.t2,marginBottom:8}}>Current: {approvals}/{totalCAB} approvals. Need {Math.ceil(totalCAB/2)} to pass.</div>
        <Textarea label="Comments / Conditions" value={cabComment} onChange={setCABComment} rows={2} placeholder="Add approval conditions or rejection reason…"/>
        <div style={{display:'flex',gap:7,marginTop:8}}>
          <Btn size="sm" variant="success" onClick={()=>submitCABVote(chg,'Approve')}>✓ Approve</Btn>
          <Btn size="sm" variant="danger" onClick={()=>submitCABVote(chg,'Reject')}>✗ Reject</Btn>
          <Btn size="sm" variant="outline" onClick={()=>setSCAB(false)}>Cancel</Btn>
        </div>
      </div>}

      {showImpl&&<div style={{background:C.primaryLt,border:`1px solid #BFDBFE`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.primary,marginBottom:7}}>▶ Confirm Implementation Start</div>
        <Textarea label="Implementation Notes" value={implementNote} onChange={setIN} rows={2} placeholder="Any pre-change notes, team on standby…"/>
        <div style={{display:'flex',gap:7,marginTop:8}}><Btn size="sm" onClick={confirmStart}>Confirm Start</Btn><Btn size="sm" variant="outline" onClick={()=>setSI(false)}>Cancel</Btn></div>
      </div>}

      {/* CAB votes panel */}
      {chg.type==='Normal'&&<div style={{marginBottom:12,background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:11}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>🗳 CAB Voting ({approvals}/{totalCAB} Approved)</div>
        <div style={{display:'flex',gap:4,marginBottom:8}}>

    <Modal open={showNew} title="Create Change Request" onClose={()=>setSN(false)} width={640}><NewChangeForm/></Modal>
  </div>;
};

// ─── MAIN APP ─────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[problems,setProblems]=useState(SEED_PROBLEMS);
  const[changes,setChanges]=useState(SEED_CHANGES);
  const[active,setActive]=useState('dashboard');
  const[col,setCol]=useState(false);
  const[toasts,setToasts]=useState([]);
  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);};
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome, ${u.name}!`);};
  const logout=()=>{setUser(null);setActive('dashboard');};
  if(!user)return <Login onLogin={login}/>;
  const sw=col?56:228;
  const render=()=>{
    if(active==='dashboard')return <Dashboard user={user} problems={problems} changes={changes}/>;
    if(active==='problems')return <ProblemModule me={user} problems={problems} setProblems={setProblems} addToast={addToast}/>;
    if(active==='changes')return <ChangeModule me={user} changes={changes} setChanges={setChanges} problems={problems} addToast={addToast}/>;
    return <Shell module={active}/>;
  };
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <Sidebar user={user} active={active} onNav={m=>setActive(m)} col={col} setCol={setCol}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <Header user={user} active={active} changes={changes} onLogout={logout}/>
      <main style={{flex:1,overflow:'hidden'}}>{render()}</main>
    </div>
    <Toast toasts={toasts} rem={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
