  const V={primary:{bg:C.primary,bgh:C.primaryH,text:'#fff',bdr:C.primary},danger:{bg:C.danger,bgh:'#B91C1C',text:'#fff',bdr:C.danger},ghost:{bg:'transparent',bgh:C.primaryLt,text:C.primary,bdr:C.border},success:{bg:C.success,bgh:'#047857',text:'#fff',bdr:C.success},warning:{bg:C.warning,bgh:'#B45309',text:'#fff',bdr:C.warning},outline:{bg:'transparent',bgh:'#F8FAFC',text:C.t2,bdr:C.border},purple:{bg:C.purple,bgh:'#6D28D9',text:'#fff',bdr:C.purple}};
  const v=V[variant]||V.primary;
  const sz=size==='sm'?{padding:'4px 10px',fontSize:11}:size==='xs'?{padding:'3px 7px',fontSize:10}:size==='lg'?{padding:'10px 22px',fontSize:14}:{padding:'7px 13px',fontSize:12};
  return <button type={type} disabled={disabled} onMouseEnter={()=>sH(true)} onMouseLeave={()=>sH(false)} onClick={onClick} style={{background:h&&!disabled?v.bgh:v.bg,color:v.text,border:`1px solid ${v.bdr}`,borderRadius:6,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.6:1,fontWeight:600,display:'inline-flex',alignItems:'center',gap:5,transition:'all .15s',...sz,...sx}}>{icon&&<span style={{fontSize:12}}>{icon}</span>}{children}</button>;
};
const Input=({label,value,onChange,type='text',placeholder,required,error,disabled,sx={}})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3,...sx}}>
    {label&&<label style={{fontSize:10,fontWeight:700,color:C.t2,letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>}
    <input type={type} value={value} onChange={e=>onChange?.(e.target.value)} placeholder={placeholder} disabled={disabled}
      style={{padding:'7px 10px',border:`1px solid ${error?C.danger:C.border}`,borderRadius:6,fontSize:12,color:C.t1,background:disabled?'#F8FAFC':'#fff',outline:'none',width:'100%'}}
      onFocus={e=>{if(!error)e.target.style.borderColor=C.primary;}} onBlur={e=>e.target.style.borderColor=error?C.danger:C.border;}/>
    {error&&<span style={{fontSize:10,color:C.danger}}>{error}</span>}
  </div>
);
const Sel=({label,value,onChange,opts,required,sx={}})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3,...sx}}>
    {label&&<label style={{fontSize:10,fontWeight:700,color:C.t2,letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>}
    <select value={value} onChange={e=>onChange?.(e.target.value)} style={{padding:'7px 10px',border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,color:C.t1,background:'#fff',outline:'none',cursor:'pointer',width:'100%',appearance:'none',backgroundImage:"url(\"data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2394A3B8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E\")",backgroundRepeat:'no-repeat',backgroundPosition:'right 10px center',paddingRight:26}}>
      {opts.map(o=><option key={o.v??o} value={o.v??o}>{o.l??o}</option>)}
    </select>
  </div>
);
const Textarea=({label,value,onChange,rows=3,placeholder,required,sx={}})=>(
  <div style={{display:'flex',flexDirection:'column',gap:3,...sx}}>
    {label&&<label style={{fontSize:10,fontWeight:700,color:C.t2,letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>}
    <textarea value={value} onChange={e=>onChange?.(e.target.value)} rows={rows} placeholder={placeholder}
      style={{padding:'7px 10px',border:`1px solid ${C.border}`,borderRadius:6,fontSize:12,color:C.t1,resize:'vertical',outline:'none',width:'100%'}}
      onFocus={e=>e.target.style.borderColor=C.primary} onBlur={e=>e.target.style.borderColor=C.border}/>
  </div>
);
const Modal=({open,title,onClose,children,width=580})=>{
  if(!open)return null;
  return <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div style={{background:'#fff',borderRadius:10,boxShadow:'0 25px 60px rgba(0,0,0,0.25)',width:'100%',maxWidth:width,maxHeight:'92vh',display:'flex',flexDirection:'column',overflow:'hidden',animation:'slideUp .2s ease'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 18px',borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
        <h3 style={{margin:0,fontSize:14,fontWeight:800,color:C.t1}}>{title}</h3>
        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:C.t3,lineHeight:1,padding:'2px 6px'}}>×</button>
      </div>
      <div style={{padding:18,overflowY:'auto',flex:1}}>{children}</div>
    </div>
  </div>;
};
const Toast=({toasts,rem})=>(
  <div style={{position:'fixed',bottom:18,right:18,zIndex:9999,display:'flex',flexDirection:'column',gap:7}}>
    {toasts.map(t=>{const g=t.type==='success'?{bg:'#ECFDF5',bdr:'#A7F3D0',left:C.success,ic:'✓'}:t.type==='error'?{bg:'#FEF2F2',bdr:'#FECACA',left:C.danger,ic:'✗'}:t.type==='warning'?{bg:'#FFFBEB',bdr:'#FDE68A',left:C.warning,ic:'⚠'}:{bg:'#EFF6FF',bdr:'#BFDBFE',left:C.primary,ic:'ℹ'};
    return <div key={t.id} onClick={()=>rem(t.id)} style={{background:g.bg,border:`1px solid ${g.bdr}`,borderLeft:`3px solid ${g.left}`,color:g.left,padding:'9px 13px',borderRadius:6,fontSize:12,fontWeight:600,boxShadow:'0 4px 14px rgba(0,0,0,0.1)',display:'flex',alignItems:'center',gap:9,minWidth:260,maxWidth:340,cursor:'pointer',animation:'slideUp .2s ease'}}>
      <span>{g.ic}</span><span style={{flex:1}}>{t.msg}</span><span style={{opacity:.4}}>×</span>
    </div>;})}
  </div>
);

// DASHBOARD
// ══════════════════════════════════════════════════════════════
const Dashboard=({user,incidents,serviceReqs})=>{
  const myInc=incidents.filter(i=>i.reqBy===user.id);
  const mySR=serviceReqs.filter(s=>s.reqBy===user.id);
  const allOpen=incidents.filter(i=>!['Resolved','Closed','Cancelled'].includes(i.status));
  const pendingAppr=serviceReqs.filter(sr=>sr.status==='Pending Approval'&&(sr.approvals||[]).some(a=>a.approver===user.id&&a.status==='Pending'));
  const byPri=k=>incidents.filter(i=>i.priority===k&&!['Resolved','Closed'].includes(i.status));

  const isEmployee=user.role==='EMPLOYEE';
  const stats=isEmployee?[
    {l:'My Open Incidents',v:myInc.filter(i=>!['Resolved','Closed'].includes(i.status)).length,ic:'🚨',c:C.danger},
    {l:'My Service Requests',v:mySR.length,ic:'📋',c:C.primary},
    {l:'Pending SR Approval',v:mySR.filter(s=>s.status==='Pending Approval').length,ic:'⏳',c:C.warning},
    {l:'Resolved This Month',v:myInc.filter(i=>i.status==='Resolved').length,ic:'✅',c:C.success},
  ]:[
    {l:'Open Incidents',v:allOpen.length,ic:'🚨',c:C.danger},
    {l:'P1 Critical',v:byPri('P1').length,ic:'🔴',c:C.danger},
    {l:'SLA Breached',v:incidents.filter(i=>i.slaBreached).length,ic:'⏱️',c:C.warning},
    {l:'Service Requests',v:serviceReqs.filter(s=>!['Fulfilled','Closed'].includes(s.status)).length,ic:'📋',c:C.primary},
    {l:'Pending Approvals',v:pendingAppr.length,ic:'✅',c:C.warning},
    {l:'My Pending Approvals',v:pendingAppr.length,ic:'📥',c:C.orange},
  ];

  const recentInc=incidents.slice().sort((a,b)=>b.id.localeCompare(a.id)).slice(0,5);
  const catData=INC_CATEGORIES.map(c=>({cat:c,count:incidents.filter(i=>i.category===c&&!['Closed','Resolved'].includes(i.status)).length})).filter(d=>d.count>0).sort((a,b)=>b.count-a.count).slice(0,5);
  const maxCat=Math.max(...catData.map(d=>d.count),1);

  return <div style={{padding:'18px 20px',maxWidth:1200}}>
    <div style={{marginBottom:14}}>
      <h1 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>
        {isEmployee?`My Dashboard — ${user.name.split(' ')[0]}`:`Operations Dashboard`}
      </h1>
      <p style={{fontSize:11,color:C.t2,margin:0}}>{today()} · {ROLE_META[user.role]?.label}</p>
    </div>

    {incidents.some(i=>i.priority==='P1'&&i.status==='In Progress')&&!isEmployee&&<div style={{background:C.dangerLt,border:`1px solid #FECACA`,borderRadius:8,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
      <span style={{fontSize:20,animation:'pulse 1.5s infinite'}}>🔴</span>
      <div><div style={{fontSize:12,fontWeight:800,color:C.danger}}>ACTIVE P1 INCIDENTS</div>
        <div style={{fontSize:11,color:C.t2}}>{incidents.filter(i=>i.priority==='P1'&&!['Resolved','Closed'].includes(i.status)).map(i=>`${i.id}: ${i.title}`).join(' • ')}</div>
      </div>
    </div>}

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(165px,1fr))',gap:10,marginBottom:14}}>
      {stats.map((s,i)=><div key={i} style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:13}}>
        <div style={{width:32,height:32,borderRadius:7,background:`${s.c}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,marginBottom:9}}>{s.ic}</div>
        <div style={{fontSize:22,fontWeight:800,color:s.v>0&&s.c===C.danger?C.danger:C.t1,lineHeight:1}}>{s.v}</div>
        <div style={{fontSize:11,color:C.t2,marginTop:2}}>{s.l}</div>
      </div>)}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 320px',gap:12}}>
      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,fontWeight:800,color:C.t1}}>Recent Incidents</span>
          <span style={{fontSize:11,color:C.t3}}>{incidents.length} total</span>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:560}}>
            <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
              {['ID','Title','Category','Priority','Status','Updated'].map(h=><th key={h} style={{padding:'7px 11px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',letterSpacing:'0.07em',textTransform:'uppercase',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>{recentInc.map(inc=><tr key={inc.id} style={{borderBottom:`1px solid ${C.borderFaint}`,cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.background='#FAFBFF'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <td style={{padding:'8px 11px',fontFamily:'monospace',fontSize:10,color:C.primary,fontWeight:800,whiteSpace:'nowrap'}}>{inc.id}{inc.slaBreached&&<span style={{display:'block',fontSize:8,color:C.danger,fontWeight:800}}>SLA!</span>}</td>
              <td style={{padding:'8px 11px',maxWidth:160}}><div style={{fontSize:11,fontWeight:600,color:C.t1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{inc.title}</div></td>
              <td style={{padding:'8px 11px',fontSize:10,color:C.t2,whiteSpace:'nowrap'}}>{inc.category}</td>
              <td style={{padding:'8px 11px'}}><PriBadge p={inc.priority} mini/></td>
              <td style={{padding:'8px 11px'}}><StatusBadge status={inc.status}/></td>
              <td style={{padding:'8px 11px',fontSize:10,color:C.t3,whiteSpace:'nowrap'}}>{inc.updated}</td>
            </tr>)}</tbody>
          </table>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {!isEmployee&&<div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>Open by Category</div>
          {catData.length===0?<p style={{fontSize:11,color:C.t3}}>No open incidents</p>:catData.map(({cat,count})=><div key={cat} style={{marginBottom:8}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}><span style={{fontSize:10,color:C.t2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:140}}>{cat}</span><span style={{fontSize:10,fontWeight:700,color:C.t1,flexShrink:0}}>{count}</span></div>
            <div style={{height:4,background:'#F1F5F9',borderRadius:2}}><div style={{height:4,borderRadius:2,background:count>=3?C.danger:count>=2?C.warning:C.primary,width:`${(count/maxCat)*100}%`,transition:'width .5s'}}/></div>
          </div>)}
        </div>}
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>Priority Breakdown</div>
          {Object.entries(PRIORITY).map(([k,v])=>{const cnt=incidents.filter(i=>i.priority===k&&!['Resolved','Closed'].includes(i.status)).length;
            return <div key={k} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <span style={{fontSize:12}}>{v.icon}</span>
              <span style={{fontSize:11,color:C.t2,flex:1}}>{v.label}</span>
              <span style={{fontSize:13,fontWeight:800,color:cnt>0?v.color:C.t3}}>{cnt}</span>
            </div>;})}
        </div>
      </div>
    </div>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// INCIDENT DETAIL PANEL
// ══════════════════════════════════════════════════════════════
const IncidentDetail=({inc,users,me,onUpdate,onClose})=>{
  const[noteText,setNoteText]=useState('');
  const[isInternal,setInternal]=useState(true);
  const[showAssign,setShowAssign]=useState(false);
  const[assignTo,setAssignTo]=useState(inc.assignedTo||'');
  const[assignGrp,setAssignGrp]=useState(inc.assignedGrp||'');
  const[showStatus,setShowStatus]=useState(false);
  const[newStatus,setNewStatus]=useState(inc.status);
  const[showEscalate,setShowEscalate]=useState(false);
  const[esclNote,setEsclNote]=useState('');

  const reqUser=users.find(u=>u.id===inc.reqBy);
  const assignedUser=users.find(u=>u.id===inc.assignedTo);
  const agents=users.filter(u=>['AGENT','HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(u.role));
  const priMeta=PRIORITY[inc.priority]||PRIORITY.P3;

  const canAssign=['HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);
  const canClose=inc.assignedTo===me.id||['SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);
  const canUpdateStatus=inc.assignedTo===me.id||canAssign;
  const isMyTicket=inc.reqBy===me.id;

  const addNote=()=>{
    if(!noteText.trim())return;
    const note={id:'n'+Date.now(),type:isInternal?'work':'user',text:noteText,by:me.id,at:now(),internal:isInternal};
    const histEntry={action:isInternal?'Work Note Added':'Reply Added',by:me.id,at:now(),note:noteText.substring(0,60)};
    onUpdate({...inc,notes:[...inc.notes,note],history:[...inc.history,histEntry],updated:now()});
    setNoteText('');
  };

  const doAssign=()=>{
    onUpdate({...inc,assignedTo:assignTo||null,assignedGrp:assignGrp||null,status:assignTo?'Assigned':inc.status,updated:now(),history:[...inc.history,{action:'Assigned',by:me.id,at:now(),note:`Assigned to ${users.find(u=>u.id===assignTo)?.name||'—'} | Group: ${assignGrp||'—'}`}]});
    setShowAssign(false);
  };

  const doStatusChange=()=>{
    if(newStatus===inc.status)return;
    const upd={...inc,status:newStatus,updated:now(),history:[...inc.history,{action:`Status: ${newStatus}`,by:me.id,at:now(),note:`Status changed from ${inc.status} to ${newStatus}`}]};
    if(newStatus==='Resolved')upd.resolved=now();
    if(newStatus==='Closed')upd.closed=now();
    onUpdate(upd);setShowStatus(false);
  };

  const doEscalate=()=>{
    const newPri=inc.priority==='P3'?'P2':inc.priority==='P4'?'P3':'P1';
    onUpdate({...inc,priority:newPri,updated:now(),history:[...inc.history,{action:`Escalated to ${newPri}`,by:me.id,at:now(),note:esclNote||'Escalated by manager'}]});
    setShowEscalate(false);setEsclNote('');
  };

  const typeConfig={work:{bg:'#F8FAFC',bdr:'#E2E8F0',icon:'🔧',label:'Work Note'},resolution:{bg:C.successLt,bdr:'#A7F3D0',icon:'✅',label:'Resolution'},update:{bg:C.primaryLt,bdr:'#BFDBFE',icon:'📝',label:'Update'},user:{bg:C.warningLt,bdr:'#FDE68A',icon:'💬',label:'User Reply'}};

  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    {/* Header strip */}
    <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,background:`${priMeta.bg}`,flexShrink:0}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:10}}>
        <div style={{flex:1}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:5}}>
            <span style={{fontFamily:'monospace',fontSize:12,color:priMeta.color,fontWeight:800}}>{inc.id}</span>
            <PriBadge p={inc.priority}/>
            <StatusBadge status={inc.status}/>
            {inc.slaBreached&&<SLABadge breached/>}
            {!inc.slaBreached&&<SLABadge/>}
          </div>
          <div style={{fontSize:14,fontWeight:800,color:C.t1,lineHeight:1.3}}>{inc.title}</div>
        </div>
        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,color:C.t3,flexShrink:0,padding:'2px 4px'}}>×</button>
      </div>
    </div>

    <div style={{flex:1,overflowY:'auto',padding:16}}>
      {/* Actions row */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:14}}>
        {canAssign&&<Btn size="sm" variant="outline" icon="👤" onClick={()=>setShowAssign(!showAssign)}>Assign</Btn>}
        {canUpdateStatus&&<Btn size="sm" variant="outline" icon="🔄" onClick={()=>setShowStatus(!showStatus)}>Change Status</Btn>}
        {['SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role)&&inc.priority!=='P1'&&<Btn size="sm" variant="warning" icon="⬆" onClick={()=>setShowEscalate(true)}>Escalate</Btn>}
        {canClose&&inc.status==='Resolved'&&<Btn size="sm" variant="success" onClick={()=>onUpdate({...inc,status:'Closed',closed:now(),updated:now(),history:[...inc.history,{action:'Closed',by:me.id,at:now(),note:'Ticket closed'}]})}>✓ Close Ticket</Btn>}
        {isMyTicket&&inc.status==='Resolved'&&<Btn size="sm" variant="success" onClick={()=>onUpdate({...inc,status:'Closed',closed:now(),updated:now(),history:[...inc.history,{action:'Closed by Requester',by:me.id,at:now(),note:'Confirmed and closed by requester'}]})}>✓ Confirm & Close</Btn>}
      </div>

      {showAssign&&<div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:8}}>Assign Incident</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <Sel label="Assign To" value={assignTo} onChange={setAssignTo} opts={[{v:'',l:'— Unassigned —'},...agents.map(u=>({v:u.id,l:`${u.name} (${ROLE_META[u.role]?.label})`}))]}/>
          <Sel label="Assignment Group" value={assignGrp} onChange={setAssignGrp} opts={[{v:'',l:'— No Group —'},{v:'IT-Core',l:'IT-Core'},{v:'IT-Network',l:'IT-Network'},{v:'IT-Security',l:'IT-Security'},{v:'IT-Access',l:'IT-Access'},{v:'IT-Support',l:'IT-Support'},{v:'IT-Database',l:'IT-Database'}]}/>
        </div>
        <div style={{display:'flex',gap:6,marginTop:8}}><Btn size="sm" onClick={doAssign}>Save Assignment</Btn><Btn size="sm" variant="outline" onClick={()=>setShowAssign(false)}>Cancel</Btn></div>
      </div>}

      {showStatus&&<div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:8}}>Change Status</div>
        <Sel value={newStatus} onChange={setNewStatus} opts={INC_STATUS_FLOW.filter(s=>{if(me.role==='AGENT')return !['New','Closed'].includes(s)||s===inc.status;return true;}).map(s=>({v:s,l:s}))}/>
        <div style={{display:'flex',gap:6,marginTop:8}}><Btn size="sm" onClick={doStatusChange}>Update Status</Btn><Btn size="sm" variant="outline" onClick={()=>setShowStatus(false)}>Cancel</Btn></div>
      </div>}

      {showEscalate&&<div style={{background:C.warningLt,border:`1px solid #FDE68A`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.warning,marginBottom:8}}>⬆ Escalate Incident</div>
        <Textarea label="Escalation Reason" value={esclNote} onChange={setEsclNote} rows={2} placeholder="Reason for escalation…"/>
        <div style={{display:'flex',gap:6,marginTop:8}}><Btn size="sm" variant="warning" onClick={doEscalate}>Confirm Escalate</Btn><Btn size="sm" variant="outline" onClick={()=>setShowEscalate(false)}>Cancel</Btn></div>
      </div>}

      {/* Info grid */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
        {[['Reported By',reqUser?.name||'—'],['Assigned To',assignedUser?.name||'Unassigned'],['Department',inc.dept||'—'],['Location',inc.loc||'—'],['Category',inc.category],['Created',inc.created],['SLA Due',inc.slaDue||'—'],['Last Updated',inc.updated]].map(([k,v])=>(
          <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'7px 10px'}}><div style={{fontSize:9,color:C.t3,marginBottom:2,textTransform:'uppercase',letterSpacing:'0.05em'}}>{k}</div><div style={{fontSize:11,fontWeight:600,color:C.t1}}>{v}</div></div>
        ))}
      </div>

      {/* Description */}
      <div style={{background:'#F8FAFC',borderRadius:6,padding:'10px 12px',marginBottom:14}}>
        <div style={{fontSize:9,color:C.t3,marginBottom:4,textTransform:'uppercase',letterSpacing:'0.05em'}}>Description</div>
        <div style={{fontSize:12,color:C.t1,lineHeight:1.7}}>{inc.desc}</div>
        {inc.tags?.length>0&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:8}}>
          {inc.tags.map(t=><span key={t} style={{fontSize:9,color:C.primary,background:C.primaryLt,padding:'2px 6px',borderRadius:20,fontWeight:700}}>#{t}</span>)}
        </div>}
      </div>

      {/* Work notes */}
      {inc.notes.length>0&&<div style={{marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>Work Notes & Updates ({inc.notes.length})</div>
        {inc.notes.map(n=>{
          const cfg=typeConfig[n.type]||typeConfig.update;
          const actor=users.find(u=>u.id===n.by);
          return <div key={n.id} style={{background:cfg.bg,border:`1px solid ${cfg.bdr}`,borderRadius:7,padding:10,marginBottom:7}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
              <Avatar name={actor?.name||'?'} size={20}/>
              <span style={{fontSize:11,fontWeight:700,color:C.t1}}>{actor?.name||'System'}</span>
              <span style={{fontSize:10,color:C.t3}}>{n.at}</span>
              <span style={{marginLeft:'auto',fontSize:9,fontWeight:700,color:C.t2}}>{cfg.icon} {cfg.label}</span>
              {n.internal&&<span style={{fontSize:9,color:C.t3,background:'#F1F5F9',padding:'1px 5px',borderRadius:10}}>Internal</span>}
            </div>
            <div style={{fontSize:12,color:C.t1,lineHeight:1.6,paddingLeft:28}}>{n.text}</div>
          </div>;
        })}
      </div>}

      {/* Add note */}
      {(inc.assignedTo===me.id||canAssign||isMyTicket)&&!['Closed','Cancelled'].includes(inc.status)&&<div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.t1,marginBottom:8}}>Add Note</div>
        <Textarea value={noteText} onChange={setNoteText} rows={3} placeholder={isInternal?'Add work note (internal)…':'Add reply to requester…'}/>
        <div style={{display:'flex',alignItems:'center',gap:10,marginTop:8}}>
          {!isMyTicket&&<label style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.t2,cursor:'pointer'}}>
            <input type="checkbox" checked={isInternal} onChange={e=>setInternal(e.target.checked)}/> Internal Work Note
          </label>}
          <Btn size="sm" onClick={addNote} sx={{marginLeft:'auto'}} disabled={!noteText.trim()}>Add Note</Btn>
        </div>
      </div>}

      {/* History */}
      <div>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>Activity History</div>
        <div style={{maxHeight:180,overflowY:'auto'}}>
          {[...inc.history].reverse().map((h,i)=>{
            const actor=users.find(u=>u.id===h.by);
            return <div key={i} style={{display:'flex',gap:8,marginBottom:7,paddingBottom:7,borderBottom:`1px solid ${C.borderFaint}`}}>
              <Avatar name={actor?.name||'System'} size={22}/>
              <div style={{flex:1}}>
                <div style={{display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}}>
                  <span style={{fontSize:10,fontWeight:700,color:C.t1}}>{actor?.name||'System'}</span>
                  <span style={{fontSize:9,color:C.t3}}>{h.at}</span>
                </div>
                <div style={{fontSize:10,color:C.primary,fontWeight:600}}>{h.action}</div>
                {h.note&&<div style={{fontSize:10,color:C.t2,marginTop:1,lineHeight:1.5}}>{h.note}</div>}
              </div>
            </div>;})}
        </div>
      </div>
    </div>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// INCIDENT MANAGEMENT MODULE
// ══════════════════════════════════════════════════════════════
const IncidentModule=({me,users,incidents,setIncidents,addToast})=>{
  const[search,setSearch]=useState('');
  const[fStatus,setFS]=useState('');
  const[fPri,setFP]=useState('');
  const[fCat,setFC]=useState('');
  const[fAssigned,setFA]=useState('');
  const[sortBy,setSB]=useState('created');
  const[sortDir,setSD]=useState('desc');
  const[page,setPage]=useState(1);
  const[selected,setSelected]=useState(null);
  const[showNew,setSN]=useState(false);
  const PAGE=10;

  const filtered=useMemo(()=>{
    let list=[...incidents];
    if(me.role==='EMPLOYEE')list=list.filter(i=>i.reqBy===me.id);
    const q=search.toLowerCase();
    return list.filter(i=>(!q||i.id.toLowerCase().includes(q)||i.title.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q))&&(!fStatus||i.status===fStatus)&&(!fPri||i.priority===fPri)&&(!fCat||i.category===fCat)&&(!fAssigned||(fAssigned==='me'?i.assignedTo===me.id:fAssigned==='unassigned'?!i.assignedTo:true)))
      .sort((a,b)=>{let av=a[sortBy]||'',bv=b[sortBy]||'';return av.localeCompare(bv)*(sortDir==='asc'?1:-1);});
  },[incidents,search,fStatus,fPri,fCat,fAssigned,sortBy,sortDir,me]);

  const paged=filtered.slice((page-1)*PAGE,page*PAGE);
  const totalP=Math.ceil(filtered.length/PAGE);

  const updateInc=inc=>{setIncidents(p=>p.map(i=>i.id===inc.id?inc:i));setSelected(inc);addToast('success',`${inc.id} updated`);};

  const NewForm=()=>{
    const[f,setF]=useState({title:'',desc:'',category:INC_CATEGORIES[0],priority:'P3',dept:me.dept||'IT',loc:'HQ - New York'});
    const[errs,setErrs]=useState({});
    const ff=k=>v=>setF(p=>({...p,[k]:v}));
    const submit=()=>{
      const e={};if(!f.title.trim())e.title='Required';if(!f.desc.trim())e.desc='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      const pri=PRIORITY[f.priority];
      const ni={id:genId('INC'),title:f.title,desc:f.desc,category:f.category,priority:f.priority,status:'New',reqBy:me.id,assignedTo:null,assignedGrp:null,created:now(),updated:now(),resolved:null,closed:null,dept:f.dept,loc:f.loc,slaBreached:false,slaDue:`SLA: ${pri.sla}h`,tags:[],notes:[],history:[{action:'Created',by:me.id,at:now(),note:'Incident logged by user'}]};
      setIncidents(p=>[ni,...p]);addToast('success',`${ni.id} created — Priority ${f.priority}`);setSN(false);
    };
    return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <Input label="Incident Title" value={f.title} onChange={ff('title')} required error={errs.title} sx={{gridColumn:'1/-1'}} placeholder="Brief description of the issue…"/>
      <Textarea label="Detailed Description" value={f.desc} onChange={ff('desc')} required rows={3} sx={{gridColumn:'1/-1'}} placeholder="Describe what happened, impact, steps tried…"/>
      <Sel label="Category" value={f.category} onChange={ff('category')} opts={INC_CATEGORIES.map(c=>({v:c,l:c}))} required/>
      <Sel label="Priority" value={f.priority} onChange={ff('priority')} opts={Object.entries(PRIORITY).map(([k,v])=>({v:k,l:v.label}))} required/>
      <Sel label="Department" value={f.dept} onChange={ff('dept')} opts={DEPTS.map(d=>({v:d,l:d}))}/>
      <Sel label="Location" value={f.loc} onChange={ff('loc')} opts={['HQ - New York','Branch A - Chicago','Branch B - LA','Remote','Branch C - Dallas'].map(l=>({v:l,l:l}))}/>
      <div style={{gridColumn:'1/-1',background:f.priority==='P1'?C.dangerLt:f.priority==='P2'?C.orangeLt:C.primaryLt,border:`1px solid ${PRIORITY[f.priority]?.border||C.border}`,borderRadius:6,padding:'8px 11px',fontSize:11}}>
        <span style={{fontWeight:700,color:PRIORITY[f.priority]?.color}}>{PRIORITY[f.priority]?.icon} {PRIORITY[f.priority]?.label}</span>
        <span style={{color:C.t2,marginLeft:8}}>SLA: {PRIORITY[f.priority]?.sla} hours response time</span>
      </div>
      <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end',gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSN(false)}>Cancel</Btn>
        <Btn onClick={submit}>🚨 Submit Incident</Btn>
      </div>
    </div>;
  };

  return <div style={{display:'flex',height:'calc(100vh - 50px)'}}>
    {/* List panel */}
    <div style={{flex:1,overflowY:'auto',padding:'16px 18px',borderRight:selected?`1px solid ${C.border}`:'none',minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Incident Management</h2><p style={{fontSize:10,color:C.t2,margin:0}}>{filtered.length} incidents · {incidents.filter(i=>i.slaBreached).length} SLA breached</p></div>
        <Btn icon="+" onClick={()=>setSN(true)}>New Incident</Btn>
      </div>

      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:9,marginBottom:10,display:'flex',gap:7,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:160}}><Input placeholder="Search incidents…" value={search} onChange={v=>{setSearch(v);setPage(1);}}/></div>
        <Sel value={fStatus} onChange={v=>{setFS(v);setPage(1);}} opts={[{v:'',l:'All Status'},...INC_STATUS_FLOW.map(s=>({v:s,l:s}))]} sx={{minWidth:120}}/>
        <Sel value={fPri} onChange={v=>{setFP(v);setPage(1);}} opts={[{v:'',l:'All Priority'},...Object.keys(PRIORITY).map(k=>({v:k,l:k}))]} sx={{minWidth:110}}/>
        <Sel value={fCat} onChange={v=>{setFC(v);setPage(1);}} opts={[{v:'',l:'All Category'},...INC_CATEGORIES.map(c=>({v:c,l:c}))]} sx={{minWidth:140}}/>
        {['HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role)&&<Sel value={fAssigned} onChange={v=>{setFA(v);setPage(1);}} opts={[{v:'',l:'All Agents'},{v:'me',l:'Assigned to Me'},{v:'unassigned',l:'Unassigned'}]} sx={{minWidth:130}}/>}
        {(search||fStatus||fPri||fCat||fAssigned)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFS('');setFP('');setFC('');setFA('');setPage(1);}}>Clear ×</Btn>}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {paged.length===0&&<div style={{padding:40,textAlign:'center',color:C.t3,background:C.card,borderRadius:8,border:`1px solid ${C.border}`}}>No incidents found</div>}
        {paged.map(inc=>{
          const reqUser=users.find(u=>u.id===inc.reqBy);
          const assignedUser=users.find(u=>u.id===inc.assignedTo);
          const priM=PRIORITY[inc.priority]||PRIORITY.P3;
          const isSelected=selected?.id===inc.id;
          return <div key={inc.id} onClick={()=>setSelected(isSelected?null:inc)} style={{background:C.card,borderRadius:8,border:`1px solid ${isSelected?C.primary:inc.slaBreached?C.danger:C.border}`,padding:'11px 14px',cursor:'pointer',transition:'all .15s',borderLeft:`4px solid ${priM.color}`}} onMouseEnter={e=>{if(!isSelected)e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)';}} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4,alignItems:'center'}}>
                  <span style={{fontFamily:'monospace',fontSize:10,color:priM.color,fontWeight:800}}>{inc.id}</span>
                  <PriBadge p={inc.priority} mini/>
                  <StatusBadge status={inc.status}/>
                  {inc.slaBreached&&<SLABadge breached/>}
                </div>
                <div style={{fontSize:13,fontWeight:700,color:C.t1,marginBottom:3,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{inc.title}</div>
                <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:C.t2}}>{inc.category}</span>
                  <span style={{fontSize:10,color:C.t3}}>by {reqUser?.name||'—'}</span>
                  <span style={{fontSize:10,color:C.t3}}>{inc.created}</span>
                </div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                {assignedUser?<div style={{display:'flex',alignItems:'center',gap:5,justifyContent:'flex-end'}}><Avatar name={assignedUser.name} size={20}/><span style={{fontSize:10,color:C.t2}}>{assignedUser.name.split(' ')[0]}</span></div>:<span style={{fontSize:10,color:C.t3,background:'#F1F5F9',padding:'2px 6px',borderRadius:20}}>Unassigned</span>}
                <div style={{fontSize:10,color:C.t3,marginTop:3}}>{inc.updated}</div>
              </div>
            </div>
          </div>;
        })}
      </div>

      {totalP>1&&<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:10}}>
        <span style={{fontSize:10,color:C.t2}}>Showing {(page-1)*PAGE+1}–{Math.min(page*PAGE,filtered.length)} of {filtered.length}</span>
        <div style={{display:'flex',gap:4}}>
          <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}>‹</Btn>
          {Array.from({length:Math.min(5,totalP)},(_,i)=>{const p=Math.max(1,Math.min(totalP-4,page-2))+i;return p<=totalP?<button key={p} onClick={()=>setPage(p)} style={{width:26,height:26,borderRadius:5,border:`1px solid ${p===page?C.primary:C.border}`,background:p===page?C.primary:'transparent',color:p===page?'#fff':C.t2,fontSize:11,cursor:'pointer'}}>{p}</button>:null;})}
          <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.min(totalP,p+1))} disabled={page>=totalP}>›</Btn>
        </div>
      </div>}
    </div>

    {/* Detail panel */}
    {selected&&<div style={{width:460,flexShrink:0,background:C.card,overflowY:'auto',animation:'slideIn .2s ease'}}>
      <IncidentDetail inc={selected} users={users} me={me} onUpdate={updateInc} onClose={()=>setSelected(null)}/>
    </div>}

    <Modal open={showNew} title="Log New Incident" onClose={()=>setSN(false)} width={560}><NewForm/></Modal>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// SERVICE REQUEST MODULE
// ══════════════════════════════════════════════════════════════
const ServiceReqModule=({me,users,serviceReqs,setServiceReqs,addToast})=>{
  const[tab,setTab]=useState('my');
  const[showNew,setSN]=useState(false);
  const[selectedCat,setSC]=useState(null);
  const[viewSR,setVSR]=useState(null);
  const[search,setSearch]=useState('');
  const[fStatus,setFS]=useState('');
  const[page,setPage]=useState(1);
  const PAGE=8;

  const getApprovalChain=reqById=>{
    const emp=users.find(u=>u.id===reqById);if(!emp)return [];
    const L1=users.find(u=>u.id===emp.mgr)||users.find(u=>u.role==='ADMIN');
    const L2=L1?users.find(u=>u.id===L1.mgr):null;
    const L3=users.find(u=>u.role==='SERVICE_MANAGER')||users.find(u=>u.role==='ADMIN');
    return [L1||{id:'',name:'No L1'},L2||L1||{id:'',name:'No L2'},L3||{id:'',name:'No L3'}];
  };

  const myPendingApprovals=serviceReqs.filter(sr=>sr.status==='Pending Approval'&&(sr.approvals||[]).some(a=>a.approver===me.id&&a.status==='Pending'));

  const filtered=useMemo(()=>{
    let list=tab==='my'?serviceReqs.filter(s=>s.reqBy===me.id):tab==='approvals'?myPendingApprovals:serviceReqs;
    const q=search.toLowerCase();
    return list.filter(s=>(!q||s.id.toLowerCase().includes(q)||s.title.toLowerCase().includes(q))&&(!fStatus||s.status===fStatus)).sort((a,b)=>b.id.localeCompare(a.id));
  },[serviceReqs,tab,search,fStatus,me,myPendingApprovals]);

  const paged=filtered.slice((page-1)*PAGE,page*PAGE);
  const totalP=Math.ceil(filtered.length/PAGE);

  const handleApprove=(sr,level,approve,comment)=>{
    const upd=sr.approvals.map(a=>a.level===level?{...a,status:approve?'Approved':'Rejected',comment,date:now()}:a);
    let ns=sr.status;
    let nh=[...sr.history,{action:approve?`L${level} Approved`:`L${level} Rejected`,by:me.id,at:now(),note:comment}];
    if(!approve)ns='Rejected';
    else{if(level===1)ns='Pending Approval';else if(level===2)ns='Pending Approval';else if(level===3){ns='Approved';nh.push({action:'Approved — All Levels',by:'System',at:now(),note:'All 3 approval levels satisfied'});}}
    const updated={...sr,approvals:upd,status:ns,history:nh,updated:now()};
    setServiceReqs(p=>p.map(s=>s.id===sr.id?updated:s));
    setVSR(updated);
    addToast(approve?'success':'error',`SR ${sr.id} ${approve?`L${level} Approved`:'Rejected'}`);
  };

  const SRForm=({cat})=>{
    const[f,setF]=useState({title:cat.name,desc:'',priority:'Medium',...Object.fromEntries(cat.fields.map(fn=>[fn,'']))});
    const[errs,setErrs]=useState({});
    const ff=k=>v=>setF(p=>({...p,[k]:v}));
    const chain=getApprovalChain(me.id);
    const submit=()=>{
      const e={};if(!f.title.trim())e.title='Required';if(!f.desc.trim())e.desc='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      const chain3=getApprovalChain(me.id);
      const needsApproval=cat.approval;
      const ns=needsApproval?'Pending Approval':'Submitted';
      const fieldVals=Object.fromEntries(cat.fields.map(fn=>[fn,f[fn]||'']));
      const nr={id:genId('SR'),catalogId:cat.id,title:f.title,desc:f.desc,fields:fieldVals,priority:f.priority,status:ns,reqBy:me.id,assignedTo:null,created:now(),updated:now(),slaHours:cat.sla,slaDue:`Within ${cat.sla}h`,
        approvals:needsApproval?[{level:1,approver:chain3[0]?.id||'',status:'Pending',comment:'',date:''},{level:2,approver:chain3[1]?.id||'',status:'Pending',comment:'',date:''},{level:3,approver:chain3[2]?.id||'',status:'Pending',comment:'',date:''}]:[],
        notes:[],history:[{action:'Submitted',by:me.id,at:now(),note:needsApproval?'Request submitted for 3-level approval':'No approval required — direct fulfilment'}]};
      setServiceReqs(p=>[nr,...p]);addToast('success',`${nr.id} submitted`);setSN(false);setSC(null);
    };
    return <div>
      {cat.approval&&<div style={{background:C.primaryLt,border:`1px solid #BFDBFE`,borderRadius:7,padding:10,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:C.primary,marginBottom:6}}>📋 3-Level Approval Required for this Request</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {chain.map((c,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:5,background:'#fff',border:`1px solid #BFDBFE`,borderRadius:6,padding:'4px 8px'}}>
            <div style={{width:18,height:18,borderRadius:'50%',background:C.primary,color:'#fff',fontSize:9,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>L{i+1}</div>
            <div><div style={{fontSize:10,fontWeight:600,color:C.t1}}>{c.name||'—'}</div></div>
          </div>)}
        </div>
      </div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Input label="Request Title" value={f.title} onChange={ff('title')} required error={errs.title} sx={{gridColumn:'1/-1'}}/>
        <Textarea label="Description / Requirement" value={f.desc} onChange={ff('desc')} required rows={2} sx={{gridColumn:'1/-1'}} placeholder="Describe your requirement in detail…"/>
        {cat.fields.map(fn=><Input key={fn} label={fn} value={f[fn]||''} onChange={ff(fn)} placeholder={fn} sx={{gridColumn:fn.length>20?'1/-1':undefined}}/>)}
        <Sel label="Priority" value={f.priority} onChange={ff('priority')} opts={['Low','Medium','High','Critical'].map(p=>({v:p,l:p}))} sx={{gridColumn:'1/-1'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:12,paddingTop:10,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSC(null)}>Back</Btn>
        <Btn onClick={submit}>🚀 Submit Request</Btn>
      </div>
    </div>;
  };

  const SRDetail=({sr})=>{
    const[noteText,setNT]=useState('');
    const[comment,setComment]=useState('');
    const[showReject,setSR2]=useState(false);
    const myAppr=sr.approvals?.find(a=>a.approver===me.id&&a.status==='Pending');
    const isServiceMgr=['SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);
    const canOverride=isServiceMgr&&sr.status==='Pending Approval'&&!myAppr;
    const level=myAppr?.level||(sr.approvals?.findIndex(a=>a.status==='Pending')+1)||1;
    const reqUser=users.find(u=>u.id===sr.reqBy);
    const catInfo=SR_CATALOG.find(c=>c.id===sr.catalogId);

    const addNote=()=>{if(!noteText.trim())return;const note={id:'sn'+Date.now(),text:noteText,by:me.id,at:now(),internal:false};const nh=[...sr.history,{action:'Note Added',by:me.id,at:now(),note:noteText.substring(0,60)}];const upd={...sr,notes:[...(sr.notes||[]),note],history:nh,updated:now()};setServiceReqs(p=>p.map(s=>s.id===sr.id?upd:s));setVSR(upd);setNT('');};

    return <div>
      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginBottom:12}}>
        <StatusBadge status={sr.status} module="sr"/>
        <span style={{fontSize:10,fontWeight:700,color:C.primary,background:C.primaryLt,padding:'2px 7px',borderRadius:20}}>{catInfo?.icon} {catInfo?.name||'Request'}</span>
        <span style={{fontSize:10,color:C.t2,background:'#F1F5F9',padding:'2px 7px',borderRadius:20}}>SLA: {sr.slaHours}h</span>
      </div>
      <h3 style={{fontSize:14,fontWeight:800,color:C.t1,margin:'0 0 10px'}}>{sr.title}</h3>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:12}}>
        {[['Requested By',reqUser?.name||'—'],['Created',sr.created],['SLA',sr.slaDue||'—'],['Status',sr.status]].map(([k,v])=>(
          <div key={k} style={{background:'#F8FAFC',borderRadius:6,padding:'6px 9px'}}><div style={{fontSize:8,color:C.t3,marginBottom:1,textTransform:'uppercase'}}>{k}</div><div style={{fontSize:11,fontWeight:600,color:C.t1}}>{v}</div></div>
        ))}
      </div>
      <div style={{background:'#F8FAFC',borderRadius:6,padding:'9px 11px',marginBottom:10}}><div style={{fontSize:9,color:C.t3,marginBottom:3,textTransform:'uppercase'}}>Description</div><div style={{fontSize:12,color:C.t1,lineHeight:1.6}}>{sr.desc}</div></div>
      {sr.fields&&Object.keys(sr.fields).length>0&&<div style={{background:'#F8FAFC',borderRadius:6,padding:'9px 11px',marginBottom:12}}>
        <div style={{fontSize:9,color:C.t3,marginBottom:6,textTransform:'uppercase'}}>Request Details</div>
        {Object.entries(sr.fields).map(([k,v])=><div key={k} style={{display:'flex',gap:8,marginBottom:5}}>
          <span style={{fontSize:10,color:C.t3,minWidth:120,flexShrink:0}}>{k}:</span><span style={{fontSize:11,color:C.t1,fontWeight:600}}>{v||'—'}</span>
        </div>)}
      </div>}

      {/* Approval tracker */}
      {sr.approvals?.length>0&&<div style={{marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>Approval Progress</div>
        <div style={{display:'flex',alignItems:'flex-start',position:'relative'}}>
          <div style={{position:'absolute',top:18,left:'17%',width:'66%',height:2,background:'#E2E8F0',zIndex:0}}/>
          {sr.approvals.map((a,i)=>{
            const appr=users.find(u=>u.id===a.approver);
            const sc={Approved:{ic:'✓',bg:C.success,bd:C.success},Rejected:{ic:'✗',bg:C.danger,bd:C.danger},Pending:{ic:String(i+1),bg:'#fff',bd:C.border}};
            const s=sc[a.status]||sc.Pending;
            return <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,position:'relative',zIndex:1}}>
              <div style={{width:36,height:36,borderRadius:'50%',background:s.bg,border:`2px solid ${s.bd}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:a.status==='Pending'?C.t3:'#fff',fontWeight:800}}>{s.ic}</div>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:8,fontWeight:800,color:C.t3}}>L{i+1}</div>
                <div style={{fontSize:9,fontWeight:700,color:C.t1}}>{appr?.name?.split(' ')[0]||'—'}</div>
                <StatusBadge status={a.status} module="sr"/>
                {a.date&&<div style={{fontSize:8,color:C.t3,marginTop:1}}>{a.date}</div>}
              </div>
            </div>;})}
        </div>
      </div>}

      {/* Approval action */}
      {(myAppr||canOverride)&&<div style={{background:C.warningLt,border:'1px solid #FDE68A',borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.warning,marginBottom:7}}>{canOverride?'⚡ Override':'⏳ Your Approval'} — Level {level}</div>
        <Textarea label="Comments" value={comment} onChange={setComment} rows={2} placeholder="Approval comments…"/>
        <div style={{display:'flex',gap:7,marginTop:8}}>
          <Btn size="sm" variant="success" onClick={()=>handleApprove(sr,level,true,comment)}>✓ Approve</Btn>
          {!showReject?<Btn size="sm" variant="outline" onClick={()=>setSR2(true)}>✗ Reject</Btn>:<Btn size="sm" variant="danger" onClick={()=>{if(!comment.trim()){addToast('error','Reason required');return;}handleApprove(sr,level,false,comment);}}>✗ Confirm Reject</Btn>}
        </div>
      </div>}

      {/* Fulfil / Update actions */}
      {['HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN','AGENT'].includes(me.role)&&sr.status==='Approved'&&<div style={{display:'flex',gap:7,marginBottom:12}}>
        <Btn size="sm" variant="primary" onClick={()=>{const u={...sr,status:'In Progress',assignedTo:me.id,updated:now(),history:[...sr.history,{action:'In Progress',by:me.id,at:now(),note:'Work started'}]};setServiceReqs(p=>p.map(s=>s.id===sr.id?u:s));setVSR(u);addToast('success','Marked In Progress');}}>▶ Start Fulfilment</Btn>
        <Btn size="sm" variant="success" onClick={()=>{const u={...sr,status:'Fulfilled',updated:now(),history:[...sr.history,{action:'Fulfilled',by:me.id,at:now(),note:'Request completed'}]};setServiceReqs(p=>p.map(s=>s.id===sr.id?u:s));setVSR(u);addToast('success','SR Fulfilled');}}>✓ Mark Fulfilled</Btn>
      </div>}

      {/* Notes */}
      {(sr.notes||[]).length>0&&<div style={{marginBottom:10}}>
        {sr.notes.map(n=>{const actor=users.find(u=>u.id===n.by);return <div key={n.id} style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:6,padding:8,marginBottom:6}}>
          <div style={{display:'flex',gap:7,alignItems:'center',marginBottom:3}}><Avatar name={actor?.name||'?'} size={18}/><span style={{fontSize:10,fontWeight:700,color:C.t1}}>{actor?.name||'—'}</span><span style={{fontSize:9,color:C.t3}}>{n.at}</span></div>
          <div style={{fontSize:11,color:C.t1,paddingLeft:25,lineHeight:1.5}}>{n.text}</div>
        </div>;})}
      </div>}
      {!['Fulfilled','Closed','Rejected'].includes(sr.status)&&<div style={{display:'flex',gap:7,alignItems:'flex-end'}}>
        <div style={{flex:1}}><Textarea value={noteText} onChange={setNT} rows={2} placeholder="Add a note or update…"/></div>
        <Btn size="sm" onClick={addNote} disabled={!noteText.trim()}>Add</Btn>
      </div>}
    </div>;
  };

  const tabs=[['my','My Requests'],['all','All Requests'],['approvals',`Approvals${myPendingApprovals.length>0?` (${myPendingApprovals.length})`:''}`],['catalog','Service Catalog']];
  const visibleTabs=tabs.filter(([v])=>v==='my'||v==='catalog'||['HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN','AGENT'].includes(me.role));

  return <div style={{padding:'16px 18px',maxWidth:1200}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Service Request Management</h2><p style={{fontSize:10,color:C.t2,margin:0}}>Submit and track IT service requests with catalog-based ordering</p></div>
      <Btn icon="+" onClick={()=>{setTab('catalog');setSN(true);}}>New Request</Btn>
    </div>

    <div style={{display:'flex',gap:0,marginBottom:12,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:3,width:'fit-content'}}>
      {visibleTabs.map(([v,l])=><button key={v} onClick={()=>{setTab(v);setPage(1);}} style={{padding:'5px 13px',borderRadius:5,border:'none',background:tab===v?C.primary:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>{l}</button>)}
    </div>

    {tab==='catalog'&&!selectedCat&&<div>
      <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:10}}>Select a Service to Request</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:10}}>
        {SR_CATALOG.map(cat=><div key={cat.id} onClick={()=>setSC(cat)} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:14,cursor:'pointer',transition:'all .15s'}} onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 3px 10px rgba(37,99,235,0.1)';e.currentTarget.style.borderColor=C.primary;}} onMouseLeave={e=>{e.currentTarget.style.boxShadow='none';e.currentTarget.style.borderColor=C.border;}}>
          <div style={{fontSize:28,marginBottom:8}}>{cat.icon}</div>
          <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:3}}>{cat.name}</div>
          <div style={{fontSize:10,color:C.t2,marginBottom:8,lineHeight:1.4}}>{cat.desc}</div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            <span style={{fontSize:9,color:C.t2,background:'#F1F5F9',padding:'2px 6px',borderRadius:20}}>SLA: {cat.sla}h</span>
            {cat.approval?<span style={{fontSize:9,color:C.warning,background:C.warningLt,padding:'2px 6px',borderRadius:20,fontWeight:700}}>3-Level Approval</span>:<span style={{fontSize:9,color:C.success,background:C.successLt,padding:'2px 6px',borderRadius:20,fontWeight:700}}>No Approval</span>}
            <span style={{fontSize:9,color:C.t3,background:'#F1F5F9',padding:'2px 6px',borderRadius:20}}>{cat.cat}</span>
          </div>
        </div>)}
      </div>
    </div>}

    {tab==='catalog'&&selectedCat&&<div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:18,maxWidth:580}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${C.border}`}}>
        <span style={{fontSize:28}}>{selectedCat.icon}</span>
        <div><div style={{fontSize:14,fontWeight:800,color:C.t1}}>{selectedCat.name}</div><div style={{fontSize:11,color:C.t2}}>{selectedCat.desc}</div></div>
        <Btn size="sm" variant="outline" onClick={()=>setSC(null)} sx={{marginLeft:'auto'}}>← Back</Btn>
      </div>
      <SRForm cat={selectedCat}/>
    </div>}

    {tab!=='catalog'&&<>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:9,marginBottom:10,display:'flex',gap:7,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:160}}><Input placeholder="Search requests…" value={search} onChange={v=>{setSearch(v);setPage(1);}}/></div>
        <Sel value={fStatus} onChange={v=>{setFS(v);setPage(1);}} opts={[{v:'',l:'All Status'},...SR_STATUS_FLOW.map(s=>({v:s,l:s}))]} sx={{minWidth:140}}/>
        {(search||fStatus)&&<Btn variant="outline" size="sm" onClick={()=>{setSearch('');setFS('');setPage(1);}}>Clear ×</Btn>}
      </div>

      <div style={{display:'grid',gridTemplateColumns:viewSR?'1fr 420px':'1fr',gap:12}}>
        <div>
          {paged.length===0&&<div style={{padding:40,textAlign:'center',color:C.t3,background:C.card,borderRadius:8,border:`1px solid ${C.border}`}}>No requests found</div>}
          {paged.map(sr=>{
            const catInfo=SR_CATALOG.find(c=>c.id===sr.catalogId);
            const reqUser=users.find(u=>u.id===sr.reqBy);
            const hasMine=(sr.approvals||[]).some(a=>a.approver===me.id&&a.status==='Pending');
            const isV=viewSR?.id===sr.id;
            return <div key={sr.id} onClick={()=>setVSR(isV?null:sr)} style={{background:C.card,borderRadius:8,border:`1px solid ${isV?C.primary:hasMine?C.warning:C.border}`,padding:'11px 14px',marginBottom:6,cursor:'pointer',transition:'all .15s',borderLeft:`4px solid ${hasMine?C.warning:C.primary}`}} onMouseEnter={e=>{if(!isV)e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)';}} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <span style={{fontSize:22,flexShrink:0}}>{catInfo?.icon||'📋'}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',gap:6,marginBottom:3,flexWrap:'wrap',alignItems:'center'}}>
                    <span style={{fontFamily:'monospace',fontSize:10,color:C.primary,fontWeight:800}}>{sr.id}</span>
                    <StatusBadge status={sr.status} module="sr"/>
                    {hasMine&&<span style={{fontSize:9,color:C.warning,fontWeight:800,background:C.warningLt,padding:'2px 6px',borderRadius:20}}>⏳ Your Approval</span>}
                  </div>
                  <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{sr.title}</div>
                  <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                    <span style={{fontSize:10,color:C.t2}}>{catInfo?.name||'—'}</span>
                    <span style={{fontSize:10,color:C.t3}}>by {reqUser?.name||'—'}</span>
                    <span style={{fontSize:10,color:C.t3}}>{sr.created}</span>
                  </div>
                </div>
              </div>
            </div>;
          })}
          {totalP>1&&<div style={{display:'flex',justifyContent:'flex-end',gap:4,marginTop:8}}>
            <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}>‹</Btn>
            {Array.from({length:Math.min(5,totalP)},(_,i)=>{const p=Math.max(1,Math.min(totalP-4,page-2))+i;return p<=totalP?<button key={p} onClick={()=>setPage(p)} style={{width:26,height:26,borderRadius:5,border:`1px solid ${p===page?C.primary:C.border}`,background:p===page?C.primary:'transparent',color:p===page?'#fff':C.t2,fontSize:11,cursor:'pointer'}}>{p}</button>:null;})}
            <Btn variant="outline" size="sm" onClick={()=>setPage(p=>Math.min(totalP,p+1))} disabled={page>=totalP}>›</Btn>
          </div>}
        </div>

        {viewSR&&<div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:16,animation:'slideIn .2s ease',maxHeight:'75vh',overflowY:'auto'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,paddingBottom:10,borderBottom:`1px solid ${C.border}`}}>
            <span style={{fontSize:12,fontWeight:800,color:C.t1}}>{viewSR.id}</span>
            <button onClick={()=>setVSR(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:C.t3}}>×</button>
          </div>
          <SRDetail sr={viewSR}/>
        </div>}
      </div>
    </>}
  </div>;
};

// ─── MODULE SHELL ─────────────────────────────────
const Shell=({module})=>{
  const M={imac:{t:'IMAC Module',d:'Install, Move, Add, Change requests.',icon:'🔄',color:C.primary,pt:'Part 2 ✓'},problems:{t:'Problem Management',icon:'🔍',color:C.warning,pt:'Part 4'},changes:{t:'Change Management',icon:'🔧',color:C.purple,pt:'Part 4'},cmdb:{t:'Asset & CMDB',icon:'🖥️',color:C.cyan,pt:'Part 5'},knowledge:{t:'Knowledge Base',icon:'📚',color:C.success,pt:'Part 6'},sla:{t:'SLA & Escalation',icon:'⏱️',color:C.warning,pt:'Part 6'},employees:{t:'Employee Mgmt',icon:'👥',color:C.primary,pt:'Part 2 ✓'},users:{t:'User Mgmt',icon:'🔐',color:C.primary,pt:'Part 1 ✓'},reports:{t:'Reports',icon:'📊',color:C.purple,pt:'Part 7'}};
  const c=M[module]||{t:module,icon:'📋',color:C.primary,pt:'Upcoming'};
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'calc(100vh - 110px)'}}>
    <div style={{textAlign:'center',maxWidth:400}}>
      <div style={{width:64,height:64,borderRadius:16,background:`${c.color}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,margin:'0 auto 14px'}}>{c.icon}</div>
      <h2 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 6px'}}>{c.t}</h2>
      <div style={{background:`${c.color}0D`,border:`1px dashed ${c.color}60`,borderRadius:8,padding:'10px 14px',display:'inline-flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:16}}>🔨</span><div><div style={{fontSize:10,fontWeight:800,color:c.color}}>{c.pt}</div><div style={{fontSize:10,color:C.t2}}>Module coming in scheduled part</div></div>
      </div>
    </div>
  </div>;
};

// ─── LOGIN ────────────────────────────────────────
const Login=({onLogin})=>{
  const[email,setEmail]=useState('');
  const[pw,setPw]=useState('');
  const[loading,setL]=useState(false);
  const[err,setErr]=useState('');
  const[sel,setSel]=useState(null);
  const DEMOS=[{r:'SUPER_ADMIN',e:'superadmin@itsm.com',p:'Admin@123'},{r:'ADMIN',e:'admin@itsm.com',p:'Admin@123'},{r:'EMPLOYEE',e:'employee@company.com',p:'Employee@123'},{r:'HELPDESK',e:'helpdesk@company.com',p:'Helpdesk@123'},{r:'AGENT',e:'agent@company.com',p:'Agent@123'},{r:'SERVICE_MANAGER',e:'manager@company.com',p:'Manager@123'}];
  const fill=d=>{setEmail(d.e);setPw(d.p);setSel(d.r);setErr('');};
  const sub=e=>{e.preventDefault();if(!email||!pw){setErr('Enter credentials');return;}setL(true);setTimeout(()=>{const u=USERS.find(x=>x.email===email&&x.pw===pw);if(!u){setErr('Invalid credentials');setL(false);return;}onLogin(u);},600);};
  return <div style={{minHeight:'100vh',display:'flex',background:C.bg}}>
    <div style={{width:'42%',background:'linear-gradient(150deg,#0D1B2A,#0F2540 60%,#1A3A6C)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:40,overflow:'hidden',position:'relative'}}>
      <div style={{position:'absolute',top:-60,left:-60,width:260,height:260,borderRadius:'50%',background:'rgba(37,99,235,0.07)'}}/>
      <div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:36,height:36,borderRadius:8,background:C.primary,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>⚡</div><div><div style={{fontSize:17,fontWeight:800,color:'#fff'}}>ITSM<span style={{color:'#60A5FA'}}>Pro</span></div><div style={{fontSize:8,color:'#475569',letterSpacing:'0.1em',textTransform:'uppercase'}}>Enterprise Service Mgmt</div></div></div></div>
      <div>
        <div style={{fontSize:10,fontWeight:700,color:C.success,letterSpacing:'0.1em',marginBottom:6}}>✅ Part 3 Live</div>
        <h1 style={{fontSize:26,fontWeight:800,color:'#fff',margin:'0 0 10px',lineHeight:1.2}}>Incident & Service<br/><span style={{color:'#60A5FA'}}>Request Management</span></h1>
        {['P1–P4 Priority Incidents + SLA','Incident Assignment & Escalation','Work Notes & Activity Timeline','12-Item Service Catalog','3-Level SR Approval Workflow','Role-Based Access (All 6 Roles)','SLA Breach Alerts','Split-Panel Ticket Detail View'].map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}><div style={{width:16,height:16,borderRadius:'50%',background:'rgba(37,99,235,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><div style={{width:5,height:5,borderRadius:'50%',background:'#60A5FA'}}/></div><span style={{fontSize:11,color:'#94A3B8'}}>{f}</span></div>)}
      </div>
      <div style={{display:'flex',gap:20,borderTop:'1px solid rgba(255,255,255,0.07)',paddingTop:16}}>{[['8','Open Incidents'],['5','SR Pending'],['12','Catalog Items']].map(([v,l])=><div key={l}><div style={{fontSize:16,fontWeight:800,color:'#fff'}}>{v}</div><div style={{fontSize:10,color:'#475569'}}>{l}</div></div>)}</div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 50px'}}>
      <div style={{width:'100%',maxWidth:380}}>
        <h2 style={{fontSize:22,fontWeight:800,color:C.t1,margin:'0 0 4px'}}>Sign In</h2>
        <p style={{fontSize:12,color:C.t2,margin:'0 0 18px'}}>ITSM Pro — Part 3</p>
        <div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:18}}>
          <p style={{fontSize:9,fontWeight:800,color:C.t3,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 7px'}}>Quick Login</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {DEMOS.map(d=>{const m=ROLE_META[d.r];const a=sel===d.r;return <button key={d.r} onClick={()=>fill(d)} style={{padding:'3px 8px',borderRadius:20,fontSize:10,fontWeight:700,border:`1px solid ${a?m.color:m.border}`,background:a?m.bg:'#fff',color:a?m.color:C.t2,cursor:'pointer'}}>{m.label}</button>;})}
          </div>
        </div>
        <form onSubmit={sub} style={{display:'flex',flexDirection:'column',gap:11}}>
          <Input label="Email" type="email" value={email} onChange={setEmail} required placeholder="you@company.com"/>
          <Input label="Password" type="password" value={pw} onChange={setPw} required placeholder="Password"/>
          {err&&<div style={{padding:'8px 11px',background:C.dangerLt,border:`1px solid #FECACA`,borderRadius:6,fontSize:12,color:C.danger}}>⚠ {err}</div>}
          <Btn type="submit" size="lg" disabled={loading} sx={{width:'100%',justifyContent:'center',marginTop:3}}>{loading?'Signing in…':'Sign In →'}</Btn>
        </form>
      </div>
    </div>
  </div>;
};

// ─── MAIN APP ─────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[incidents,setIncidents]=useState(SEED_INC);
  const[serviceReqs,setServiceReqs]=useState(SEED_SR);
  const[active,setActive]=useState('dashboard');
  const[col,setCol]=useState(false);
  const[toasts,setToasts]=useState([]);

  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);};
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome, ${u.name}!`);};
  const logout=()=>{setUser(null);setActive('dashboard');};

  if(!user)return <Login onLogin={login}/>;

  const sw=col?56:228;
  const render=()=>{
    if(active==='dashboard')return <Dashboard user={user} incidents={incidents} serviceReqs={serviceReqs}/>;
    if(active==='incidents')return <IncidentModule me={user} users={USERS} incidents={incidents} setIncidents={setIncidents} addToast={addToast}/>;
    if(active==='service_req')return <ServiceReqModule me={user} users={USERS} serviceReqs={serviceReqs} setServiceReqs={setServiceReqs} addToast={addToast}/>;
    return <Shell module={active}/>;
  };

  return <div style={{display:'flex',minHeight:'100vh'}} onClick={()=>{}}>
    <Sidebar user={user} active={active} onNav={m=>setActive(m)} col={col} setCol={setCol}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <Header user={user} active={active} incidents={incidents} serviceReqs={serviceReqs} onLogout={logout} onNav={m=>setActive(m)}/>
      <main style={{flex:1,overflowY:'auto',overflow:'hidden'}}>{render()}</main>
    </div>
    <Toast toasts={toasts} rem={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
