  {id:'KB-00001',title:'How to Reset Your Windows Password',category:'How-To',productArea:'Access & Identity',status:'Published',author:'u4',reviewer:'u2',created:daysAgo(120),updated:daysAgo(5),views:342,helpful:89,notHelpful:4,tags:['password','windows','self-service'],featured:true,internal:false,
   content:`## Overview
This article explains how to reset your Windows login password using the company self-service portal.

## Prerequisites
- Access to your registered mobile phone or backup email
- Company network access or VPN connected

## Steps

### Method 1: Self-Service Password Reset Portal
1. Navigate to **https://passwordreset.company.com**
2. Enter your company email address and click **Next**
3. Select your verification method (SMS or backup email)
4. Enter the 6-digit code you receive
5. Create a new password meeting the requirements below
6. Click **Reset Password** and wait for confirmation

### Method 2: Helpdesk Assisted Reset
If the self-service portal is unavailable, contact the IT Helpdesk:
- **Phone:** Ext. 4357 (HELP)
- **Email:** helpdesk@company.com
- **Hours:** Mon–Fri 8AM–6PM

## Password Requirements
- Minimum **12 characters**
- At least one **uppercase** letter
- At least one **number**
- At least one **special character** (!@#$%^&*)
- Cannot reuse last **10 passwords**

## Troubleshooting
**Issue:** Verification code not received
**Fix:** Check spam folder. Wait 2 minutes and retry. Ensure your mobile number is up to date in HR portal.

- Unlocking a Locked Account`,

  {id:'KB-00002',title:'VPN Setup and Troubleshooting Guide',category:'Troubleshooting',productArea:'Network & VPN',status:'Published',author:'u8',reviewer:'u6',created:daysAgo(90),updated:daysAgo(2),views:521,helpful:134,notHelpful:12,tags:['vpn','remote','cisco','anyconnect'],featured:true,internal:false,
   content:`## Overview
This guide covers installing Cisco AnyConnect VPN, connecting for the first time, and resolving common connection issues.

## Installation

### Windows
1. Download the AnyConnect installer from the IT Self-Service portal
2. Run **AnyConnect_Setup.exe** as Administrator
3. Accept the license agreement and install with default settings
4. Restart your computer when prompted

### macOS
1. Download **AnyConnect.dmg** from the portal
2. Open the DMG and run the installer package
3. Grant the required system permissions in Security & Privacy settings
4. Restart when prompted

## Connecting
1. Open **Cisco AnyConnect Secure Mobility Client**
2. Enter server address: **vpn.company.com**
3. Click **Connect**
4. Enter your company email and password
5. Approve the MFA push notification on your phone

## Common Issues

### VPN Drops Intermittently
- Check your internet connection stability
- Try switching from Wi-Fi to wired Ethernet
- Change AnyConnect preferences: set **Reconnect after resume** to Enabled
- Workaround: Set session timeout to 60 mins in preferences

### Authentication Failing
- Ensure your password hasn't expired (check at portal.company.com)
- Verify MFA app is synchronized (time drift > 30s causes failures)
- Clear AnyConnect credential cache: Preferences → Clear Saved Passwords

### Split Tunneling
- Only company traffic goes through VPN by default
- For full tunnel mode, raise a Service Request

- MFA Setup Guide
- Remote Work Policy`,

  {id:'KB-00003',title:'Multi-Factor Authentication (MFA) Setup',category:'How-To',productArea:'Access & Identity',status:'Published',author:'u5',reviewer:'u2',created:daysAgo(100),updated:daysAgo(10),views:287,helpful:94,notHelpful:6,tags:['mfa','authenticator','security','2fa'],featured:false,internal:false,
   content:`## Overview
Multi-Factor Authentication adds a second layer of security to your account. This guide shows you how to set up MFA using Microsoft Authenticator.

## Installing Microsoft Authenticator
1. On your mobile device, open the **App Store** (iOS) or **Google Play** (Android)
2. Search for and install **Microsoft Authenticator**
3. Open the app and tap **Add account**

- Tap **Approve** to authenticate

- If codes fail, ensure your phone's clock is accurate (auto time enabled)

  {id:'KB-00004',title:'Exchange Email Server Outage — SSL Certificate Issue',category:'Troubleshooting',productArea:'Email & Office 365',status:'Published',author:'u5',reviewer:'u6',created:daysAgo(3),updated:daysAgo(1),views:156,helpful:67,notHelpful:2,tags:['email','exchange','ssl','outage','known-error'],featured:false,internal:false,
   content:`## Incident Summary
On [DATE], the company Exchange email server experienced a complete outage caused by an expired SSL certificate. This KB documents the root cause, resolution, and prevention steps.

## Root Cause
The SSL certificate auto-renewal process failed due to Let's Encrypt rate limiting. The load balancer session persistence was also misconfigured, causing cascading failures.

**KEDB Reference:** KEDB-00001

## Resolution Applied
1. Manually renewed SSL certificate via DigiCert management console
2. Updated IIS SSL binding on Exchange server
3. Restarted Exchange Transport service
4. Reconfigured load balancer session affinity settings

## Workaround (if issue recurs)
1. Log in to Exchange Admin Center: https://exchange-admin.company.com
2. Navigate to Servers → Certificates
3. Renew the expired certificate (Assign role: IIS, SMTP, IMAP)
4. Run: \`Restart-Service MSExchangeTransport\` in PowerShell as Admin
5. Test mail flow via Send Connector Test

## Prevention
- Certificate monitoring alert added: 60 days advance warning
- Auto-renewal script deployed with fallback manual renewal job
- Change CHG-00002 implemented to prevent recurrence

## Related
- PRB-00001: Email server recurring outages
- CHG-00002: Emergency SSL renewal`,
   linkedIncidents:['INC-00001'],relatedKB:[],feedback:[]},

  {id:'KB-00005',title:'IT Security Policy — Acceptable Use',category:'Policy',productArea:'Security',status:'Published',author:'u2',reviewer:'u1',created:daysAgo(200),updated:daysAgo(30),views:203,helpful:78,notHelpful:8,tags:['policy','security','acceptable-use'],featured:false,internal:false,
   content:`## Purpose
This policy defines the acceptable use of company IT resources including computers, networks, email, and internet access.

## Scope
Applies to all employees, contractors, and third parties with access to company IT systems.

## Acceptable Use
**You MAY:**
- Use company devices for work-related activities
- Access the internet for business purposes
- Use company email for professional communication
- Store work files on approved cloud storage (OneDrive, SharePoint)

**You MAY NOT:**
- Install unauthorized software without IT approval
- Share login credentials with anyone
- Access or attempt to access systems you are not authorized to use
- Store sensitive data on personal devices or unapproved cloud services
- Use company resources for commercial activities or personal gain

## Password Policy
- Minimum 12 characters, mix of upper/lower/numbers/symbols
- Change passwords every 90 days
- Never reuse last 10 passwords
- MFA required for all remote access

## Incident Reporting
Report any security concerns immediately:
- Email: security@company.com
- Phone: Ext. 4357 after hours
- Suspicious emails: Forward to phishing@company.com

## Violations
Policy violations may result in disciplinary action up to and including termination.`,

  {id:'KB-00006',title:'Laptop Overheating After Windows Update KB5034439',category:'Troubleshooting',productArea:'Windows',status:'Published',author:'u5',reviewer:'u4',created:daysAgo(7),updated:daysAgo(1),views:89,helpful:41,notHelpful:3,tags:['laptop','overheating','windows-update','dell','known-error'],featured:false,internal:false,
   content:`## Problem Description
Dell Latitude 5540 laptops experience overheating and random shutdowns after installing Windows Update KB5034439.

**KEDB Reference:** KEDB-00002

## Root Cause
The KB5034439 update modifies power management settings and disables Intel fan speed throttling on Dell Latitude 5540 models. This is a known Intel/Dell driver conflict.

## Affected Models
- Dell Latitude 5540 (all configurations)
- Possibly: Dell Latitude 5440 (under investigation)

## Immediate Workaround
1. Press **Win + X** → **Settings** → **Windows Update** → **Update history**
2. Click **Uninstall Updates**
3. Find **KB5034439** and click **Uninstall**
4. When prompted, restart your computer
5. After restart, go to Power Options → Select **Balanced** (not High Performance)

## Temporary Prevention
To prevent KB5034439 from reinstalling automatically:
1. Open PowerShell as Administrator
2. Run: \`wusa /uninstall /kb:5034439 /quiet /norestart\`
3. Then: \`$HideUpdates = New-Object -ComObject "Microsoft.Update.Session"\`
   (Contact helpdesk to apply the update block via Group Policy)

## Permanent Fix
Dell has confirmed a driver update is in progress. ETA: 2 weeks.
IT will push the corrected driver via WSUS once available. You will be notified.

## Related
- PRB-00003: Laptop overheating after Windows Update
- INC-00004: Laptop overheating and shutting down`,
   linkedIncidents:['INC-00004'],relatedKB:[],feedback:[]},

  {id:'KB-00008',title:'Conference Room AV Troubleshooting',category:'Troubleshooting',productArea:'Hardware',status:'Published',author:'u5',reviewer:'u4',created:daysAgo(60),updated:daysAgo(15),views:178,helpful:92,notHelpful:7,tags:['conference','av','projector','teams','display'],featured:false,internal:false,
   content:`## Common AV Issues and Fixes

### Teams/Zoom Screen Share Not Working
1. Check HDMI/USB-C cable is firmly connected
2. Press the **Source** button on the room controller to select the correct input
3. In Teams: click Share → select your screen or window
4. If laptop not detected: unplug and reconnect the cable
5. Try a different cable from the cabinet drawer

### No Sound from Speakers
1. Check room volume isn't muted (button on wall panel)
2. Ensure the correct audio output is selected on your laptop (Bluetooth vs room speakers)
3. Press and hold the room controller power button for 3 seconds to reset AV system

### Projector/Screen Not Turning On
1. Press the **Power** button on the ceiling-mounted remote (ask reception for access)
2. Wait 60 seconds for warmup
3. If nothing: check the power strip behind the projector panel is switched on

### Remote Participants Can't See You
1. Ensure the conference camera is powered on (green light on front)
2. Check Teams/Zoom camera permissions in your laptop settings
3. Try: unplug and replug the USB camera cable

## Booking AV Support
For scheduled events, book AV support 24 hours in advance:
Email: av-support@company.com with room, date, time, and requirements.`,

  {id:'KB-00010',title:'Monthly Windows Patching Schedule and Policy',category:'Policy',productArea:'Windows',status:'Published',author:'u11',reviewer:'u2',created:daysAgo(150),updated:daysAgo(14),views:67,helpful:38,notHelpful:4,tags:['patching','windows-update','policy','maintenance'],featured:false,internal:false,
   content:`## Patching Schedule

### Production Servers
- **Cycle:** Second Tuesday of each month (Patch Tuesday + 1 week delay)
- **Window:** Saturday 11PM – Sunday 4AM
- **Notice:** 5 business days advance notice via email

### Non-Production Servers
- **Cycle:** Third week of each month
- **Window:** Any weeknight 10PM – 6AM
- **Related Change:** CHG-00003

### End-User Devices (Laptops/Desktops)
- **Cycle:** Monthly, pushed via WSUS
- **Window:** Patches pushed Friday afternoon
- **Reboot:** Required within 5 days — you will receive reminders

## What Gets Patched
- Windows Security Updates (Critical and Important)
- Microsoft Office updates
- .NET Framework updates
- Edge/IE Cumulative updates

## Exceptions Process
If a patch causes issues (e.g., KB5034439 — see KB-00006), contact the helpdesk to:
1. Uninstall the problematic patch
2. Raise a problem record (PRB)
3. Request a patch block via Group Policy

## Emergency Patches
Critical zero-day patches may be deployed outside the schedule with 2-hour notice.

## Related
- KB-00006: Laptop overheating after KB5034439
- CHG-00003: Monthly server patching`,

   content:`## INTERNAL USE ONLY — IT Staff Only

  {id:'KB-00012',title:'Phishing Email — How to Identify and Report',category:'Best Practice',productArea:'Security',status:'Published',author:'u8',reviewer:'u1',created:daysAgo(25),updated:daysAgo(5),views:198,helpful:107,notHelpful:3,tags:['phishing','security','email','scam'],featured:true,internal:false,
   content:`## How to Spot a Phishing Email

### Red Flags
- **Sender address mismatch:** Display name says "IT Support" but email is from gmail.com or odd domain
- **Urgency:** "Your account will be locked in 24 hours" or "Immediate action required"
- **Links:** Hover over links — if the URL looks different from what it says, don't click
- **Attachments:** Unexpected attachments, especially .exe, .zip, .docm files
- **Grammar:** Poor spelling, odd formatting, generic greetings ("Dear Customer")
- **Credential requests:** Legitimate IT will NEVER ask for your password by email

### Real vs Fake
| Legitimate IT Email | Phishing |
|---------------------|----------|
| From @company.com | From external domain |
| Asks you to use IT Portal | Asks you to click a link |
| No attachment | Suspicious attachment |
| You requested it | Unsolicited |

## If You Receive a Suspicious Email
1. **Do NOT click any links or download attachments**
2. Forward the email to: **phishing@company.com**
3. Delete the original email
4. If you clicked a link: **call helpdesk immediately** (Ext. 4357)

## If You Clicked a Phishing Link
1. **Disconnect from network** (unplug Ethernet, disable Wi-Fi)
2. Call helpdesk: Ext. 4357 — do NOT email
3. Do not use the device until cleared by IT Security

              <span style={{fontSize:11,fontWeight:800,color:pctVal>=90?C.success:pctVal>=80?C.warning:C.danger}}>{pctVal}%</span>
            </div>
            <div style={{height:6,background:'#F1F5F9',borderRadius:3,position:'relative'}}>
              <div style={{height:6,borderRadius:3,background:pctVal>=90?C.success:pctVal>=80?C.warning:C.danger,width:`${pctVal}%`,transition:'width .7s'}}/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:2}}>
              <span style={{fontSize:9,color:C.t3}}>{v.within}/{v.total} within SLA</span>
              <span style={{fontSize:9,color:C.danger}}>{v.breached} breached</span>
            </div>
          </div>;})}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14,flex:1}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>🔥 Featured KB Articles</div>
          {featured.map(a=><div key={a.id} style={{display:'flex',gap:8,marginBottom:8,paddingBottom:8,borderBottom:`1px solid ${C.borderFaint}`,cursor:'pointer'}} >
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:2}}>{a.title}</div>
              <div style={{display:'flex',gap:7}}>
                <span style={{fontSize:9,color:C.t3}}>{a.views} views</span>
                <span style={{fontSize:9,color:C.success}}>👍 {a.helpful}</span>
                <Tag label={a.category} color={C.t2} bg='#F1F5F9'/>
              </div>
            </div>
          </div>)}
        </div>

        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:8}}>Recent SLA Breaches</div>
          {SLA_PERF.recentBreaches.map((b,i)=><div key={i} style={{display:'flex',gap:8,marginBottom:7,paddingBottom:7,borderBottom:`1px solid ${C.borderFaint}`}}>
            <div style={{flex:1}}>
              <div style={{display:'flex',gap:5,alignItems:'center',marginBottom:2}}>
                <span style={{fontFamily:'monospace',fontSize:10,color:C.danger,fontWeight:800}}>{b.id}</span>
                <span style={{fontSize:9,fontWeight:700,color:C.danger,background:C.dangerLt,padding:'1px 5px',borderRadius:20}}>+{b.breachedBy}</span>
              </div>
              <div style={{fontSize:10,color:C.t2}}>{b.type} SLA · {b.agent}</div>
              <div style={{fontSize:9,color:C.t3}}>{b.at}</div>
            </div>
          </div>)}
        </div>
      </div>
    </div>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// KNOWLEDGE BASE MODULE
// ══════════════════════════════════════════════════════════════
const KBModule=({me,articles,setArticles,addToast})=>{
  const[tab,setTab]=useState('browse');
  const[selected,setSelected]=useState(null);
  const[showNew,setSN]=useState(false);
  const[search,setSearch]=useState('');
  const[fCat,setFC]=useState('All');
  const[fArea,setFA]=useState('');
  const[fStatus,setFS]=useState(me.role==='EMPLOYEE'?'Published':'');
  const[fInternal,setFI]=useState('');
  const canEdit=['AGENT','HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return articles.filter(a=>{
      const statusOk=me.role==='EMPLOYEE'?a.status==='Published'&&!a.internal:(!fStatus||a.status===fStatus)&&(fInternal===''||String(a.internal)===(fInternal==='internal'?'true':'false'));
      return(!q||a.title.toLowerCase().includes(q)||a.content.toLowerCase().includes(q)||(a.tags||[]).some(t=>t.includes(q)))
        &&(fCat==='All'||a.category===fCat)&&(!fArea||a.productArea===fArea)&&statusOk;
    }).sort((a,b)=>b.views-a.views);
  },[articles,search,fCat,fArea,fStatus,fInternal,me]);

  const recordView=useCallback(art=>{
    setArticles(prev=>prev.map(a=>a.id===art.id?{...a,views:a.views+1}:a));
    setSelected({...art,views:art.views+1});
  },[setArticles]);

  const submitFeedback=(art,helpful)=>{
    const field=helpful?'helpful':'notHelpful';
    const upd={...art,[field]:art[field]+1,feedback:[...(art.feedback||[]),{by:me.id,helpful,at:now()}]};
    setArticles(prev=>prev.map(a=>a.id===art.id?upd:a));
    setSelected(upd);
    addToast('success',helpful?'Thanks for the positive feedback!':'Feedback recorded — we\'ll improve this article');
  };

  const ArticleCard=({a,compact=false})=>{
    const author=USERS.find(u=>u.id===a.author);
    return <div onClick={()=>recordView(a)} style={{background:C.card,borderRadius:8,border:`1px solid ${selected?.id===a.id?C.emerald:C.border}`,padding:compact?'10px 12px':'13px 14px',cursor:'pointer',transition:'all .15s',borderLeft:compact?`3px solid ${C.emerald}`:`3px solid ${a.internal?C.orange:C.emerald}`}}
      onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)';}} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:5,alignItems:'center'}}>
        <span style={{fontFamily:'monospace',fontSize:9,color:C.t3}}>{a.id}</span>
        <Tag label={a.category} color={C.emerald} bg={C.emeraldLt}/>
        <Tag label={a.productArea} color={C.t2} bg='#F1F5F9'/>
        {a.internal&&<Tag label="🔒 Internal" color={C.orange} bg={C.orangeLt}/>}
        {a.featured&&<Tag label="⭐ Featured" color={C.warning} bg={C.warningLt}/>}
        {a.status!=='Published'&&<span style={{fontSize:9,fontWeight:700,color:C.warning,background:C.warningLt,padding:'2px 6px',borderRadius:20}}>{a.status}</span>}
      </div>
      <div style={{fontSize:13,fontWeight:700,color:C.t1,marginBottom:compact?0:4,lineHeight:1.3}}>{a.title}</div>
      {!compact&&<div style={{display:'flex',gap:12,marginTop:5,flexWrap:'wrap'}}>
        <span style={{fontSize:10,color:C.t3}}>👁 {a.views}</span>
        <span style={{fontSize:10,color:C.success}}>👍 {a.helpful}</span>
        {a.helpful+a.notHelpful>0&&<span style={{fontSize:10,color:C.t3}}>{Math.round(a.helpful/(a.helpful+a.notHelpful)*100)}% helpful</span>}
        <span style={{fontSize:10,color:C.t3}}>Updated {a.updated}</span>
        {author&&<span style={{fontSize:10,color:C.t3}}>by {author.name}</span>}
      </div>}
    </div>;
  };

  // Render markdown-like content
  const renderContent=content=>{
    if(!content)return null;
    const lines=content.split('\n');
    return lines.map((line,i)=>{
      if(line.startsWith('## '))return <h3 key={i} style={{fontSize:14,fontWeight:800,color:C.t1,margin:'16px 0 7px',borderBottom:`1px solid ${C.border}`,paddingBottom:4}}>{line.slice(3)}</h3>;
      if(line.startsWith('### '))return <h4 key={i} style={{fontSize:12,fontWeight:700,color:C.t1,margin:'12px 0 5px'}}>{line.slice(4)}</h4>;
      if(line.startsWith('**')&&line.endsWith('**'))return <p key={i} style={{fontSize:12,fontWeight:700,color:C.t1,margin:'6px 0'}}>{line.slice(2,-2)}</p>;
      if(line.match(/^\d+\. /))return <div key={i} style={{fontSize:12,color:C.t1,margin:'3px 0',paddingLeft:16,display:'flex',gap:8,lineHeight:1.6}}><span style={{color:C.emerald,fontWeight:700,flexShrink:0}}>{line.match(/^\d+/)[0]}.</span><span dangerouslySetInnerHTML={{__html:line.replace(/^\d+\. /,'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code style="background:#F1F5F9;padding:1px 5px;borderRadius:3px;fontSize:11px;fontFamily:monospace">$1</code>')}}/></div>;
      if(line.startsWith('- '))return <div key={i} style={{fontSize:12,color:C.t1,margin:'3px 0',paddingLeft:16,display:'flex',gap:8,lineHeight:1.6}}><span style={{color:C.emerald,flexShrink:0}}>•</span><span dangerouslySetInnerHTML={{__html:line.slice(2).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code style="background:#F1F5F9;padding:1px 5px;borderRadius:3px;fontSize:11px;fontFamily:monospace">$1</code>')}}/></div>;
      if(line.startsWith('- [ ]')||line.startsWith('- [x]'))return <div key={i} style={{fontSize:12,color:C.t1,margin:'3px 0',paddingLeft:16,display:'flex',gap:8,lineHeight:1.6,alignItems:'flex-start'}}><span style={{color:C.emerald,flexShrink:0}}>{line.includes('[x]')?'☑':'☐'}</span><span>{line.replace(/^- \[.\] /,'')}</span></div>;
      if(line.startsWith('|')&&line.includes('|'))return null;
      if(line.match(/^[-|]+$/))return null;
      if(line.startsWith('```'))return <div key={i} style={{background:'#1E293B',borderRadius:6,padding:'10px 12px',margin:'8px 0',fontFamily:'monospace',fontSize:11,color:'#E2E8F0',lineHeight:1.6,overflowX:'auto'}}>{lines[i+1]}</div>;
      if(line===''&&i>0&&lines[i-1]!=='')return <div key={i} style={{height:8}}/>;
      if(line.startsWith('#'))return null;
      if(line==='')return null;
      const formatted=line.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code style="background:#F1F5F9;padding:1px 5px;borderRadius:3px;fontSize:11px;fontFamily:monospace">$1</code>');
      return <p key={i} style={{fontSize:12,color:C.t1,margin:'4px 0',lineHeight:1.7}} dangerouslySetInnerHTML={{__html:formatted}}/>;
    });
  };

  const NewArticleForm=()=>{
    const[f,setF]=useState({title:'',category:'How-To',productArea:KB_PROD_AREAS[0],status:'Draft',internal:false,featured:false,tags:'',content:''});
    const[errs,setErrs]=useState({});
    const ff=k=>v=>setF(p=>({...p,[k]:v}));
    const submit=()=>{
      const e={};if(!f.title.trim())e.title='Required';if(!f.content.trim())e.content='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      const na={id:genId('KB'),title:f.title,category:f.category,productArea:f.productArea,status:f.status,author:me.id,reviewer:null,created:today(),updated:today(),views:0,helpful:0,notHelpful:0,tags:f.tags.split(',').map(t=>t.trim()).filter(Boolean),featured:f.featured,internal:f.internal,content:f.content,linkedIncidents:[],relatedKB:[],feedback:[]};
      setArticles(p=>[na,...p]);addToast('success',`${na.id} created — ${f.status}`);setSN(false);
    };
    return <div style={{display:'flex',flexDirection:'column',gap:11}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Input label="Article Title" value={f.title} onChange={ff('title')} required error={errs.title} sx={{gridColumn:'1/-1'}} placeholder="Clear, searchable title…"/>
        <Sel label="Category" value={f.category} onChange={ff('category')} opts={KB_CATS.filter(c=>c!=='All').map(c=>({v:c,l:c}))} required/>
        <Sel label="Product Area" value={f.productArea} onChange={ff('productArea')} opts={KB_PROD_AREAS.map(a=>({v:a,l:a}))} required/>
        <Input label="Tags (comma-separated)" value={f.tags} onChange={ff('tags')} placeholder="vpn, remote, cisco…" sx={{gridColumn:'1/-1'}}/>
        <Sel label="Status" value={f.status} onChange={ff('status')} opts={KB_STATUS.map(s=>({v:s,l:s}))}/>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:10,fontWeight:700,color:C.t2,textTransform:'uppercase',letterSpacing:'0.04em'}}>Options</label>
          <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12,color:C.t1,cursor:'pointer'}}><input type="checkbox" checked={f.internal} onChange={e=>ff('internal')(e.target.checked)}/> Internal Only (staff only)</label>
          <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12,color:C.t1,cursor:'pointer'}}><input type="checkbox" checked={f.featured} onChange={e=>ff('featured')(e.target.checked)}/> Feature on homepage</label>
        </div>
      </div>
      <Textarea label="Content (Markdown supported)" value={f.content} onChange={ff('content')} required rows={12} placeholder="## Overview&#10;&#10;## Steps&#10;1. First step&#10;&#10;## Troubleshooting…" sx={{}}/>
      {errs.content&&<span style={{fontSize:10,color:C.danger}}>{errs.content}</span>}
      <div style={{display:'flex',justifyContent:'flex-end',gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSN(false)}>Cancel</Btn>
        <Btn variant="ghost" onClick={()=>{ff('status')('Draft');submit();}}>Save Draft</Btn>
        <Btn variant="emerald" onClick={submit}>Publish Article</Btn>
      </div>
    </div>;
  };

  const isEmployee=me.role==='EMPLOYEE';

  return <div style={{display:'flex',height:'calc(100vh - 50px)'}}>
    {/* Left: list/browse */}
    <div style={{flex:1,overflowY:'auto',padding:'16px 18px',borderRight:selected?`1px solid ${C.border}`:'none',minWidth:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>Knowledge Base</h2><p style={{fontSize:10,color:C.t2,margin:0}}>{filtered.length} articles · {articles.reduce((s,a)=>s+a.views,0).toLocaleString()} total views</p></div>
        {canEdit&&<Btn icon="+" variant="emerald" onClick={()=>setSN(true)}>New Article</Btn>}
      </div>

      {/* Search bar */}
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',marginBottom:12,display:'flex',gap:8,alignItems:'center'}}>
        <span style={{fontSize:16}}>🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search articles, tags, content…" style={{flex:1,border:'none',outline:'none',fontSize:13,color:C.t1,background:'transparent'}}/>
        {search&&<button onClick={()=>setSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:C.t3,fontSize:16}}>×</button>}
      </div>

      {/* Filter row */}
      <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
        {KB_CATS.map(cat=><button key={cat} onClick={()=>setFC(cat)} style={{padding:'4px 11px',borderRadius:20,border:`1px solid ${fCat===cat?C.emerald:C.border}`,background:fCat===cat?C.emeraldLt:'transparent',color:fCat===cat?C.emerald:C.t2,fontSize:11,fontWeight:fCat===cat?700:400,cursor:'pointer',transition:'all .15s'}}>{cat}</button>)}
      </div>

      {!isEmployee&&<div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
        <Sel value={fArea} onChange={setFA} opts={[{v:'',l:'All Areas'},...KB_PROD_AREAS.map(a=>({v:a,l:a}))]} sx={{minWidth:140}}/>
        <Sel value={fStatus} onChange={setFS} opts={[{v:'',l:'All Status'},...KB_STATUS.map(s=>({v:s,l:s}))]} sx={{minWidth:120}}/>
        <Sel value={fInternal} onChange={setFI} opts={[{v:'',l:'All Visibility'},{v:'public',l:'Public'},{v:'internal',l:'Internal'}]} sx={{minWidth:130}}/>
        {(fArea||fStatus||fInternal)&&<Btn variant="outline" size="sm" onClick={()=>{setFA('');setFS('');setFI('');}}>Clear ×</Btn>}
      </div>}

      {filtered.length===0&&<div style={{padding:50,textAlign:'center',color:C.t3}}>
        <div style={{fontSize:36,marginBottom:10}}>📭</div>
        <div style={{fontSize:13,fontWeight:700,color:C.t2}}>No articles found</div>
        <div style={{fontSize:11,color:C.t3,marginTop:3}}>Try different keywords or filters</div>
      </div>}
      <div style={{display:'flex',flexDirection:'column',gap:7}}>
        {filtered.map(a=><ArticleCard key={a.id} a={a}/>)}
      </div>
    </div>

    {/* Right: article detail */}
    {selected&&<div style={{width:520,flexShrink:0,background:C.card,display:'flex',flexDirection:'column',animation:'slideIn .2s ease',borderLeft:`1px solid ${C.border}`}}>
      <div style={{padding:'12px 16px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{fontFamily:'monospace',fontSize:10,color:C.t3}}>{selected.id}</span>
          <Tag label={selected.category} color={C.emerald} bg={C.emeraldLt}/>
          {selected.internal&&<Tag label="🔒 Internal" color={C.orange} bg={C.orangeLt}/>}
          {selected.status!=='Published'&&<span style={{fontSize:9,color:C.warning,background:C.warningLt,padding:'2px 6px',borderRadius:20,fontWeight:700}}>{selected.status}</span>}
        </div>
        <button onClick={()=>setSelected(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:C.t3}}>×</button>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:18}}>
        <h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 8px',lineHeight:1.3}}>{selected.title}</h2>

        <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:12,paddingBottom:12,borderBottom:`1px solid ${C.border}`}}>
          <span style={{fontSize:11,color:C.t3}}>👁 {selected.views} views</span>
          <span style={{fontSize:11,color:C.success}}>👍 {selected.helpful} helpful</span>
          <span style={{fontSize:11,color:C.t3}}>Updated {selected.updated}</span>
          {USERS.find(u=>u.id===selected.author)&&<span style={{fontSize:11,color:C.t3}}>by {USERS.find(u=>u.id===selected.author)?.name}</span>}
        </div>

        {/* Tags */}
        {selected.tags?.length>0&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:12}}>
          {selected.tags.map(t=><Tag key={t} label={`#${t}`} color={C.primary} bg={C.primaryLt}/>)}
        </div>}

        {/* Content */}
        <div style={{lineHeight:1.7}}>{renderContent(selected.content)}</div>

        {/* Related */}
        {selected.relatedKB?.length>0&&<div style={{marginTop:16,padding:'11px 13px',background:'#F8FAFC',borderRadius:7,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,fontWeight:700,color:C.t2,marginBottom:7,textTransform:'uppercase',letterSpacing:'0.05em'}}>Related Articles</div>
          {selected.relatedKB.map(id=>{const rel=articles.find(a=>a.id===id);if(!rel)return null;return <div key={id} onClick={()=>recordView(rel)} style={{fontSize:12,color:C.emerald,fontWeight:600,cursor:'pointer',marginBottom:3,display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:10}}>→</span>{rel.title}
          </div>;})}
        </div>}

        {/* Linked incidents */}
        {selected.linkedIncidents?.length>0&&<div style={{marginTop:10,padding:'9px 11px',background:C.dangerLt,borderRadius:7,border:`1px solid #FECACA`}}>
          <div style={{fontSize:10,fontWeight:700,color:C.danger,marginBottom:4}}>LINKED INCIDENTS</div>
          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
            {selected.linkedIncidents.map(id=><Tag key={id} label={id} color={C.danger} bg={C.dangerLt}/>)}
          </div>
        </div>}

        {/* Feedback */}
        {selected.status==='Published'&&<div style={{marginTop:16,padding:'12px 14px',background:'#F8FAFC',borderRadius:8,border:`1px solid ${C.border}`,textAlign:'center'}}>
          <div style={{fontSize:12,fontWeight:700,color:C.t1,marginBottom:8}}>Was this article helpful?</div>
          <div style={{display:'flex',gap:8,justifyContent:'center'}}>
            {selected.feedback?.some(f=>f.by===me.id)
              ?<div style={{fontSize:12,color:C.success,fontWeight:600}}>✓ Thanks for your feedback!</div>
              :<><Btn size="sm" variant="success" icon="👍" onClick={()=>submitFeedback(selected,true)}>Yes ({selected.helpful})</Btn>
                <Btn size="sm" variant="outline" icon="👎" onClick={()=>submitFeedback(selected,false)}>No ({selected.notHelpful})</Btn></>}
          </div>
        </div>}

        {/* Edit controls for staff */}
        {canEdit&&<div style={{marginTop:12,display:'flex',gap:7}}>
          {selected.status==='Draft'&&<Btn size="sm" variant="emerald" onClick={()=>{const u={...selected,status:'Published',updated:today()};setArticles(p=>p.map(a=>a.id===u.id?u:a));setSelected(u);addToast('success','Article published');}}>Publish</Btn>}
          {selected.status==='Published'&&<Btn size="sm" variant="warning" onClick={()=>{const u={...selected,status:'Archived',updated:today()};setArticles(p=>p.map(a=>a.id===u.id?u:a));setSelected(u);addToast('info','Article archived');}}>Archive</Btn>}
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:C.t2,cursor:'pointer',padding:'4px 10px',border:`1px solid ${C.border}`,borderRadius:6}}>
            <input type="checkbox" checked={selected.featured||false} onChange={e=>{const u={...selected,featured:e.target.checked};setArticles(p=>p.map(a=>a.id===u.id?u:a));setSelected(u);}}/> Featured
          </label>
        </div>}
      </div>
    </div>}

    <Modal open={showNew} title="Create KB Article" onClose={()=>setSN(false)} width={700}><NewArticleForm/></Modal>
  </div>;
};

// ══════════════════════════════════════════════════════════════
// SLA & ESCALATION MODULE
// ══════════════════════════════════════════════════════════════
const SLAModule=({me,slaPolices,setSLAPolices,escRules,setEscRules,addToast})=>{
  const[tab,setTab]=useState('overview');
  const[selectedPolicy,setSP]=useState(null);
  const[showNewPol,setSNP]=useState(false);
  const[showNewEsc,setSNE]=useState(false);
  const[editPolicy,setEP]=useState(null);

  const canEdit=['SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(me.role);

  const toggleRule=id=>{
    setEscRules(p=>p.map(r=>r.id===id?{...r,active:!r.active}:r));
    addToast('success','Escalation rule updated');
  };

  const togglePolicy=id=>{
    setSLAPolices(p=>p.map(r=>r.id===id?{...r,active:!r.active}:r));
    addToast('success','SLA policy updated');
  };

  // SLA Performance Chart (SVG)
  const PerfChart=({data})=>{
    const maxH=100;const cW=60;const gap=10;const totalW=data.length*(cW+gap);const chartH=140;
    return <div style={{overflowX:'auto'}}>
      <svg width={Math.max(totalW,400)} height={chartH+40} viewBox={`0 0 ${Math.max(totalW,400)} ${chartH+40}`}>
        {data.map((d,i)=>{
          const x=i*(cW+gap)+gap;const h=(d.compliance/100)*chartH;const y=chartH-h;
          const col=d.compliance>=90?C.success:d.compliance>=80?C.warning:C.danger;
          return <g key={i}>
            <rect x={x} y={y} width={cW} height={h} rx={4} fill={col} opacity={0.7}/>
            <text x={x+cW/2} y={y-5} fontSize="11" fontWeight="700" fill={col} textAnchor="middle">{Math.round(d.compliance)}%</text>
            <text x={x+cW/2} y={chartH+16} fontSize="10" fill={C.t3} textAnchor="middle">{d.month}</text>
            <text x={x+cW/2} y={chartH+30} fontSize="9" fill={C.danger} textAnchor="middle">{d.breaches} breach</text>
          </g>;
        })}
        <line x1={0} y1={chartH} x2={Math.max(totalW,400)} y2={chartH} stroke={C.border} strokeWidth={1}/>
        <line x1={0} y1={(1-0.9)*chartH} x2={Math.max(totalW,400)} y2={(1-0.9)*chartH} stroke={C.success} strokeWidth={0.5} strokeDasharray="3 3" opacity={0.6}/>
        <text x={4} y={(1-0.9)*chartH-4} fontSize="8" fill={C.success} opacity={0.7}>90% target</text>
      </svg>
    </div>;
  };

  const NewPolicyForm=({existing})=>{
    const init=existing?{...existing}:{name:'',description:'',scope:'',tiers:{P1:{responseH:1,resolveH:4,escalateAfterH:2},P2:{responseH:2,resolveH:8,escalateAfterH:5},P3:{responseH:4,resolveH:24,escalateAfterH:16},P4:{responseH:8,resolveH:72,escalateAfterH:48}},businessHours:{enabled:true,start:'08:00',end:'18:00',timezone:'EST',excludeWeekends:true}};
    const[f,setF]=useState(init);
    const[errs,setErrs]=useState({});
    const setTier=(p,field,v)=>setF(pr=>({...pr,tiers:{...pr.tiers,[p]:{...pr.tiers[p],[field]:parseFloat(v)||0}}}));
    const submit=()=>{
      const e={};if(!f.name.trim())e.name='Required';if(!f.scope.trim())e.scope='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      if(existing){setSLAPolices(p=>p.map(x=>x.id===existing.id?{...existing,...f,updatedBy:me.id}:x));addToast('success',`Policy "${f.name}" updated`);}
      else{const np={id:genId('SLA'),...f,active:true,created:today(),updatedBy:me.id};setSLAPolices(p=>[...p,np]);addToast('success',`Policy "${f.name}" created`);}
      setSNP(false);setEP(null);
    };
    return <div style={{display:'flex',flexDirection:'column',gap:11}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <Input label="Policy Name" value={f.name} onChange={v=>setF(p=>({...p,name:v}))} required error={errs.name} sx={{gridColumn:'1/-1'}}/>
        <Textarea label="Description" value={f.description} onChange={v=>setF(p=>({...p,description:v}))} rows={2} sx={{gridColumn:'1/-1'}}/>
        <Input label="Scope / Applies To" value={f.scope} onChange={v=>setF(p=>({...p,scope:v}))} required error={errs.scope} sx={{gridColumn:'1/-1'}} placeholder="e.g. All Incidents, Production CIs only…"/>
      </div>

      <div style={{background:'#F8FAFC',borderRadius:8,border:`1px solid ${C.border}`,padding:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:10}}>SLA Targets (Hours)</div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:500}}>
            <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>
              {['Priority','First Response','Resolution','Auto-Escalate After'].map(h=><th key={h} style={{padding:'6px 10px',fontSize:10,fontWeight:700,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>{Object.entries(f.tiers||{}).map(([p,t])=>{
              const tier=SLA_TIERS[p];
              return <tr key={p} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
                <td style={{padding:'7px 10px'}}><span style={{fontSize:11,fontWeight:700,color:tier?.color}}>{tier?.icon} {p}</span></td>
                {['responseH','resolveH','escalateAfterH'].map(field=><td key={field} style={{padding:'7px 10px'}}>
                  <input type="number" value={t[field]} onChange={e=>setTier(p,field,e.target.value)} min={0.25} step={0.25} style={{width:70,padding:'5px 8px',border:`1px solid ${C.border}`,borderRadius:5,fontSize:12,color:C.t1,textAlign:'center',outline:'none'}} onFocus={e=>e.target.style.borderColor=C.primary} onBlur={e=>e.target.style.borderColor=C.border}/>
                </td>)}
              </tr>;})}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{background:'#F8FAFC',borderRadius:8,border:`1px solid ${C.border}`,padding:12}}>
        <div style={{fontSize:11,fontWeight:800,color:C.t1,marginBottom:8}}>Business Hours</div>
        <div style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr auto',gap:10,alignItems:'end'}}>
          <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12,color:C.t1,cursor:'pointer',whiteSpace:'nowrap'}}>
            <input type="checkbox" checked={f.businessHours?.enabled} onChange={e=>setF(p=>({...p,businessHours:{...p.businessHours,enabled:e.target.checked}}))}/> Business hours only
          </label>
          <Input label="Start Time" type="time" value={f.businessHours?.start||'08:00'} onChange={v=>setF(p=>({...p,businessHours:{...p.businessHours,start:v}}))} disabled={!f.businessHours?.enabled}/>
          <Input label="End Time" type="time" value={f.businessHours?.end||'18:00'} onChange={v=>setF(p=>({...p,businessHours:{...p.businessHours,end:v}}))} disabled={!f.businessHours?.enabled}/>
          <label style={{display:'flex',alignItems:'center',gap:7,fontSize:12,color:C.t1,cursor:'pointer',whiteSpace:'nowrap',paddingBottom:3}}>
            <input type="checkbox" checked={f.businessHours?.excludeWeekends} onChange={e=>setF(p=>({...p,businessHours:{...p.businessHours,excludeWeekends:e.target.checked}}))}/> Excl. weekends
          </label>
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>{setSNP(false);setEP(null);}}>Cancel</Btn>
        <Btn onClick={submit}>{existing?'Update Policy':'Create Policy'}</Btn>
      </div>
    </div>;
  };

  const NewEscRuleForm=()=>{
    const[f,setF]=useState({name:'',trigger:ESC_TRIGGERS[0],condition:'',action:ESC_ACTIONS[0],notifyUsers:[],priority:'All',slaPolicyId:slaPolices[0]?.id||''});
    const[errs,setErrs]=useState({});
    const submit=()=>{
      const e={};if(!f.name.trim())e.name='Required';if(!f.condition.trim())e.condition='Required';
      if(Object.keys(e).length){setErrs(e);return;}
      const nr={id:genId('ESC'),...f,active:true,created:today(),fireCount:0,lastFired:null};
      setEscRules(p=>[...p,nr]);addToast('success',`Escalation rule "${f.name}" created`);setSNE(false);
    };
    return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
      <Input label="Rule Name" value={f.name} onChange={v=>setF(p=>({...p,name:v}))} required error={errs.name} sx={{gridColumn:'1/-1'}}/>
      <Sel label="Trigger" value={f.trigger} onChange={v=>setF(p=>({...p,trigger:v}))} opts={ESC_TRIGGERS.map(t=>({v:t,l:t}))} required/>
      <Sel label="Action" value={f.action} onChange={v=>setF(p=>({...p,action:v}))} opts={ESC_ACTIONS.map(a=>({v:a,l:a}))} required/>
      <Textarea label="Condition" value={f.condition} onChange={v=>setF(p=>({...p,condition:v}))} required rows={2} placeholder="e.g. Ticket is P1 AND unassigned > 15 min" sx={{gridColumn:'1/-1'}} error={errs.condition}/>
      <Sel label="Priority" value={f.priority} onChange={v=>setF(p=>({...p,priority:v}))} opts={[{v:'All',l:'All Priorities'},...Object.keys(SLA_TIERS).map(k=>({v:k,l:k}))]}/>
      <Sel label="SLA Policy" value={f.slaPolicyId} onChange={v=>setF(p=>({...p,slaPolicyId:v}))} opts={slaPolices.map(x=>({v:x.id,l:x.name}))}/>
      <div style={{gridColumn:'1/-1'}}>
        <label style={{fontSize:10,fontWeight:700,color:C.t2,textTransform:'uppercase',letterSpacing:'0.04em',display:'block',marginBottom:5}}>Notify Users</label>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {USERS.filter(u=>['AGENT','HELPDESK','SERVICE_MANAGER','ADMIN','SUPER_ADMIN'].includes(u.role)).map(u=>(
            <label key={u.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:C.t1,cursor:'pointer',padding:'3px 8px',border:`1px solid ${f.notifyUsers.includes(u.id)?C.primary:C.border}`,borderRadius:6,background:f.notifyUsers.includes(u.id)?C.primaryLt:'transparent'}}>
              <input type="checkbox" checked={f.notifyUsers.includes(u.id)} style={{display:'none'}} onChange={e=>setF(p=>({...p,notifyUsers:e.target.checked?[...p.notifyUsers,u.id]:p.notifyUsers.filter(x=>x!==u.id)}))}/>{u.name.split(' ')[0]}
            </label>
          ))}
        </div>
      </div>
      <div style={{gridColumn:'1/-1',display:'flex',justifyContent:'flex-end',gap:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}>
        <Btn variant="outline" onClick={()=>setSNE(false)}>Cancel</Btn>
        <Btn onClick={submit}>Create Rule</Btn>
      </div>
    </div>;
  };

  return <div style={{padding:'16px 18px',maxWidth:1200,overflowY:'auto',height:'calc(100vh - 50px)'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <div><h2 style={{fontSize:16,fontWeight:800,color:C.t1,margin:'0 0 2px'}}>SLA & Escalation Management</h2><p style={{fontSize:10,color:C.t2,margin:0}}>Monitor compliance, configure policies, manage escalation automation</p></div>
      {canEdit&&<div style={{display:'flex',gap:7}}>
        <Btn size="sm" variant="outline" icon="+" onClick={()=>setSNE(true)}>Escalation Rule</Btn>
        <Btn size="sm" icon="+" onClick={()=>setSNP(true)}>SLA Policy</Btn>
      </div>}
    </div>

    <div style={{display:'flex',gap:0,marginBottom:14,background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:3,width:'fit-content'}}>
      {[['overview','📊 Overview'],['policies','📋 SLA Policies'],['escalations','🔔 Escalation Rules'],['breaches','⚠ Breach Log']].map(([v,l])=><button key={v} onClick={()=>setTab(v)} style={{padding:'5px 13px',borderRadius:5,border:'none',background:tab===v?C.primary:'transparent',color:tab===v?'#fff':C.t2,fontSize:11,fontWeight:tab===v?700:400,cursor:'pointer',whiteSpace:'nowrap'}}>{l}</button>)}
    </div>

    {tab==='overview'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:14}}>
        {[{l:'Overall Compliance',v:`${SLA_PERF.overall.complianceRate}%`,sub:`${SLA_PERF.overall.withinSLA}/${SLA_PERF.overall.totalTickets} tickets`,c:SLA_PERF.overall.complianceRate>=90?C.success:C.warning},
          {l:'Total Breaches',v:SLA_PERF.overall.breached,sub:'Last 30 days',c:C.danger},
          {l:'Avg Response Time',v:hhmm(SLA_PERF.overall.avgResponseMins),sub:'All tickets',c:C.primary},
          {l:'Avg Resolution Time',v:hhmm(SLA_PERF.overall.avgResolveMins),sub:'All tickets',c:C.cyan},
        ].map((s,i)=><div key={i} style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:24,fontWeight:800,color:s.c,lineHeight:1}}>{s.v}</div>
          <div style={{fontSize:11,color:C.t2,marginTop:3}}>{s.l}</div>
          <div style={{fontSize:10,color:C.t3,marginTop:1}}>{s.sub}</div>
        </div>)}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>6-Month Compliance Trend</div>
          <PerfChart data={SLA_PERF.byMonth}/>
        </div>
        <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,padding:14}}>
          <div style={{fontSize:12,fontWeight:800,color:C.t1,marginBottom:10}}>Priority Breakdown</div>
          {Object.entries(SLA_PERF.byPriority).map(([k,v])=>{
            const tier=SLA_TIERS[k];
            return <div key={k} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:3,alignItems:'center'}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}><span>{tier?.icon}</span><span style={{fontSize:11,fontWeight:700,color:tier?.color}}>{k}</span><span style={{fontSize:10,color:C.t3}}>· avg {hhmm(v.avgResolveMins)} resolve</span></div>
                <span style={{fontSize:11,fontWeight:800,color:v.compliance>=90?C.success:v.compliance>=80?C.warning:C.danger}}>{v.compliance}%</span>
              </div>
              <div style={{height:7,background:'#F1F5F9',borderRadius:3}}>
                <div style={{height:7,borderRadius:3,background:v.compliance>=90?C.success:v.compliance>=80?C.warning:C.danger,width:`${v.compliance}%`,transition:'width .6s'}}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:2}}>
                <span style={{fontSize:9,color:C.t3}}>{v.within}/{v.total} within SLA</span>
                {v.breached>0&&<span style={{fontSize:9,color:C.danger,fontWeight:700}}>⚠ {v.breached} breached</span>}
              </div>
            </div>;})}
        </div>
      </div>
    </div>}

    {tab==='policies'&&<div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:12}}>
        {slaPolices.map(pol=>(
          <div key={pol.id} style={{background:C.card,borderRadius:8,border:`1px solid ${pol.active?C.primary:C.border}`,padding:14,transition:'all .15s'}} onMouseEnter={e=>{if(pol.active)e.currentTarget.style.boxShadow='0 2px 10px rgba(37,99,235,0.1)';}} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:8}}>
              <div>
                <div style={{fontSize:13,fontWeight:800,color:C.t1,marginBottom:2}}>{pol.name}</div>
                <div style={{fontSize:11,color:C.t2}}>{pol.description}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:5,alignItems:'flex-end',flexShrink:0,marginLeft:8}}>
                <span style={{fontSize:10,fontWeight:700,color:pol.active?C.success:C.t3,background:pol.active?C.successLt:'#F1F5F9',padding:'2px 8px',borderRadius:20}}>{pol.active?'Active':'Inactive'}</span>
                {canEdit&&<div style={{display:'flex',gap:4}}>
                  <Btn size="xs" variant="outline" onClick={()=>{setEP(pol);setSNP(true);}}>Edit</Btn>
                  <Btn size="xs" variant={pol.active?'outline':'success'} onClick={()=>togglePolicy(pol.id)}>{pol.active?'Disable':'Enable'}</Btn>
                </div>}
              </div>
            </div>
            <div style={{fontSize:10,color:C.t3,marginBottom:8,background:'#F8FAFC',padding:'4px 8px',borderRadius:5}}>📋 {pol.scope}</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:5}}>
              {Object.entries(pol.tiers||{}).map(([p,t])=>{
                const tier=SLA_TIERS[p];
                return <div key={p} style={{background:`${tier?.color}0C`,border:`1px solid ${tier?.border||C.border}`,borderRadius:6,padding:'6px 8px',textAlign:'center'}}>
                  <div style={{fontSize:10,fontWeight:800,color:tier?.color}}>{tier?.icon}{p}</div>
                  <div style={{fontSize:9,color:C.t2,marginTop:2}}>R:{t.responseH}h</div>
                  <div style={{fontSize:9,color:C.t2}}>Fix:{t.resolveH}h</div>
                </div>;})}
            </div>
            <div style={{marginTop:8,fontSize:10,color:C.t3,display:'flex',gap:8}}>
              <span>{pol.businessHours?.enabled?`⏰ ${pol.businessHours.start}–${pol.businessHours.end}`:'⏰ 24×7'}</span>
              {pol.businessHours?.excludeWeekends&&<span>· No weekends</span>}
              <span style={{marginLeft:'auto'}}>Updated by {USERS.find(u=>u.id===pol.updatedBy)?.name||'—'}</span>
            </div>
          </div>
        ))}
      </div>
    </div>}

    {tab==='escalations'&&<div>
      <div style={{background:C.warningLt,border:'1px solid #FDE68A',borderRadius:8,padding:'10px 14px',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:800,color:C.warning,marginBottom:2}}>🔔 Escalation Rules Engine</div>
        <div style={{fontSize:11,color:C.t2}}>{escRules.filter(r=>r.active).length} active rules · {escRules.reduce((s,r)=>s+r.fireCount,0)} total triggers since activation</div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {escRules.map(r=>(
          <div key={r.id} style={{background:C.card,borderRadius:8,border:`1px solid ${r.active?C.border:C.borderFaint}`,padding:'12px 14px',opacity:r.active?1:0.65,transition:'all .15s'}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
              <div style={{flex:1}}>
                <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:5}}>
                  <span style={{fontFamily:'monospace',fontSize:9,color:C.t3}}>{r.id}</span>
                  <Tag label={r.trigger} color={C.orange} bg={C.orangeLt}/>
                  <Tag label={r.action} color={C.primary} bg={C.primaryLt}/>
                  {r.priority!=='All'&&<Tag label={`P: ${r.priority}`} color={C.t2} bg='#F1F5F9'/>}
                  <span style={{fontSize:10,fontWeight:700,color:r.active?C.success:C.t3,background:r.active?C.successLt:'#F1F5F9',padding:'2px 7px',borderRadius:20}}>{r.active?'Active':'Disabled'}</span>
                </div>
                <div style={{fontSize:13,fontWeight:700,color:C.t1,marginBottom:4}}>{r.name}</div>
                <div style={{fontSize:11,color:C.t2,marginBottom:4,background:'#F8FAFC',padding:'5px 8px',borderRadius:5,borderLeft:`2px solid ${C.t3}`}}>When: {r.condition}</div>
                <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:C.t3}}>Fired {r.fireCount}x</span>
                  {r.lastFired&&<span style={{fontSize:10,color:C.t3}}>Last: {r.lastFired}</span>}
                  <span style={{fontSize:10,color:C.t3}}>Policy: {slaPolices.find(p=>p.id===r.slaPolicyId)?.name||'—'}</span>
                </div>
                {r.notifyUsers?.length>0&&<div style={{display:'flex',gap:4,marginTop:6,flexWrap:'wrap'}}>
                  <span style={{fontSize:10,color:C.t3}}>Notifies:</span>
                  {r.notifyUsers.map(uid=>{const u=USERS.find(x=>x.id===uid);if(!u)return null;return <div key={uid} style={{display:'flex',alignItems:'center',gap:4,background:'#F1F5F9',borderRadius:20,padding:'2px 7px'}}>
                    <Avatar name={u.name} size={14}/><span style={{fontSize:10,color:C.t2}}>{u.name.split(' ')[0]}</span>
                  </div>;})}
                </div>}
              </div>
              {canEdit&&<Btn size="sm" variant={r.active?'warning':'success'} onClick={()=>toggleRule(r.id)} sx={{flexShrink:0}}>{r.active?'Disable':'Enable'}</Btn>}
            </div>
          </div>
        ))}
      </div>
    </div>}

    {tab==='breaches'&&<div>
      <div style={{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}}>
        {Object.entries(SLA_PERF.byPriority).map(([k,v])=><div key={k} style={{background:C.card,borderRadius:7,border:`1px solid ${v.breached>0?SLA_TIERS[k]?.border||C.border:C.border}`,padding:'9px 14px',flex:1,minWidth:120}}>
          <div style={{fontSize:11,fontWeight:700,color:SLA_TIERS[k]?.color||C.t2}}>{SLA_TIERS[k]?.icon} {k}</div>
          <div style={{fontSize:22,fontWeight:800,color:v.breached>0?C.danger:C.success,lineHeight:1.2}}>{v.breached}</div>
          <div style={{fontSize:10,color:C.t3}}>breaches · {v.compliance}% SLA</div>
        </div>)}
      </div>

      <div style={{background:C.card,borderRadius:8,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <div style={{padding:'11px 14px',borderBottom:`1px solid ${C.border}`,fontSize:12,fontWeight:800,color:C.t1}}>Recent SLA Breaches</div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',minWidth:700}}>
            <thead><tr style={{background:'#F8FAFC',borderBottom:`1px solid ${C.border}`}}>
              {['Ticket','Priority','Type','SLA Policy','Breached By','Agent','Dept','Time'].map(h=><th key={h} style={{padding:'7px 11px',fontSize:9,fontWeight:800,color:C.t3,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.07em',whiteSpace:'nowrap'}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {SLA_PERF.recentBreaches.map((b,i)=><tr key={i} style={{borderBottom:`1px solid ${C.borderFaint}`}}>
                <td style={{padding:'8px 11px',fontFamily:'monospace',fontSize:11,color:C.danger,fontWeight:800}}>{b.id}</td>
                <td style={{padding:'8px 11px'}}><span style={{fontSize:10,fontWeight:800,color:SLA_TIERS[b.priority]?.color||C.t2}}>{SLA_TIERS[b.priority]?.icon} {b.priority}</span></td>
                <td style={{padding:'8px 11px'}}><span style={{fontSize:10,fontWeight:700,color:b.type==='Response'?C.orange:C.danger,background:b.type==='Response'?C.orangeLt:C.dangerLt,padding:'2px 7px',borderRadius:20}}>{b.type} SLA</span></td>
                <td style={{padding:'8px 11px',fontSize:11,color:C.t2,whiteSpace:'nowrap'}}>{b.slaPolicy}</td>
                <td style={{padding:'8px 11px'}}><span style={{fontSize:11,fontWeight:800,color:C.danger}}>+{b.breachedBy}</span></td>
                <td style={{padding:'8px 11px',fontSize:11,color:C.t2}}>{b.agent}</td>
                <td style={{padding:'8px 11px',fontSize:11,color:C.t2}}>{b.dept}</td>
                <td style={{padding:'8px 11px',fontSize:10,color:C.t3,whiteSpace:'nowrap'}}>{b.at}</td>
              </tr>)}
              {SLA_PERF.recentBreaches.length===0&&<tr><td colSpan={8} style={{padding:40,textAlign:'center',color:C.t3}}>No recent breaches</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>}

    <Modal open={showNewPol||!!editPolicy} title={editPolicy?`Edit: ${editPolicy.name}`:'Create SLA Policy'} onClose={()=>{setSNP(false);setEP(null);}} width={680}>
      <NewPolicyForm existing={editPolicy}/>
    </Modal>
    <Modal open={showNewEsc} title="Create Escalation Rule" onClose={()=>setSNE(false)} width={580}>
      <NewEscRuleForm/>
    </Modal>
  </div>;
};

// ─── MODULE SHELL ─────────────────────────────────
const Shell=({module})=>{
  const M={incidents:{t:'Incident Management',icon:'🚨',color:C.danger,pt:'Part 3 ✓'},service_req:{t:'Service Requests',icon:'📋',color:C.success,pt:'Part 3 ✓'},imac:{t:'IMAC',icon:'🔄',color:C.primary,pt:'Part 2 ✓'},problems:{t:'Problem Management',icon:'🔍',color:C.warning,pt:'Part 4 ✓'},changes:{t:'Change Management',icon:'🔧',color:C.purple,pt:'Part 4 ✓'},cmdb:{t:'Asset & CMDB',icon:'🖥️',color:C.cyan,pt:'Part 5 ✓'},employees:{t:'Employee Mgmt',icon:'👥',color:C.primary,pt:'Part 2 ✓'},users:{t:'User Mgmt',icon:'🔐',color:C.primary,pt:'Part 1 ✓'},reports:{t:'Reports & Analytics',icon:'📊',color:C.purple,pt:'Part 7 — Next!'}};
  const c=M[module]||{t:module,icon:'📋',color:C.primary,pt:'Upcoming'};
  return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'calc(100vh - 110px)'}}>
    <div style={{textAlign:'center',maxWidth:400}}>
      <div style={{width:64,height:64,borderRadius:16,background:`${c.color}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,margin:'0 auto 14px'}}>{c.icon}</div>
      <h2 style={{fontSize:18,fontWeight:800,color:C.t1,margin:'0 0 6px'}}>{c.t}</h2>
      <div style={{background:`${c.color}0D`,border:`1px dashed ${c.color}60`,borderRadius:8,padding:'10px 14px',display:'inline-flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:16}}>{'Part 7'===c.pt?'🔨':'✅'}</span><div><div style={{fontSize:10,fontWeight:800,color:c.color}}>{c.pt}</div><div style={{fontSize:10,color:C.t2}}>{'Part 7'===c.pt?'Coming next!':'Module complete'}</div></div>
      </div>
    </div>
  </div>;
};

// ─── LOGIN ────────────────────────────────────────
const Login=({onLogin})=>{
  const[email,setEmail]=useState('');const[pw,setPw]=useState('');const[loading,setL]=useState(false);const[err,setErr]=useState('');const[sel,setSel]=useState(null);
  const DEMOS=[{r:'SUPER_ADMIN',e:'superadmin@itsm.com',p:'Admin@123'},{r:'ADMIN',e:'admin@itsm.com',p:'Admin@123'},{r:'EMPLOYEE',e:'employee@company.com',p:'Employee@123'},{r:'HELPDESK',e:'helpdesk@company.com',p:'Helpdesk@123'},{r:'AGENT',e:'agent@company.com',p:'Agent@123'},{r:'SERVICE_MANAGER',e:'manager@company.com',p:'Manager@123'}];
  const fill=d=>{setEmail(d.e);setPw(d.p);setSel(d.r);setErr('');};
  const sub=e=>{e.preventDefault();if(!email||!pw){setErr('Enter credentials');return;}setL(true);setTimeout(()=>{const u=USERS.find(x=>x.email===email&&x.pw===pw);if(!u){setErr('Invalid credentials');setL(false);return;}onLogin(u);},600);};
  return <div style={{minHeight:'100vh',display:'flex',background:C.bg}}>
    <div style={{width:'42%',background:'linear-gradient(150deg,#0D1B2A,#064E3B 60%,#065F46)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:40,position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-60,left:-60,width:260,height:260,borderRadius:'50%',background:'rgba(5,150,105,0.08)'}}/>
      <div><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:36,height:36,borderRadius:8,background:C.emerald,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>⚡</div><div><div style={{fontSize:17,fontWeight:800,color:'#fff'}}>ITSM<span style={{color:'#6EE7B7'}}>Pro</span></div><div style={{fontSize:8,color:'#064E3B',letterSpacing:'0.1em',textTransform:'uppercase'}}>Enterprise Service Mgmt</div></div></div></div>
      <div>
        <div style={{fontSize:10,fontWeight:700,color:'#6EE7B7',letterSpacing:'0.1em',marginBottom:6}}>✅ Part 6 Live</div>
        <h1 style={{fontSize:26,fontWeight:800,color:'#fff',margin:'0 0 10px',lineHeight:1.2}}>Knowledge Base<br/><span style={{color:'#6EE7B7'}}>&amp; SLA Management</span></h1>
        {['12 KB Articles with Rich Markdown Content','Category + Product Area Filtering','Full-Text Article Search','Internal vs Public Article Visibility','Helpful/Not Helpful Voting','Article View Tracking','3-Level SLA Policies (Response/Resolve/Escalate)','4 SLA Policy Templates','6 Escalation Automation Rules','SLA Breach Tracking + Bar Charts','Enable/Disable Rules & Policies','Create New Rules with Notify Users'].map((f,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}><div style={{width:14,height:14,borderRadius:'50%',background:'rgba(110,231,183,0.2)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><div style={{width:5,height:5,borderRadius:'50%',background:'#6EE7B7'}}/></div><span style={{fontSize:11,color:'#94A3B8'}}>{f}</span></div>)}
      </div>
      <div style={{display:'flex',gap:20,borderTop:'1px solid rgba(255,255,255,0.07)',paddingTop:16}}>{[['12','KB Articles'],['4','SLA Policies'],['6','Esc. Rules']].map(([v,l])=><div key={l}><div style={{fontSize:16,fontWeight:800,color:'#fff'}}>{v}</div><div style={{fontSize:10,color:'#064E3B'}}>{l}</div></div>)}</div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:'40px 50px'}}>
      <div style={{width:'100%',maxWidth:380}}>
        <h2 style={{fontSize:22,fontWeight:800,color:C.t1,margin:'0 0 4px'}}>Sign In</h2>
        <p style={{fontSize:12,color:C.t2,margin:'0 0 18px'}}>ITSM Pro — Part 6</p>
        <div style={{background:'#F8FAFC',border:`1px solid ${C.border}`,borderRadius:8,padding:12,marginBottom:18}}>
          <p style={{fontSize:9,fontWeight:800,color:C.t3,letterSpacing:'0.1em',textTransform:'uppercase',margin:'0 0 7px'}}>Quick Login</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {DEMOS.map(d=>{const m=ROLE_META[d.r];const a=sel===d.r;return <button key={d.r} onClick={()=>fill(d)} style={{padding:'3px 8px',borderRadius:20,fontSize:10,fontWeight:700,border:`1px solid ${a?m.color:m.border}`,background:a?m.bg:'#fff',color:a?m.color:C.t2,cursor:'pointer'}}>{m.label}</button>;})}
          </div>
        </div>
        <form onSubmit={sub} style={{display:'flex',flexDirection:'column',gap:11}}>
          <Input label="Email" type="email" value={email} onChange={setEmail} required placeholder="you@company.com"/>
          <Input label="Password" type="password" value={pw} onChange={setPw} required placeholder="Password"/>
          {err&&<div style={{padding:'8px 11px',background:C.dangerLt,border:`1px solid #FECACA`,borderRadius:6,fontSize:12,color:C.danger}}>⚠ {err}</div>}
          <Btn type="submit" size="lg" disabled={loading} sx={{width:'100%',justifyContent:'center',marginTop:3}}>{loading?'Signing in…':'Sign In →'}</Btn>
        </form>
      </div>
    </div>
  </div>;
};

// ─── MAIN APP ─────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[articles,setArticles]=useState(SEED_KB);
  const[slaPolices,setSLAPolices]=useState(SEED_SLA_POLICIES);
  const[escRules,setEscRules]=useState(SEED_ESC_RULES);
  const[active,setActive]=useState('dashboard');
  const[col,setCol]=useState(false);
  const[toasts,setToasts]=useState([]);
  const addToast=(type,msg)=>{const id=Date.now();setToasts(p=>[...p,{id,type,msg}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),4200);};
  const login=u=>{setUser(u);setActive('dashboard');addToast('success',`Welcome, ${u.name}!`);};
  const logout=()=>{setUser(null);setActive('dashboard');};
  if(!user)return <Login onLogin={login}/>;
  const sw=col?56:228;
  const render=()=>{
    if(active==='dashboard')return <Dashboard user={user} articles={articles} slaPolices={slaPolices} escRules={escRules}/>;
    if(active==='knowledge')return <KBModule me={user} articles={articles} setArticles={setArticles} addToast={addToast}/>;
    if(active==='sla')return <SLAModule me={user} slaPolices={slaPolices} setSLAPolices={setSLAPolices} escRules={escRules} setEscRules={setEscRules} addToast={addToast}/>;
    return <Shell module={active}/>;
  };
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <Sidebar user={user} active={active} onNav={m=>setActive(m)} col={col} setCol={setCol}/>
    <div style={{marginLeft:sw,flex:1,transition:'margin-left .2s',display:'flex',flexDirection:'column',minHeight:'100vh'}}>
      <Header user={user} active={active} onLogout={logout}/>
      <main style={{flex:1,overflow:'hidden'}}>{render()}</main>
    </div>
    <Toast toasts={toasts} rem={id=>setToasts(p=>p.filter(t=>t.id!==id))}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
